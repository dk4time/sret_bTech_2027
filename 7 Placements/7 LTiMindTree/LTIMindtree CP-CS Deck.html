document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

iv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Data Types and Arithmetic<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:30px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:14px 24px;text-align:left\">Type<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:14px 24px;text-align:left\">Size<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:14px 24px;text-align:left\">Example<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">char<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE\">1 byte<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">'A' → 65<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">int<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE\">4 bytes<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">7 / 2 → 3<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">float<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE\">4 bytes<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">7.0 / 2 → 3.5<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">double<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE\">8 bytes<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">7 / 2.0 → 3.5<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<span style=\"font-size:24px;color:#5A6478;line-height:1.4\">Typical 32/64-bit C compiler. Java fixes sizes; its char is 2 bytes.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:26px;font-size:32px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>int ÷ int truncates toward zero: <b style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">-7 / 2 = -3<\u002Fb><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>% takes the sign of the dividend (C, Java): <b style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">-7 % 3 = -1<\u002Fb><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Python floors instead: <b style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">-7 // 2 = -4<\u002Fb>, <b style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">-7 % 3 = 2<\u002Fb><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Mixed types promote: int + float → float<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>char is a number: <b style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">'A' + 2 = 67 = 'C'<\u002Fb><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A1 · Concept 2\" data-speaker-notes=\"Precedence ladder, pre vs post increment, short-circuit.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A1 · Data Types &amp; Operators<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Precedence, Increment and Short-Circuit<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;padding:36px 0\">\n<div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:27px\">\n<span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:24px;color:#5A6478;margin-bottom:6px\">HIGHEST ↓<\u002Fspan>\n<div style=\"background:#2B4C8A;color:#fff;padding:7px 20px;border-radius:4px\">()  []  x++  x--<\u002Fdiv>\n<div style=\"background:#3B5C98;color:#fff;padding:7px 20px;border-radius:4px\">++x  --x  !  ~  unary -   (R→L)<\u002Fdiv>\n<div style=\"background:#4C6CA6;color:#fff;padding:7px 20px;border-radius:4px\">*  /  %<\u002Fdiv>\n<div style=\"background:#5D7CB3;color:#fff;padding:7px 20px;border-radius:4px\">+  -<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">&lt;&lt;  &gt;&gt;<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">&lt;  &lt;=  &gt;  &gt;=<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">==  !=<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">&amp;  then  ^  then  |<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">&amp;&amp;  then  ||<\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;padding:7px 20px;border-radius:4px\">?:  then  =  +=  -=   (R→L)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:28px;font-size:32px;line-height:1.35\">\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px\"><b style=\"font-family:'JetBrains Mono',monospace;color:#2B4C8A\">x++<\u002Fb><span>use the old value, then add 1<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px\"><b style=\"font-family:'JetBrains Mono',monospace;color:#2B4C8A\">++x<\u002Fb><span>add 1, then use the new value<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px\"><b style=\"font-family:'JetBrains Mono',monospace;color:#2B4C8A\">a &amp;&amp; b<\u002Fb><span>b is skipped when a is false<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px\"><b style=\"font-family:'JetBrains Mono',monospace;color:#2B4C8A\">a || b<\u002Fb><span>b is skipped when a is true<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px\"><b style=\"font-family:'JetBrains Mono',monospace;color:#2B4C8A\">c ? x : y<\u002Fb><span>x if c is non-zero, else y<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A1 · What they ask\" data-speaker-notes=\"Three patterns: precedence evaluation, pre/post increment, short-circuit side effects.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A1 · Data Types &amp; Operators<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Operators<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Evaluate by precedence<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:28px;white-space:pre\">x = 5 + 3 * 2 % 4;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">3 * 2 = 6 → 6 % 4 = 2 → 5 + 2<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">x = 7<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Pre vs post increment<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:28px;white-space:pre\">a = 5;\nb = a++;\nc = ++a;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">b takes 5, a → 6; then a → 7, c takes 7<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">a = 7, b = 5, c = 7<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Short-circuit side effects<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:28px;white-space:pre\">x = 0; y = 5;\nif (x++ &amp;&amp; y++)\n    y += 10;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">x++ gives 0 (false), so y++ never runs<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">x = 1, y = 5<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A1 · Trap\" data-speaker-notes=\"Recognise undefined behaviour instead of computing it.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A1 · Data Types &amp; Operators<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: Undefined Behaviour<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:32px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int i = 5;<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>i = i++ + ++i;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>printf(\"%d\", i);<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">Students compute 11, 12 or 13 and pick whichever option matches.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">In C/C++, <b>i<\u002Fb> is modified twice in one expression — the result is undefined.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Pick <b>\"Compiler dependent / Undefined\"<\u002Fb> when it is offered.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">Java evaluates left to right: 5 + 7 → i = 12.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A1 · MCQ\" data-speaker-notes=\"Pause here. Give students 1.5 minutes.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A1 · Data Types &amp; Operators<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Division and Modulus<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px\">What is the output of the following C code?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int a = 10, b = 3, c;<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>float f;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>c = a / b * b + a % b;<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>f = a / b;<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>printf(\"%d %.1f\", c, f);<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top om:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">x &amp; (x - 1)<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE\">clears the lowest set bit; 0 ⇒ power of 2<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">12 &amp; 11 = 8<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">repeat n = n &amp; (n-1)<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE\">loop count = number of set bits<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">7 → 3 loops<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">a^=b; b^=a; a^=b<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE\">swaps a and b, no temp<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">3,8 → 8,3<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">XOR of all items<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE\">the one element without a pair<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">4^7^4 = 7<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">x &lt;&lt; k,  x &gt;&gt; k<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE\">× 2ᵏ,  ÷ 2ᵏ<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 24px;border-bottom:1px solid #D5DEEE n;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A3 · Control Flow &amp; Loops<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Loops and Switch<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">How many times?<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">for i = 1 to 4\n  for j = i to 4\n    count++<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">4 + 3 + 2 + 1 (previous slide)<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">10 times<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Switch fall-through<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">x = 2; s = 0;\nswitch (x) {\n case 1: s += 1;\n case 2: s += 2;\n case 3: s += 3; break;\n default: s += 10;\n}<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Enters at case 2, falls into case 3, stops at break<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">s = 5<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Loop bounds<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">for (i = 1; i &lt; 10; i += 3)\n    print(i);<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">i = 1, 4, 7; next is 10, which fails i &lt; 10<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">3 iterations<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A3 · Trap\" data-speaker-notes=\"A semicolon after for() makes the body empty.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A3 · Control Flow &amp; Loops<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: Semicolon After the Loop Header<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:32px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int i, sum = 0;<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>for (i = 1; i &lt;= 5; i++);<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>    sum = sum + i;<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>printf(\"%d\", sum);<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">The indentation says \"sum of 1 to 5\", so students pick 15.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">The <b>;<\u002Fb> on line 2 is an empty loop body. The loop only moves i to 6.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Line 3 runs once: sum = 0 + 6. Output: <b>6<\u002Fb>.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">Ignore indentation — only braces and semicolons define the body.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A3 · MCQ\" data-speaker-notes=\"Pause. Ask students to draw the i/j/c trace table.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex San
