02Fsc-raw-td><sc-raw-td style=\"padding:10px 22px;border-bottom:1px solid #D5DEEE;text-align:right\">6<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 28px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#fff;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">B<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:600\">6<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:32px;line-height:1.45\">continue skips <b style=\"font-family:'JetBrains Mono',monospace\">c += j<\u002Fb> only when j is 2; j++ still runs.<\u002Fspan>\n<span style=\"font-size:30px;line-height:1.45;color:#3A4456\">10 is the answer without the continue line.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · Concept 1\" data-speaker-notes=\"Copies vs addresses; static locals persist.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Parameters and Static Variables<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:26px;font-size:31px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span><b>Call by value:<\u002Fb> the function gets a copy; the caller's variable is unchanged<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span><b>Call by reference<\u002Fb> (C: pass <b style=\"font-family:'JetBrains Mono',monospace\">&amp;x<\u002Fb>): the function can change the caller's variable<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Java is always pass-by-value; object references are copied<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span><b>static<\u002Fb> local: initialised once, keeps its value between calls<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:22px 30px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">void swap(int a, int b) {\n  int t = a; a = b; b = t;\n}\nx = 1; y = 2; swap(x, y);<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n<div style=\"border:2px solid #2B4C8A;border-radius:8px;overflow:hidden\"><div style=\"background:#2B4C8A;color:#fff;padding:10px 20px;font-size:26px;font-weight:600\">main frame<\u002Fdiv><div style=\"padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:28px;display:flex;flex-direction:column;gap:6px\"><span>x = 1<\u002Fspan><span>y = 2<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"border:2px dashed #2B4C8A;border-radius:8px;overflow:hidden\"><div style=\"background:#EAF0FA;color:#2B4C8A;padding:10px 20px;font-size:26px;font-weight:600\">swap frame (copies)<\u002Fdiv><div style=\"padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:28px;display:flex;flex-direction:column;gap:6px\"><span>a = 1 → 2<\u002Fspan><span>b = 2 → 1<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:28px;color:#3A4456\">swap frame is destroyed on return: x, y stay 1, 2.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · Concept 2\" data-speaker-notes=\"Each call gets its own frame. Calls push down, returns unwind up.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Recursion and the Call Stack<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:28px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:26px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int fact(int n) {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  if (n &lt;= 1) return 1;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  return n * fact(n - 1);<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:22px;font-size:31px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>The base case stops the calls<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Every call gets its own frame with its own n<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Code before the call runs going down; code after runs coming back up<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 140px;gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;font-family:'JetBrains Mono',monospace;font-size:28px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:6px;padding:18px 24px;display:flex;justify-content:space-between\"><span>fact(1)<\u002Fspan><span>returns 1<\u002Fspan><\u002Fdiv>\n<div style=\"background:#4C6CA6;color:#fff;border-radius:6px;padding:18px 24px;display:flex;justify-content:space-between\"><span>fact(2)<\u002Fspan><span>2 * 1 = 2<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#1B2230;border-radius:6px;padding:18px 24px;display:flex;justify-content:space-between\"><span>fact(3)<\u002Fspan><span>3 * 2 = 6<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;color:#1B2230;border-radius:6px;padding:16px 24px;display:flex;justify-content:space-between\"><span>main<\u002Fspan><span>gets 6<\u002Fspan><\u002Fdiv>\n<span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:24px;color:#5A6478\">Top of stack = most recent call<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;justify-content:space-between;font-size:24px;font-weight:600;color:#2B4C8A;padding:8px 0 40px\"><span>↑ push (call)<\u002Fspan><span>↓ pop (return)<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · What they ask\" data-speaker-notes=\"Print order, static counters, return value plus call count.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Functions and Recursion<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Static counter<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int count() {\n  static int c = 0;\n  c += 2;\n  return c;\n}\ncount(); count();\nprint(count());<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">c is set to 0 once: 2, 4, 6<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Prints 6<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Return value<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int s(int n) {\n  if (n == 0) return 0;\n  return n % 10 + s(n / 10);\n}\nprint(s(472));<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">2 + 7 + 4 + 0, over 4 calls<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Prints 13<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Count the calls<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">calls(n) =\n  1 + calls(n-1)\n    + calls(n-2)\ncalls(0) = calls(1) = 1<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">For two-branch recursion like Fibonacci: draw the tree, count the nodes<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">See the MCQ<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · Trap\" data-speaker-notes=\"Print after the recursive call reverses the order.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: Code After the Recursive Call<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:32px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>void f(int n) {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  if (n == 0) return;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  f(n - 1);<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>  printf(\"%d \", n);<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>}<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>f(3);<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">Reading top-down, students answer 3 2 1.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">The print runs while the calls <b>return<\u002Fb>, so f(1) prints first. Output: <b>1 2 3<\u002Fb>.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Print before the call → 3 2 1. Print after the call → 1 2 3.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">No base case → calls never stop → stack overflow.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · MCQ\" data-speaker-notes=\"Pause. Have students draw the call tree.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Counting Recursive Calls<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px;line-height:1.35\">What does f(4) return, and how many times is f called in total (including f(4))?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int f(int n) {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  if (n &lt;= 1) return n;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  return f(n - 1) + f(n - 2);<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:62px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">A<\u002Fspan><span style=\"font-size:32px\">Returns 3, 9 calls<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">B<\u002Fspan><span style=\"font-size:32px\">Returns 3, 8 calls<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">C<\u002Fspan><span style=\"font-size:32px\">Returns 5, 9 calls<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">D<\u002Fspan><span style=\"font-size:32px\">Returns 4, 7 calls<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A4 · Answer\" data-speaker-notes=\"Nine nodes in the call tree. Leaves return 1 or 0 and add up to 3.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A4 · Functions &amp; Recursion<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Answer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Answer: Counting Recursive Calls<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;padding:32px 0;align-items:start\">\n<svg sc-camel-view-box=\"0 0 960 470\" style=\"width:100%;height:auto;font-family:'JetBrains Mono',monospace\">\n<g stroke=\"#2B4C8A\" stroke-width=\"3\"><line x1=\"480\" y1=\"70\" x2=\"260\" y2=\"150\"><\u002Fline><line x1=\"480\" y1=\"70\" x2=\"720\" y2=\"150\"><\u002Fline><line x1=\"260\" y1=\"210\" x2=\"140\" y2=\"270\"><\u002Fline><line x1=\"260\" y1=\"210\" x2=\"380\" y2=\"270\"><\u002Fline><line x1=\"720\" y1=\"210\" x2=\"620\" y2=\"270\"><\u002Fline><line x1=\"720\" y1=\"210\" x2=\"840\" y2=\"270\"><\u002Fline><line x1=\"140\" y1=\"330\" x2=\"80\" y2=\"390\"><\u002Fline><line x1=\"140\" y1=\"330\" x2=\"220\" y2=\"390\"><\u002Fline><\u002Fg>\n<g font-size=\"26\"><rect x=\"390\" y=\"10\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#2B4C8A\"><\u002Frect><text x=\"480\" y=\"50\" text-anchor=\"middle\" fill=\"#fff\">f(4) = 3<\u002Ftext>\n<rect x=\"170\" y=\"150\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#4C6CA6\"><\u002Frect><text x=\"260\" y=\"190\" text-anchor=\"middle\" fill=\"#fff\">f(3) = 2<\u002Ftext>\n<rect x=\"630\" y=\"150\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#4C6CA6\"><\u002Frect><text x=\"720\" y=\"190\" text-anchor=\"middle\" fill=\"#fff\">f(2) = 1<\u002Ftext>\n<rect x=\"50\" y=\"270\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"140\" y=\"310\" text-anchor=\"middle\" fill=\"#1B2230\">f(2) = 1<\u002Ftext>\n<rect x=\"290\" y=\"270\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"380\" y=\"310\" text-anchor=\"middle\" fill=\"#1B2230\">f(1) = 1<\u002Ftext>\n<rect x=\"530\" y=\"270\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"620\" y=\"310\" text-anchor=\"middle\" fill=\"#1B2230\">f(1) = 1<\u002Ftext>\n<rect x=\"750\" y=\"270\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"840\" y=\"310\" text-anchor=\"middle\" fill=\"#1B2230\">f(0) = 0<\u002Ftext>\n<rect x=\"0\" y=\"390\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"80\" y=\"430\" text-anchor=\"middle\" fill=\"#1B2230\">f(1) = 1<\u002Ftext>\n<rect x=\"180\" y=\"390\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#EAF0FA\"><\u002Frect><text x=\"260\" y=\"430\" text-anchor=\"middle\" fill=\"#1B2230\">f(0) = 0<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 28px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#fff;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">A<\u002Fspan><span style=\"font-size:36px;font-weight:600\">Returns 3, 9 calls<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:32px;line-height:1.45\">Every box is one call: 9 nodes. Values add up from the leaves.<\u002Fspan>\n<span style=\"font-size:30px;line-height:1.45;color:#3A4456\">f(2) is computed twice — that repeat is why the count grows so fast.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A5 · Concept 1\" data-speaker-notes=\"Index from 0, address formula, row-major, no bounds check in C.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A5 · Arrays &amp; Strings<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Arrays in Memory<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:44px;padding:40px 0\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:28px\">int a[5] = {3, 8, 1, 6, 4};<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(5,180px);font-family:'JetBrains Mono',monospace;text-align:center\">\n<span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[0]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[1]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[2]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[3]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[4]<\u002Fspan>\n<span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;background:#EAF0FA;padding:18px 0\">3<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">8<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">1<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">6<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">4<\u002Fspan>\n<span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1000<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1004<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1008<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1012<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1016<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 64px;font-size:30px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Address of a[i] = base + i × size<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>2D is row-major: a[i][j] at base + (i × cols + j) × size<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>C has no bounds check: a[5] is undefined. Java throws ArrayIndexOutOfBoundsException<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Passing an array passes its address: the function can change it<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A5 · Concept 2\" data-speaker-notes=\"Null terminator, strlen vs sizeof, palindrome and frequency loops.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A5 · Arrays &amp; Strings<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Strings in C<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:44px;padding:40px 0\">\n<div style=\"display:flex;gap:64px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:28px\">char s[] = \"HELLO\";<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(6,120px);font-family:'JetBrains Mono',monospace;text-align:center\">\n<span style=\"font-size:24px;color:#5A6478;padding:6px 0\">0<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">2<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">3<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">4<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">5<\u002Fspan>\n<span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;background:#EAF0FA;padding:16px 0\">H<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">E<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">L<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">L<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">O<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#2B4C8A;color:#fff;padding:16px 0\">\\0<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;font-family:'JetBrains Mono',monospace;font-size:34px\"><span><b style=\"color:#2B4C8A\">strlen(s)<\u002Fb> = 5<\u002Fspan><span><b style=\"color:#2B4C8A\">sizeof(s)<\u002Fb> = 6<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 64px;font-size:30px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>strlen stops at '\\0' and does not count it<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>char s[5] = \"HELLO\" leaves no room for '\\0'<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Palindrome: compare s[i] with s[n-1-i] for i &lt; n/2<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>Frequency: <b style=\"font-family:'JetBrains Mono',monospace\">count[ch - 'a']++<\u002Fb><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A5 · What they ask\" data-speaker-notes=\"Address calculation, sizeof vs strlen, palindrome loop.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A5 · Arrays &amp; Strings<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Arrays and Strings<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">2D address<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int a[3][4];\nbase = 1000, int = 4 B\n&amp;a[2][1] = ?<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">1000 + (2 × 4 + 1) × 4<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">1036<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">sizeof vs strlen<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">char s[] = \"LEVEL\";\nprintf(\"%d %d\",\n  sizeof(s), strlen(s));<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">sizeof counts the '\\0'; strlen does not<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">6 5<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Loop over a string<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">s = \"MADAM\", n = 5\nfor (i = 0; i &lt; n/2; i++)\n  if (s[i] != s[n-1-i])\n    return 0;\nreturn 1;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Compares M–M, A–A; the middle D is never checked<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Returns 1, 2 comparisons<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A5 · Trap\" data-speaker-notes=\"Arrays decay to pointers when passed. Pass the length separately.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A5 · Arrays &amp; Strings<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: sizeof Inside a Function<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>void show(int a[]) {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  printf(\"%d\",<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>    sizeof(a) / sizeof(a[0]));<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>}<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>int arr[10];<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>show(arr);<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">Students answer 10, the array length.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Inside show, <b style=\"font-family:'JetBrains Mono',monospace\">a<\u002Fb> is an <b>int*<\u002Fb>. sizeof(a) is the pointer size: 8 / 4 = <b>2<\u002Fb> on a 64-bit system.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Fix: pass the length as a separate parameter.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">In main, sizeof(arr) / sizeof(arr[0]) does give 10.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A5 · MCQ\" data-speaker-notes=\"Pause. Track the array after each swap.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A5 · Arrays &amp; Strings<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: In-Place Reversal<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px\">What is the output of the following C code?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:29px;line-height:1.5;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int a[] = {3, 8, 1, 6, 4};<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>int i, t;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>for (i = 0; i &lt; 5 / 2; i++) {<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>  t = a[i];<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>  a[i] = a[4 - i];<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>  a[4 - i] = t;<\u002Fspan><span style=\"color:#6B7588\">7<\u002Fspan><span>}<\u002Fspan><span style=\"color:#6B7588\">8<\u002Fspan >Pointer Arithmetic with Arrays<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:44px;padding:40px 0\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:28px\">int a[4] = {10, 20, 30, 40};  int *p = a;<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(4,220px);font-family:'JetBrains Mono',monospace;text-align:center\">\n<span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p ↓<\u002Fspan><span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p + 1 ↓<\u002Fspan><span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p + 2 ↓<\u002Fspan><span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p + 3 ↓<\u002Fspan>\n<span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;background:#EAF0FA;padding:18px 0\">10<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">20<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">30<\u002Fspan><span style=\"font-size:36px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:18px 0\">40<\u002Fspan>\n<span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1000<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1004<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1008<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">1012<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 64px;font-size:30px;line-height:1.35\">\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>p + 1 moves by sizeof(int) = 4 bytes, not 1<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span><b style=\"font-family:'JetBrains Mono',monospace\">a[i] == *(a + i) == *(p + i)<\u002Fb><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>p++ moves the pointer; (*p)++ changes the value<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:20px\"><span style=\"color:#2B4C8A;font-weight:700\">—<\u002Fspan><span>(p + 3) - p = 3: subtraction counts elements, not bytes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A6 · Concept 3\" data-speaker-notes=\"NULL, heap allocation, dangling pointers, leaks.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A6 · Pointers &amp; Memory<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">NULL, Dangling Pointers and malloc<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0;align-items:start\">\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">NULL<\u002Fspan><div style=\"background:#FFFFFF;border-radius:6px;padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:26px;white-space:pre\">int *p = NULL;<\u002Fdiv><span style=\"font-size:29px;line-height:1.4\">Points to nothing. Dereferencing it crashes the program.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">malloc / free<\u002Fspan><div style=\"background:#FFFFFF;border-radius:6px;padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.5;white-space:pre\">p = malloc(5 * sizeof(int));\nfree(p);<\u002Fdiv><span style=\"font-size:29px;line-height:1.4\">Heap memory, uninitialised. Never freed = memory leak.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">Dangling<\u002Fspan><div style=\"background:#FFFFFF;border-radius:6px;padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.5;white-space:pre\">int* f() {\n  int x = 5;\n  return &amp;x;\n}<\u002Fdiv><span style=\"font-size:29px;line-height:1.4\">Points to freed or dead memory. Set p = NULL after free.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A6 · What they ask\" data-speaker-notes=\"Increment forms, pointer-to-pointer writes, spotting dangling pointers.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A6 · Pointers &amp; Memory<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Pointers<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Increment forms<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int a[] = {5, 9};\nint *p = a;\nx = ++*p;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">a[0] becomes 6, x takes 6, p does not move<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">x = 6, a = {6, 9}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Write through **<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int x = 5, y = 8;\nint *p = &amp;x, **q = &amp;p;\n**q = **q + 3;\np = &amp;y;\n*p = *p * 2;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">x → 8; p now points to y; y → 16; **q follows p to y<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">x = 8, y = 16, **q = 16<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Spot the bad pointer<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">int *p = malloc(4);\nfree(p);\n*p = 7;<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Writing after free uses a dangling pointer<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Undefined behaviour<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A6 · Trap\" data-speaker-notes=\"Postfix ++ binds tighter than *: *p++ reads then moves the pointer.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A6 · Pointers &amp; Memory<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: *p++ Moves the Pointer<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:30px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:13px 22px;text-align:left\">Form<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:13px 22px;text-align:left\">What happens<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace;font-weight:600\">*p++<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">read *p, then p moves<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace;font-weight:600\">(*p)++<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">read *p, then value + 1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace;font-weight:600\">++*p<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">value + 1, then read<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace;font-weight:600\">*++p<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">p moves, then read<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Students read <b style=\"font-family:'JetBrains Mono',monospace\">*p++<\u002Fb> as \"add 1 to the value\".<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Postfix ++ binds tighter than *, so it is <b style=\"font-family:'JetBrains Mono',monospace\">*(p++)<\u002Fb>: the value is unchanged and p moves to the next element.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A6 · MCQ\" data-speaker-notes=\"Pause. Draw the array and move the p arrow line by line.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A6 · Pointers &amp; Memory<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Pointer Increments<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px\">What is the output of the following C code?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int a[] = {10, 20, 30, 40};<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>int *p = a;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>int x = *p++;<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>int y = (*p)++;<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>int z = *(p + 1);<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>printf(\"%d %d %d %d\",<\u002Fspan><span style=\"color:#6B7588\">7<\u002Fspan><span>       x, y, z, a[1]);<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:62px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">A<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:32px\">10 20 30 21<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">B<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:32px\">10 21 30 21<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">C<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:32px\">11 20 30 20<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center\">D<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:32px\">10 20 40 21<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A6 · Answer\" data-speaker-notes=\"*p++ moves p to a[1]. (*p)++ returns 20, a[1] becomes 21. p + 1 is a[2].\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A6 · Pointers &amp; Memory<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Answer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Answer: Pointer Increments<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:64px;padding:36px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);font-family:'JetBrains Mono',monospace;text-align:center\">\n<span style=\"font-size:24px;padding:6px 0\"><\u002Fspan><span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p ↓<\u002Fspan><span style=\"font-size:26px;color:#2B4C8A;font-weight:600;padding:6px 0\">p + 1 ↓<\u002Fspan><span style=\"font-size:24px;padding:6px 0\"><\u002Fspan>\n<span style=\"font-size:34px;font-weight:600;border:2px solid #2B4C8A;background:#EAF0FA;padding:16px 0\">10<\u002Fspan><span style=\"font-size:34px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#2B4C8A;color:#fff;padding:16px 0\">21<\u002Fspan><span style=\"font-size:34px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">30<\u002Fspan><span style=\"font-size:34px;font-weight:600;border:2px solid #2B4C8A;border-left:0;background:#EAF0FA;padding:16px 0\">40<\u002Fspan>\n<span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[0]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[1]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[2]<\u002Fspan><span style=\"font-size:24px;color:#5A6478;padding:6px 0\">a[3]<\u002Fspan>\n<\u002Fdiv>\n<sc-raw-table style=\"border-collapse:collapse;font-size:28px;width:100%;font-family:'JetBrains Mono',monospace\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:11px 20px;text-align:left;font-family:'IBM Plex Sans',sans-serif\">Line<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:11px 20px;text-align:left;font-family:'IBM Plex Sans',sans-serif\">Effect<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:10px 20px;border-bottom:1px solid #D5DEEE\">3<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 20px;border-bottom:1px solid #D5DEEE\">x = 10, p → a[1]<\u002Fsc-raw- estructors then run C B A<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">A B C<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Method via parent reference<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.5;white-space:pre\">Animal a = new Dog();\na.speak();<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Java dispatches on the object: Dog's speak() runs<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Dog's version<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Identify the concept<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:26px;line-height:1.5;display:flex;flex-direction:column;gap:10px\"><span>Which is compile-time polymorphism?<\u002Fspan><span>Which cannot be instantiated?<\u002Fspan><\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">One-line definitions from the last two slides<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Overloading · Abstract class<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A8 · Trap\" data-speaker-notes=\"C++ without virtual: base pointer calls base method.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A8 · OOPs<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: C++ Without virtual<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;display:grid;grid-template-columns:auto 1fr;column-gap:24px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>class Base { public:<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  void f() { cout &lt;&lt; \"Base::f \"; }<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  virtual void g() { cout &lt;&lt; \"Base::g \"; }<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>};<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>class Derived : public Base { public:<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>  void f() { cout &lt;&lt; \"Derived::f \"; }<\u002Fspan><span style=\"color:#6B7588\">7<\u002Fspan><span>  void g() { cout &lt;&lt; \"Derived::g \"; }<\u002Fspan><span style=\"color:#6B7588\">8<\u002Fspan><span>};<\u002Fspan><span style=\"color:#6B7588\">9<\u002Fspan><span>Base *p = new Derived();<\u002Fspan><span style=\"color:#6B7588\">10<\u002Fspan><span>p-&gt;f(); p-&gt;g();<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:28px;color:#3A4456\">Students answer \"Derived::f Derived::g\".<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">f is not virtual, so the <b>pointer<\u002Fb> type picks it. Output: <b style=\"font-family:'JetBrains Mono',monospace\">Base::f Derived::g<\u002Fb><\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Check for the word <b>virtual<\u002Fb> before you trace a C++ dispatch question.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">The same Java code prints Derived for both — every Java method is virtual.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A8 · MCQ\" data-speaker-notes=\"Pause. Three things to track: constructor order, method dispatch, field lookup.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A8 · OOPs<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Overriding and Fields<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:36px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:30px\">What is the output of the following Java code?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:22px 32px;font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.45;display:grid;grid-template-columns:auto 1fr;column-gap:24px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>class A {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  int x = 10;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  A() { System.out.print(\"A \"); }<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>  void show() { System.out.print(\"A.show \"); }<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>}<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>class B extends A {<\u002Fspan><span style=\"color:#6B7588\">7<\u002Fspan><span>  int x = 20;<\u002Fspan><span style=\"color:#6B7588\">8<\u002Fspan><span>  B() { System.out.print(\"B \"); }<\u002Fspan><span style=\"color:#6B7588\">9<\u002Fspan><span>  void show() { System.out.print(\"B.show \"); }<\u002Fspan><span style=\"color:#6B7588\">10<\u002Fspan><span>}<\u002Fspan><span style=\"color:#6B7588\">11<\u002Fspan><span>A obj = new B();<\u002Fspan><span style=\"color:#6B7588\">12<\u002Fspan><span>obj.show();<\u002Fspan><span style=\"color:#6B7588\">13<\u002Fspan><span>System.out.print(obj.x);<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:58px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">A<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:30px\">B A B.show 20<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">B<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:30px\">A B B.show 10<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">C<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:30px\">A B A.show 10<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">D<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:30px\">A B B.show 20<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A8 · Answer\" data-speaker-notes=\"Constructors A then B; show()
