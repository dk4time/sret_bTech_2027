t:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Subnet Hosts and Mask<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px;line-height:1.35\">A network is written as <b style=\"font-family:'JetBrains Mono',monospace\">192.168.10.0/27<\u002Fb>. How many usable host addresses does it have, and what is its subnet mask?<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">A<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:29px\">30 · 255.255.255.224<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">B<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:29px\">32 · 255.255.255.224<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">C<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:29px\">30 · 255.255.255.240<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">D<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:29px\">62 · 255.255.255.192<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B4 · Answer\" data-speaker-notes=\"27 ones = 11100000 in the last octet = 224. 2^5 − 2 = 30.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B4 · Computer Networks<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Answer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Answer: Subnet Hosts and Mask<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<span style=\"font-size:26px;font-weight:600;color:#5A6478\">LAST OCTET OF THE MASK<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;text-align:center\"><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">1<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">1<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">1<\u002Fspan><span style=\"background:#EAF0FA;padding:14px 0;border-radius:4px\">0<\u002Fspan><span style=\"background:#EAF0FA;padding:14px 0;border-radius:4px\">0<\u002Fspan><span style=\"background:#EAF0FA;padding:14px 0;border-radius:4px\">0<\u002Fspan><span style=\"background:#EAF0FA;padding:14px 0;border-radius:4px\">0<\u002Fspan><span style=\"background:#EAF0FA;padding:14px 0;border-radius:4px\">0<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-family:'JetBrains Mono',monospace;font-size:24px;text-align:center;color:#5A6478\"><span>128<\u002Fspan><span>64<\u002Fspan><span>32<\u002Fspan><span>16<\u002Fspan><span>8<\u002Fspan><span>4<\u002Fspan><span>2<\u002Fspan><span>1<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-family:'JetBrains Mono',monospace;font-size:28px;padding-top:10px\"><span>128 + 64 + 32 = 224<\u002Fspan><span>host bits = 32 − 27 = 5<\u002Fspan><span>2⁵ − 2 = 30<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 28px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#fff;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">A<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600\">30 · 255.255.255.224<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:32px;line-height:1.45\">Subtract 2: the network address (.0) and broadcast (.31) cannot go to hosts.<\u002Fspan>\n<span style=\"font-size:30px;line-height:1.45;color:#3A4456\">B forgets the −2; C uses /28; D is /26.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B5 · Software Engineering\" data-speaker-notes=\"Low weightage in the OA. Spend two minutes here; it matters more in the technical interview.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B5 · Software Engineering<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Occasional in the test · more likely in the interview<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">SDLC, Models and Testing<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:26px;padding:28px 0\">\n<div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:26px;font-weight:600;text-align:center\"><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Requirements<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Design<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Coding<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Testing<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Deployment<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:14px 0;border-radius:4px\">Maintenance<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:start\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:26px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:11px 18px;text-align:left\">Model<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:11px 18px;text-align:left\">Flow<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:11px 18px;text-align:left\">Best when<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE;font-weight:600\">Waterfall<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">phases in sequence, no going back<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">requirements fixed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE;font-weight:600\">Agile<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">short sprints, frequent releases<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">requirements change<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE;font-weight:600\">Spiral<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">iterations with risk analysis<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 18px;border-bottom:1px solid #D5DEEE\">large, high-risk projects<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;flex-direction:column;gap:14px;font-size:26px;line-height:1.35\">\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">Testing levels<\u002Fb><span>unit → integration → system → acceptance<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">Black-box<\u002Fb><span>tests behaviour from inputs and outputs, no code view<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">White-box<\u002Fb><span>tests internal paths and logic with the code in view<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<button sc-camel-on-click=\"{{ toggleRail }}\" title=\"Show / hide slide navigation (N)\" aria-label=\"Toggle slide navigation\" style=\"position:fixed;top:14px;right:62px;z-index:1000;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:1px solid rgba(255,255,255,0.35);border-radius:8px;background:rgba(14,22,38,0.72);color:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:20px;line-height:1;cursor:pointer;opacity:{{ fsBtnOp }};transition:opacity 200ms ease\" style-hover=\"background:#2B4C8A;opacity:1\">{{ railIcon }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ toggleFs }}\" title=\"Toggle full screen (F)\" aria-label=\"Toggle full screen\" style=\"position:fixed;top:14px;right:14px;z-index:1000;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:1px solid rgba(255,255,255,0.35);border-radius:8px;background:rgba(14,22,38,0.72);color:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:20px;line-height:1;cursor:pointer;opacity:{{ fsBtnOp }};transition:opacity 200ms ease\" style-hover=\"background:#2B4C8A;opacity:1\">{{ fsLabel }}<\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { fs: false, idle: false, rail: true };\n  componentDidMount() {\n    this.onFs = () => this.setState({ fs: !!document.fullscreenElement });\n    this.onKey = (e) => {\n      const t = e.target; if (t && (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;\n      if (e.metaKey || e.ctrlKey || e.altKey) return;\n      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); this.toggleFs(); }\n      else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); this.setRail(!this.state.rail); }\n    };\n    this.onMove = () => { this.setState({ idle: false }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ idle: true }), 2500); };\n    try { if (localStorage.getItem('deck-stage.railVisible') === '0') this.state.rail = false; } catch (e) {}\n    setTimeout(() => this.setRail(this.state.rail), 300);\n    document.addEventListener('fullscreenchange', this.onFs);\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('mousemove', this.onMove);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('fullscreenchange', this.onFs);\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('mousemove', this.onMove);\n    clearTimeout(this.t);\n  }\n  setRail(on) {\n    this.setState({ rail: on });\n    window.postMessage({ type: '__deck_rail_visible', on }, '*');\n  }\n  toggleFs() {\n    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();\n    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});\n  }\n  renderVals() {\n    return {\n      toggleFs: (e) => { e.stopPropagation(); e.currentTarget.blur(); this.toggleFs(); },\n      toggleRail: (e) => { e.stopPropagation(); e.currentTarget.blur(); this.setRail(!this.state.rail); },\n      railIcon: this.state.rail ? '◧' : '☰',\n      fsLabel: this.state.fs ? '⤡' : '⤢',\n      fsBtnOp: this.state.fs && this.state.idle ? 0 : 1\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
