ng:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">B.show<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">13<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">field: reference type (A)<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">10<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 28px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#fff;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">B<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600\">A B B.show 10<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:32px;line-height:1.45\">Methods are overridden; fields are only hidden. obj is declared as A, so obj.x is A's 10.<\u002Fspan>\n<span style=\"font-size:30px;line-height:1.45;color:#3A4456\">D is the most-picked wrong option.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · Concept 1\" data-speaker-notes=\"AMCAT pseudocode keywords. Integer semantics everywhere.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Reading AMCAT-Style Pseudocode<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;padding:40px 0\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:29px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 24px;text-align:left\">You see<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 24px;text-align:left\">It means<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">Integer a, b   /   Set a = 5<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">declare / assign<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">for (each i from 1 to 5)<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">i = 1, 2, 3, 4, 5 — <b>both ends included<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">while (cond) … end while<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">condition checked before every pass<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">a / b   (Integers)<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">integer division: 7 / 2 = 3<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">a mod b<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">remainder, same as %<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">&amp;  |  ^  &lt;&lt;  &gt;&gt;   vs   &amp;&amp;  ||<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">bitwise vs logical, as in C<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">Print a, b<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 24px;border-bottom:1px solid #D5DEEE\">output — check separators in the options<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · Concept 2\" data-speaker-notes=\"The five-step method and the n = 0, 1, small test.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">The 5-Step Tracing Method<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding-bottom:16px;border-bottom:1px solid #D5DEEE\"><span style=\"font-size:44px;font-weight:700;color:#2B4C8A\">1<\u002Fspan><span style=\"font-size:31px\">List every variable as a column<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding-bottom:16px;border-bottom:1px solid #D5DEEE\"><span style=\"font-size:44px;font-weight:700;color:#2B4C8A\">2<\u002Fspan><span style=\"font-size:31px\">Write the initial values in row one<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding-bottom:16px;border-bottom:1px solid #D5DEEE\"><span style=\"font-size:44px;font-weight:700;color:#2B4C8A\">3<\u002Fspan><span style=\"font-size:31px\">Add one row per loop pass or call<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;padding-bottom:16px;border-bottom:1px solid #D5DEEE\"><span style=\"font-size:44px;font-weight:700;color:#2B4C8A\">4<\u002Fspan><span style=\"font-size:31px\">Test the condition before each pass<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center\"><span style=\"font-size:44px;font-weight:700;color:#2B4C8A\">5<\u002Fspan><span style=\"font-size:31px\">Read the Print against the last row<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:34px 38px;display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-size:30px;font-weight:700;color:#2B4C8A\">For error-fix questions<\u002Fspan>\n<span style=\"font-size:30px;line-height:1.4\">Run the code mentally with<\u002Fspan>\n<div style=\"display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:600\"><span style=\"background:#2B4C8A;color:#fff;padding:10px 22px;border-radius:6px\">n = 0<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:10px 22px;border-radius:6px\">n = 1<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:10px 22px;border-radius:6px\">n = 3<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">The first input that gives a wrong answer points at the bug.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · What they ask\" data-speaker-notes=\"Three error-fix types, all asked as MCQs: pick the fix.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Error-Fix MCQs<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;padding:44px 0;align-items:start\">\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">TYPE 1<\u002Fspan><span style=\"font-size:36px;font-weight:700\">Logical error<\u002Fspan><span style=\"font-size:28px;line-height:1.4\">Compiles, wrong answer.<\u002Fspan><span style=\"font-size:27px;line-height:1.5;color:#3A4456\">&lt; vs &lt;= · wrong condition · start at 0 vs 1 · = vs == · &amp;&amp; vs || · missing return<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">TYPE 2<\u002Fspan><span style=\"font-size:36px;font-weight:700\">Syntax error<\u002Fspan><span style=\"font-size:28px;line-height:1.4\">Will not compile.<\u002Fspan><span style=\"font-size:27px;line-height:1.5;color:#3A4456\">missing ; or brace · wrong type · undeclared variable<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:32px 34px;display:flex;flex-direction:column;gap:18px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">TYPE 3<\u002Fspan><span style=\"font-size:36px;font-weight:700\">Code reuse<\u002Fspan><span style=\"font-size:28px;line-height:1.4\">Fill the blank with a call.<\u002Fspan><span style=\"font-size:27px;line-height:1.5;color:#3A4456\">use a given helper with the right argument and the right return check<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · Trap\" data-speaker-notes=\"= inside a condition assigns and is always true for non-zero.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: = Inside a Condition<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:32px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int marks = 25;<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>if (marks = 40)<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>    printf(\"Pass\");<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>else<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>    printf(\"Fail\");<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">25 is not 40, so students answer \"Fail\".<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\"><b style=\"font-family:'JetBrains Mono',monospace\">marks = 40<\u002Fb> assigns 40; the condition value is 40, which is true. Output: <b>Pass<\u002Fb>.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">In an error-fix MCQ, this line is the bug: change = to ==.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">Java rejects it at compile time: int is not boolean.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · MCQ 1 Logical\" data-speaker-notes=\"Pause. Test with n = 0 and n = 3.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Logical Error<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px;line-height:1.35\">The function should return n! (with 0! = 1). Which change fixes it?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>int fact(int n) {<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>  int f = 0;<\u002Fspan><span style=\"color:#6B7588\">3<\u002Fspan><span>  for (int i = 1; i &lt;= n; i++)<\u002Fspan><span style=\"color:#6B7588\">4<\u002Fspan><span>    f = f * i;<\u002Fspan><span style=\"color:#6B7588\">5<\u002Fspan><span>  return f;<\u002Fspan><span style=\"color:#6B7588\">6<\u002Fspan><span>}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:88px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">A<\u002Fspan><span style=\"font-size:30px\">Line 3: i &lt;= n → i &lt; n<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">B<\u002Fspan><span style=\"font-size:30px\">Line 2: f = 0 → f = 1<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">C<\u002Fspan><span style=\"font-size:30px\">Line 4: f * i → f + i<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">D<\u002Fspan><span style=\"font-size:30px\">Line 3: i = 1 → i = 0<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A9 · Answer 1 Logical\" data-speaker-notes=\"A product must start at 1. n = 0 returns 0 instead of 1.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">A9 · Pseudocode &amp; Error-Fix<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Answer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Answer: Logical Error<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:flex;flex-dir c-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">F2<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">Iyer<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">S2<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">C1<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">Ravi<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">DBMS<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">F1<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 16px;border-bottom:1px solid #D5DEEE\">Rao<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<span style=\"font-size:24px;color:#5A6478\">\"Asha\", \"DBMS\" and \"Rao\" repeat — the redundancy normalisation removes.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · Concept 3\" data-speaker-notes=\"2NF removes partial dependencies, 3NF removes transitive ones. BCNF: every determinant is a key.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Normalising to 2NF, 3NF and BCNF<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:36px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">2NF<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">No <b>partial<\u002Fb> dependency: a non-key column must depend on the <b>whole<\u002Fb> key.<\u002Fspan><span style=\"font-size:24px;color:#5A6478\">StudentName needs only StudentID → split out<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:24px\"><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">Student(<u>StudentID<\u002Fu>, StudentName)<\u002Fspan><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">Course(<u>CourseID<\u002Fu>, CourseName, FacultyID, FacultyName)<\u002Fspan><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">Enrolment(<u>StudentID, CourseID<\u002Fu>)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">3NF<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">No <b>transitive<\u002Fb> dependency: non-key must not depend on another non-key.<\u002Fspan><span style=\"font-size:24px;color:#5A6478\">CourseID → FacultyID → FacultyName → split out<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:24px\"><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">Course(<u>CourseID<\u002Fu>, CourseName, FacultyID)<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;padding:10px 16px;border-radius:4px\">Faculty(<u>FacultyID<\u002Fu>, FacultyName)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:34px;font-weight:700;color:#2B4C8A\">BCNF<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">For every X → Y, X must be a <b>super key<\u002Fb>. Stricter than 3NF.<\u002Fspan><span style=\"font-size:24px;color:#5A6478\">Classic 3NF-not-BCNF case:<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:24px\"><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">R(Student, Subject, Teacher)<\u002Fspan><span style=\"background:#EAF0FA;padding:10px 16px;border-radius:4px\">Teacher → Subject<\u002Fspan><\u002Fdiv><span style=\"font-size:24px;color:#5A6478\">Teacher is not a key, so R breaks BCNF<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · Concept 4\" data-speaker-notes=\"ACID with one example each; two concurrency problems; indexing purpose.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Transactions, Concurrency and Indexing<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;padding:36px 0;align-items:start\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:28px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 20px;text-align:left\">ACID<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 20px;text-align:left\">Guarantee in a ₹500 transfer<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Atomicity<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">debit and credit both happen, or neither<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Consistency<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">total money is the same before and after<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Isolation<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">others never see the half-done state<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Durability<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">after COMMIT it survives a crash<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;flex-direction:column;gap:22px;font-size:28px;line-height:1.35\">\n<div style=\"display:flex;flex-direction:column;gap:6px\"><b style=\"color:#2B4C8A\">Dirty read<\u002Fb><span>T2 reads T1's uncommitted change; T1 then rolls back<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><b style=\"color:#2B4C8A\">Lost update<\u002Fb><span>T1 and T2 both read 100, both write; one update vanishes<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><b style=\"color:#2B4C8A\">Index<\u002Fb><span>speeds up search (like a book index); slows inserts and updates slightly<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · What they ask\" data-speaker-notes=\"Candidate key from FDs, highest normal form, ACID scenario.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: DBMS<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Find the candidate key<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">R(A, B, C, D)\nA → B, B → C, C → D<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">A reaches B, then C, then D: A⁺ = ABCD<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Key = A<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Highest normal form<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:26px;line-height:1.5;white-space:pre\">R(A, B, C), key A\nA → B, B → C<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Single-column key: no partial dependency. B → C is transitive<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">2NF<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Name the property<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">Power fails after the debit, before the credit. On restart the debit is undone.<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">All or nothing<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Atomicity<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · Trap\" data-speaker-notes=\"Partial vs transitive. Check the key shape first.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: Partial vs Transitive Dependency<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:29px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:13px 22px;text-align:left\">Dependency<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:13px 22px;text-align:left\">Shape<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:13px 22px;text-align:left\">Breaks<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-weight:600\">Partial<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">part of key → non-key<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">2NF<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-weight:600\">Transitive<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">non-key → non-key<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">3NF<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-weight:600\">Non-key determinant<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE;font-family:'JetBrains Mono',monospace\">non-super-key → key part<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 22px;border-bottom:1px solid #D5DEEE\">BCNF<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Students see any extra dependency and answer \"not in 3NF\" without checking 2NF first.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Single-column key → partial dependency is impossible, so it is at least 2NF.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">Composite key → check partial dependencies first.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · MCQ\" data-speaker-notes=\"Pause. One minute. Is the key composite?\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ: Highest Normal Form<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;padding:40px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:32px;line-height:1.35\">Relation R has primary key (A, B) and these functional dependencies. What is the highest normal form R satisfies?<\u002Fspan>\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:32px;line-height:1.6;display:flex;flex-direction:column\"><span>R(A, B, C, D)<\u002Fspan><span>AB → C<\u002Fspan><span>B  → D<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:88px\">\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">A<\u002Fspan><span style=\"font-size:32px\">1NF<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">B<\u002Fspan><span style=\"font-size:32px\">2NF<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">C<\u002Fspan><span style=\"font-size:32px\">3NF<\u002Fspan><\u002Fdiv>\n<div style=\"border:2px solid #D5DEEE;border-radius:8px;padding:18px 26px;display:flex;gap:22px;align-items:center\"><span style=\"width:52px;height:52px;border-radius:50%;background:#EAF0FA;color:#2B4C8A;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none\">D<\u002Fspan><span style=\"font-size:32px\">BCNF<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B1 · Answer\" data-speaker-notes=\"B → D is a partial dependency. Split into R1(A,B,C) and R2(B,D).\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B1 · DBMS<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Answer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Answer: r:#2B4C8A\"><span>INNER JOIN<\u002Fspan><span>2 rows<\u002Fspan><\u002Fdiv><span style=\"font-size:24px;color:#3A4456\">matches only<\u002Fspan><div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;display:flex;flex-direction:column;gap:2px\"><span>Asha   80<\u002Fspan><span>Meena  75<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:8px;padding:20px 24px;display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;justify-content:space-between;font-size:28px;font-weight:700;color:#2B4C8A\"><span>LEFT JOIN<\u002Fspan><span>3 rows<\u002Fspan><\u002Fdiv><span style=\"font-size:24px;color:#3A4456\">all of Student<\u002Fspan><div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;display:flex;flex-direction:column;gap:2px\"><span>Asha   80<\u002Fspan><span>Ravi   NULL<\u002Fspan><span>Meena  75<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:8px;padding:20px 24px;display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;justify-content:space-between;font-size:28px;font-weight:700;color:#2B4C8A\"><span>RIGHT JOIN<\u002Fspan><span>3 rows<\u002Fspan><\u002Fdiv><span style=\"font-size:24px;color:#3A4456\">all of Marks<\u002Fspan><div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;display:flex;flex-direction:column;gap:2px\"><span>Asha   80<\u002Fspan><span>Meena  75<\u002Fspan><span>NULL   90<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:8px;padding:20px 24px;display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;justify-content:space-between;font-size:28px;font-weight:700;color:#2B4C8A\"><span>FULL JOIN<\u002Fspan><span>4 rows<\u002Fspan><\u002Fdiv><span style=\"font-size:24px;color:#3A4456\">everything from both<\u002Fspan><div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;display:flex;flex-direction:column;gap:2px\"><span>Asha 80 · Ravi NULL<\u002Fspan><span>Meena 75 · NULL 90<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:26px;line-height:1.4;grid-column:1 / -1;color:#3A4456\"><b style=\"color:#1B2230\">Self join:<\u002Fb> a table joined to itself under two aliases, e.g. employee e with manager m ON e.manager_id = m.id.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B2 · What they ask\" data-speaker-notes=\"Output of a query, join row counts, second-highest salary.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B2 · SQL<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: SQL<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">What does it return?<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">A small table on screen, one query with GROUP BY, HAVING or an aggregate.<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Apply the execution order step by step<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Next 3 MCQs<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Join row count<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">\"Table A has 3 rows, B has 3; 2 ids match. Rows in the LEFT JOIN?\"<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">2 matches + 1 unmatched row from A (ids unique)<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">3 rows<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Second-highest salary<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.5;white-space:pre\">SELECT MAX(salary)\nFROM Emp\nWHERE salary &lt;\n  (SELECT MAX(salary)\n   FROM Emp);<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Largest value below the maximum; handles ties<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Memorise this form<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B2 · Trap\" data-speaker-notes=\"= NULL matches nothing. Aggregates skip NULLs.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B2 · SQL<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: NULL Is Not a Value<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"background:#F3F5F8;border-radius:8px;padding:28px 36px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:1.55;display:grid;grid-template-columns:auto 1fr;column-gap:28px;white-space:pre\"><span style=\"color:#6B7588\">1<\u002Fspan><span>SELECT name FROM Emp<\u002Fspan><span style=\"color:#6B7588\">2<\u002Fspan><span>WHERE salary = NULL;<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:30px;color:#3A4456;line-height:1.4\">Students expect the employees with no salary.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#FFF6EC;border:2px solid #B45309;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-size:28px;font-weight:700;color:#B45309;letter-spacing:0.06em\">TRAP<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Any comparison with NULL is <b>unknown<\u002Fb>, never true. This returns <b>zero rows<\u002Fb>.<\u002Fspan>\n<span style=\"font-size:32px;line-height:1.4\">Write <b style=\"font-family:'JetBrains Mono',monospace\">WHERE salary IS NULL<\u002Fb>.<\u002Fspan>\n<span style=\"font-size:28px;line-height:1.4;color:#3A4456\">COUNT(col), SUM, AVG skip NULLs; only COUNT(*) counts every row.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B2 · MCQ 1\" data-speaker-notes=\"Pause. Note Divya's NULL salary.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B2 · SQL<\u002Fspan><span style=\"background:#2B4C8A;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Sample MCQ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Sample MCQ 1: GROUP BY with HAVING<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding:32px 0;align-items:start\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:27px;width:100%;font-family:'JetBrains Mono',monospace\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:10px 18px;text-align:left\" colspan=\"4\">Emp<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 18px;border-bottom:1px solid #D5DEEE;font-weight:600\">id<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 18px;b yle=\"padding:9px 20px;border-bottom:1px solid #D5DEEE;text-align:right\">7<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600\"><sc-raw-td style=\"padding:9px 20px;font-family:'IBM Plex Sans',sans-serif\" colspan=\"4\">Average<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 20px;text-align:right\">32/4 = 8<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 20px;text-align:right\">16/4 = 4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B3 · Concept 4\" data-speaker-notes=\"All four conditions must hold. Prevention breaks one; avoidance checks safety first; detection finds cycles.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B3 · Operating Systems<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Deadlock<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;padding:36px 0;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-size:28px;font-weight:600\">Four necessary conditions — all at once<\u002Fspan>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px\">\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-size:28px\">Mutual exclusion<\u002Fb><span style=\"font-size:24px\">one process per resource<\u002Fspan><\u002Fdiv>\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-size:28px\">Hold and wait<\u002Fb><span style=\"font-size:24px\">holds one, waits for another<\u002Fspan><\u002Fdiv>\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-size:28px\">No pre-emption<\u002Fb><span style=\"font-size:24px\">cannot be taken away<\u002Fspan><\u002Fdiv>\n<div style=\"background:#2B4C8A;color:#fff;border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-size:28px\">Circular wait<\u002Fb><span style=\"font-size:24px\">P1 → P2 → … → P1<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:24px;font-size:28px;line-height:1.35\">\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:20px;border-bottom:1px solid #D5DEEE\"><b style=\"color:#2B4C8A\">Prevention<\u002Fb><span>design so one condition can never hold, e.g. request all resources at once<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:20px;border-bottom:1px solid #D5DEEE\"><b style=\"color:#2B4C8A\">Avoidance · Banker's algorithm<\u002Fb><span>grant a request only if the system stays in a safe state<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><b style=\"color:#2B4C8A\">Detection and recovery<\u002Fb><span>find a cycle in the wait-for graph, then kill or roll back a process<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B3 · Concept 5\" data-speaker-notes=\"Paging vs segmentation, virtual memory, thrashing, two kinds of fragmentation.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B3 · Operating Systems<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Memory Management<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;padding:36px 0;align-items:start\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:28px;width:100%\">\n<sc-raw-tr><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 20px;text-align:left\"><\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 20px;text-align:left\">Paging<\u002Fsc-raw-th><sc-raw-th style=\"background:#2B4C8A;color:#fff;padding:12px 20px;text-align:left\">Segmentation<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Unit<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">fixed-size pages / frames<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">variable logical segments<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Fragmentation<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">internal<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">external<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE;font-weight:600\">Seen by user<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">no<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 20px;border-bottom:1px solid #D5DEEE\">yes (code, stack, data)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;flex-direction:column;gap:20px;font-size:28px;line-height:1.35\">\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">Virtual memory<\u002Fb><span>pages load on demand; a missing page causes a page fault<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">Thrashing<\u002Fb><span>too few frames: more time swapping pages than running<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">Internal fragmentation<\u002Fb><span>wasted space inside an allocated block<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"color:#2B4C8A\">External fragmentation<\u002Fb><span>enough free memory in total, but not in one piece<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478 en;align-items:center;font-size:28px\"><span>FIFO · replace oldest<\u002Fspan><b style=\"font-size:36px\">7<\u002Fb><\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#2B4C8A;border-radius:8px;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;font-size:28px\"><span>LRU · least recently used<\u002Fspan><b style=\"font-size:36px\">6<\u002Fb><\u002Fdiv>\n<div style=\"background:#EAF0FA;color:#2B4C8A;border-radius:8px;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;font-size:28px\"><span>Optimal · used farthest ahead<\u002Fspan><b style=\"font-size:36px\">6<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B3 · Concept 7\" data-speaker-notes=\"Critical section requirements, mutex vs semaphore.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B3 · Operating Systems<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">Concept<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Synchronisation Basics<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;padding:40px 0;align-items:start\">\n<div style=\"background:#EAF0FA;border-radius:10px;padding:30px 32px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Critical section<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">Code touching shared data. A solution needs:<\u002Fspan><span style=\"font-size:27px;line-height:1.5\">mutual exclusion · progress · bounded waiting<\u002Fspan><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:30px 32px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Mutex<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">A lock with an owner. Only the thread that locked it can unlock it.<\u002Fspan><div style=\"background:#fff;border-radius:6px;padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:24px;white-space:pre\">lock(m);  …  unlock(m);<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#EAF0FA;border-radius:10px;padding:30px 32px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Semaphore<\u002Fspan><span style=\"font-size:27px;line-height:1.4\">An integer counter. wait / P decrements and blocks below 0; signal / V increments.<\u002Fspan><span style=\"font-size:24px;color:#3A4456\">Binary (0/1) or counting (n identical resources)<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B3 · What they ask\" data-speaker-notes=\"Scheduling arithmetic, page faults, state transitions and deadlock conditions.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B3 · Operating Systems<\u002Fspan><span style=\"background:#EAF0FA;color:#2B4C8A;font-weight:600;padding:6px 16px;border-radius:4px\">What they ask<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Question Patterns: Operating Systems<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:44px 0\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 1<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Average waiting time<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">3–4 processes with arrival and burst; one algorithm named.<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Draw the Gantt chart, then WT = TAT − burst<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">See the MCQ<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 2<\u002Fspan><span style=\"font-size:34px;font-weight:600\">Count page faults<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">A reference string, 3 or 4 frames, FIFO / LRU / Optimal.<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">One column per reference; mark F or hit<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Previous worked example<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\"><span style=\"font-size:26px;font-weight:700;color:#2B4C8A\">PATTERN 3<\u002Fspan><span style=\"font-size:34px;font-weight:600\">One-line theory<\u002Fspan><div style=\"background:#F3F5F8;border-radius:8px;padding:24px 28px;font-size:27px;line-height:1.45\">\"A running process's time quantum expires. It moves to …\"<\u002Fdiv><span style=\"font-size:28px;color:#3A4456;line-height:1.4\">Pre-empted, not blocked on I/O<\u002Fspan><span style=\"font-size:32px;font-weight:700;color:#2B4C8A\">Ready<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;height:76px;border-top:2px solid #EAF0FA;font-size:24px;color:#5A6478\"><span>Prepared by Dineshkumar · T.I.M.E.<\u002Fspan><span style=\"font-weight:600;color:#2B4C8A\" style-after=\"content: counter(slide)\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"B3 · Trap\" data-speaker-notes=\"Belady's anomaly: FIFO can fault more with more frames.\" style=\"counter-increment:slide;background:#FFFFFF;color:#1B2230;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;padding:44px 96px 0;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;height:60px\"><img src=\"4e60c84e-f893-49e5-9f73-da52b94582f1\" alt=\"T.I.M.E.\" style=\"height:56px;width:auto;display:block\"><div style=\"display:flex;align-items:center;gap:18px;font-size:24px\"><span style=\"color:#5A6478\">B3 · Operating Systems<\u002Fspan><span style=\"background:#B45309;color:#fff;font-weight:600;padding:6px 16px;border-radius:4px\">Trap<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:32px 0 0;font-size:60px;font-weight:700;color:#2B4C8A;line-height:1.1\">Trap: More Frames, More Faults<\u002Fh2>\n<div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding:44px 0
