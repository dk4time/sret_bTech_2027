<title>Technical Interview Preparation Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed top bar (brand, breadcrumb, tier filter, trainer) + scrolling slide stage + fixed bottom bar (prev/next, footer, progress).
   Slides are "interview desk" sheets: a question in display type, answers revealed as labelled notes beneath. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#101A33; --muted:#566079; --line:#D8DEEA;
  --bar:#13234A; --bar-ink:#F4F6FC; --bar-muted:#AFBAD6;
  --accent:#E58A1F; --accent-ink:#9A5300; --accent-soft:#FCEBD5;
  --core:#17804F; --core-bg:#DDF2E6; --adv:#6A3BBE; --adv-bg:#ECE4FA;
  --warn:#B23A2E; --warn-bg:#FBE6E3; --ok:#17804F;
  --code-bg:#0F1930; --code-ink:#E3E8F5; --code-kw:#FFB65C; --code-str:#8FD9A8; --code-num:#C9A6FF; --code-com:#7F8BA8; --code-fn:#7FC3FF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131C33; --sunk:#0F172B; --ink:#E7ECF7; --muted:#9CA8C4; --line:#27324E;
  --bar:#080E1C; --bar-ink:#EEF2FB; --bar-muted:#8D99B8;
  --accent:#F5A445; --accent-ink:#FFC57F; --accent-soft:#3A2A14;
  --core:#4FD18E; --core-bg:#123526; --adv:#B795FF; --adv-bg:#2A1F47;
  --warn:#FF8A7A; --warn-bg:#3A1A17; --ok:#4FD18E;
  --code-bg:#070D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131C33; --sunk:#0F172B; --ink:#E7ECF7; --muted:#9CA8C4; --line:#27324E;
  --bar:#080E1C; --bar-ink:#EEF2FB; --bar-muted:#8D99B8;
  --accent:#F5A445; --accent-ink:#FFC57F; --accent-soft:#3A2A14;
  --core:#4FD18E; --core-bg:#123526; --adv:#B795FF; --adv-bg:#2A1F47;
  --warn:#FF8A7A; --warn-bg:#3A1A17; --ok:#4FD18E;
  --code-bg:#070D1A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}

/* bars */
.bar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding-inline:16px}
.top{padding-block:10px;flex-wrap:wrap}
.brand{background:none;border:0;display:flex;align-items:baseline;gap:8px;padding:4px 0;color:var(--bar-ink)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.brand span{font-size:13px;color:var(--bar-muted);letter-spacing:.08em;text-transform:uppercase}
.crumb{flex:1;min-width:0;font-size:14px;color:var(--bar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb button{background:none;border:0;color:var(--bar-ink);padding:0;text-decoration:underline;text-underline-offset:3px}
.crumb i{font-style:normal;margin-inline:6px;opacity:.6}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid #ffffff33;border-radius:999px;padding:2px}
.seg button{background:none;border:0;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--bar-muted)}
.seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.tgl{background:none;border:1px solid #ffffff33;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--bar-muted)}
.tgl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1A1205}
.tgl.ico{display:grid;place-items:center;width:34px;height:34px;padding:0}
.tgl.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tgl.ico:hover{color:var(--bar-ink);border-color:#ffffff66}
.bot{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));position:relative}
.bot .nav{background:#ffffff14;border:1px solid #ffffff26;color:var(--bar-ink);border-radius:8px;padding:6px 14px;font-weight:600;font-size:15px}
.bot .nav:disabled{opacity:.35;cursor:default}
.foot{flex:1;min-width:0;display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--bar-muted)}
.foot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{position:absolute;left:0;right:0;top:0;height:3px;background:#ffffff14}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
@media (max-width:640px){.foot span:first-child{display:none}.foot{justify-content:center}.crumb{order:3;flex-basis:100%}}

/* stage */
#stage{overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:28px 40px;outline:none}
.sheet{max-width:1040px;margin-inline:auto;display:grid;gap:22px}
.sheet>*{min-width:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.lead{font-size:19px;color:var(--muted);max-width:65ch}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 .3em}
.md{display:grid;gap:10px;max-width:72ch}
.md ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.md b{font-weight:700}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tier{font-size:12px;font-weight:700;letter-spacing:.1em;padding:3px 10px;border-radius:999px}
.tier.C{background:var(--core-bg);color:var(--core)}
.tier.A{background:var(--adv-bg);color:var(--adv)}
.deg{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.subt{font-size:13px;color:var(--muted);margin-left:auto}
.cx{font-family:var(--f-mono);font-size:13px;padding:3px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* question card */
.qtext{font-size:clamp(24px,3.2vw,36px);font-weight:700;display:flex;gap:14px;align-items:baseline}
.qmark{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.15em;flex:none}
.parts{display:grid;gap:12px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:12px 16px;text-align:left;font-weight:700;font-size:16px}
.ph .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:700}
.ph .hint{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-ink)}
.part.fu .k{background:var(--accent-soft);color:var(--accent-ink)}
.part.mi .k{background:var(--warn-bg);color:var(--warn)}
.pb{padding:0 16px 16px;display:grid;gap:14px}
.pb>*{min-width:0}
.pb .fq{font-weight:700}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mast .lbl{font-size:14px;color:var(--muted)}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.mbtn.c[aria-pressed="true"]{background:var(--core);border-color:var(--core);color:var(--surface)}
.mbtn.r[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}

/* code */
.code{border-radius:var(--r);background:var(--code-bg);overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 6px 0;background:#ffffff0d;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--code-com);padding:6px 12px;font-size:13px;font-weight:600;border-radius:6px 6px 0 0;font-family:var(--f-mono)}
.tabs button[aria-selected="true"]{background:var(--code-bg);color:var(--code-kw)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.55;color:var(--code-ink);tab-size:4}
.code pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
.hljs-keyword,.hljs-built_in,.hljs-type,.hljs-literal{color:var(--code-kw)}
.hljs-string{color:var(--code-str)} .hljs-number{color:var(--code-num)}
.hljs-comment{color:var(--code-com);font-style:italic} .hljs-title,.hljs-function .hljs-title{color:var(--code-fn)}
.hljs-meta,.hljs-attr{color:var(--code-num)}
pre.plain{margin:0;padding:12px 16px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);font-family:var(--f-mono);font-size:14px;overflow-x:auto;line-height:1.55;white-space:pre}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}

/* concept / flow */
.slide-h{font-size:clamp(26px,3.4vw,40px);font-weight:800}
.steps{display:grid;gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.steps li>div{min-width:0}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);text-align:center}
.steps li b{display:block}
.steps li span{color:var(--muted)}
.pbtn{justify-self:start;background:var(--accent);color:#1A1205;border:0;border-radius:8px;padding:9px 18px;font-weight:700}
.gbtn{justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 18px;font-weight:600}
.diagram{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.diagram svg{display:block;max-width:100%;height:auto;margin-inline:auto}
.diagram svg text{fill:var(--ink);font-family:var(--f-body)}

/* intro */
.intro-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end}
.mcode{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,9vw,104px);line-height:.85;color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start}
.panel h3{font-size:18px}
.panel ol,.panel ul{margin:0;padding-left:1.3em;display:grid;gap:5px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.stat b{color:var(--ink);font-size:20px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:560px){.intro-top{grid-template-columns:1fr}}

/* cheat + quiz */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.cheat div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px}
.cheat dt{font-weight:700}
.cheat dd{margin:0;color:var(--muted);font-size:15px}
.quiz{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.quiz li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;gap:8px}
.quiz li button{justify-self:start;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--accent-ink)}
.quiz .qa{color:var(--core);font-weight:600}

/* home */
.hero{display:grid;gap:12px;padding-block:8px 4px}
.hero h1{font-size:clamp(36px,6vw,68px);font-weight:800;letter-spacing:-.01em;line-height:1}
.hero h1 em{font-style:normal;color:var(--accent)}
.byline{font-size:16px;color:var(--muted)}
.byline b{color:var(--ink)}
.search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px 4px 14px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);padding:8px 0;outline:none}
.search:focus-within{border-color:var(--accent)}
.results{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.results button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;display:flex;gap:10px;align-items:center}
.results button span:nth-child(2){flex:1;min-width:0}
.results small{color:var(--muted);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;text-align:left;display:grid;gap:6px;align-content:start;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .no{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--accent);line-height:1}
.tile .tt{font-weight:700;font-size:17px;line-height:1.25}
.tile .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .pg{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.tile .pg i{display:block;height:100%;background:var(--core)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.end-actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media print{.bar,.mast,.end-actions,.pbtn,.gbtn{display:none!important}#app{display:block;height:auto}#stage{overflow:visible;padding:0}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<div id="app">
  <header class="bar top">
    <button class="brand" id="homeBtn" aria-label="Go to home"><b>T.I.M.E.</b><span>TR Kit</span></button>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Tier filter">
        <button data-f="all">All</button><button data-f="C">Core</button><button data-f="A">Advanced</button>
      </div>
      <button class="tgl" id="trainerBtn" aria-pressed="false" title="Show every answer at once">Trainer mode</button>
      <button class="tgl ico" id="fsBtn" aria-pressed="false" aria-label="Full screen" title="Full screen (F)"></button>
    </div>
  </header>
  <main id="stage" tabindex="-1"></main>
  <footer class="bar bot">
    <div class="prog"><i id="progBar"></i></div>
    <button class="nav" id="prevBtn">← Prev</button>
    <div class="foot"><span>T.I.M.E. | Technical Interview Preparation Kit | Dineshkumar Thangavel</span><span id="slideNo"></span></div>
    <button class="nav" id="nextBtn">Next →</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
/* ---------- authoring helpers used by the module files ---------- */
const KIT = { mods: [] };
const R = String.raw; /* code blocks: R`...` keeps backslashes as written */
function Q(tier, sub, q, a, f, m, x){ return Object.assign({ t:'q', tier, sub, q, a, f, m }, x || {}); }
function C(sub, h, body, x){ return Object.assign({ t:'c', sub, h, body }, x || {}); }
function T(sub, h, cols, rows, note, x){ return Object.assign({ t:'t', sub, h, cols, rows, note }, x || {}); }
function F(sub, h, steps, note, x){ return Object.assign({ t:'f', sub, h, steps, note }, x || {}); }
KIT.mod = function(m){
  let n = 0;
  m.slides.forEach(s => { if (s.t === 'q') s.id = m.id + '-' + (++n); });
  m.qs = m.slides.filter(s => s.t === 'q');
  m.idx = KIT.mods.length;
  KIT.mods.push(m);
};
</script>
<script>/* m/m00.js */
/* Module 0: How to Use This Deck + TR Round Overview */
(function(){
KIT.mod({
  id: 'm00', title: 'TR Round Overview', time: '1 hour',
  objective: "Know what happens in a Technical Interview (TR) round, how service and product rounds differ, and the one answer formula you will use for every question in this kit.",
  checks: [
    "Can you explain a concept clearly, not just recite a definition?",
    "Do you know your own resume and project in depth?",
    "Can you write simple code while thinking aloud?",
    "Do you stay calm and honest when you don't know something?"
  ],
  top5: [
    "The TR flow: Intro → Resume → Project → Language/OOPs → Coding → DSA/DBMS/OS/CN → Closing",
    "Answer formula: **Define → Explain → Example → Link to project**",
    "Service vs product rounds: breadth vs depth",
    "How to say “I don't know” without losing the interviewer",
    "How to use this deck: tiers, reveal buttons, Confident / Revise"
  ],
  slides: [
    C('How to use this deck', 'Two ways to use this kit', [
      "**Classroom mode:** the trainer reads the question aloud. Students answer first. Then the trainer clicks *Show* on the Model Answer, Follow-up and Mistake, one at a time.",
      "",
      "**Self-study mode:** pick a tier at the top (All, Core or Advanced). Say your answer aloud, then reveal. Mark each card **Confident** or **Revise**. Your progress shows on the Home tiles.",
      "",
      "- Press **Space** to reveal the next part, **← →** to change slides.",
      "- **Trainer mode** opens every answer at once, for quick review.",
      "- Code has **Java** and **Python** tabs. Your choice is remembered."
    ]),
    T('How to use this deck', 'The two tiers', ['Tier', 'Typical interview', 'Expected depth'], [
      ['CORE', 'Mass-recruiting service companies: trainee and entry-level developer roles', 'Definition + example, easy coding, basic SQL, clear project explanation'],
      ['ADVANCED', 'Higher-package service roles and product companies', 'Medium DSA, complexity trade-offs, internals, design reasoning, chains of follow-ups']
    ], "Start with every Core card. Move to Advanced once most Core cards in a module are marked Confident."),
    F('TR round flow', 'What a TR round looks like', [
      ['Introduction (2–3 min)', 'Tell me about yourself. Sets the tone and gives the interviewer keywords to ask about.'],
      ['Resume walk-through', 'Any word on your resume can become a question: skills, certifications, internships.'],
      ['Project discussion', 'Usually the longest part. Your role, tech stack, DB design, one challenge you fixed.'],
      ['Language and OOPs', 'Java / Python / C basics, OOPs pillars, exceptions, collections.'],
      ['Coding', 'One or two programs on paper, a shared editor or a laptop. Think aloud.'],
      ['Core CS subjects', 'DSA, DBMS + SQL, OS, Computer Networks: a few questions from each.'],
      ['Closing', '“Do you have any questions for us?” End with a good question and a thank-you.']
    ], "A TR round usually lasts **15 to 45 minutes**. Service rounds are often shorter; product rounds go deeper and longer."),
    T('Service vs product', 'Service vs product TR rounds', ['Aspect', 'Service company TR', 'Product company TR'], [
      ['Focus', 'Breadth: many subjects, basic level', 'Depth: fewer topics, many follow-ups'],
      ['Coding', 'Easy programs: strings, arrays, patterns', 'Medium DSA: hashing, two pointers, trees, DP'],
      ['Project', 'Explain it clearly, know your role', 'Defend design choices, scaling, trade-offs'],
      ['Theory', 'Definitions with examples', 'Internals: how HashMap, indexing, TCP really work'],
      ['Complexity', 'Sometimes asked', 'Always expected, with optimisation'],
      ['What wins', 'Clear communication, confident basics', 'Problem-solving process and reasoning']
    ], "Both value the same habit: explain in your own words and connect it to something you built."),
    Q('C', 'Answer formula', "How should I structure any technical answer?",
      [
        "Use four steps: **Define → Explain → Example → Link to project**.",
        "",
        "For example, for “What is a primary key?”: *Define:* a column that uniquely identifies each row. *Explain:* it cannot be NULL or repeat. *Example:* `CustomerID` in the Customer table. *Link:* in my eCommerce project, every order refers to a customer through this key."
      ],
      ["What if I can only remember the definition?", "Say the definition, then give any small example. An example shows understanding more than a perfect definition does."],
      "Stopping after the definition. A one-line textbook answer invites a harder follow-up. Add an example and a project link.",
      { table: [['Step', 'What you say', 'Time'], [
        ['Define', 'One sentence in plain words', '5 s'],
        ['Explain', 'How it works or why it matters', '10–15 s'],

      [
        "The **JVM** runs Java bytecode. The **JRE** is the JVM plus the standard libraries needed to run programs. The **JDK** is the JRE plus development tools like the compiler `javac` and debugger.",
        "",

      { table: [['Part', 'Contains', 'Used for'], [
        ['JVM', 'Class loader, bytecode interpreter, JIT compiler, GC', 'Running bytecode'],
        ['JRE', 'JVM + core libraries', 'Running Java apps'],
        ['JDK', 'JRE + javac, jar, javadoc, debugger', 'Developing Java apps']
      ]] }),

/* small class-diagram helper: boxes = [[x, y, w, title, [lines]]], links = [[x1,y1,x2,y2,label]] */
function classDiagram(w, h, boxes, links, label){
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">`;
  links.forEach(([x1, y1, x2, y2, t]) => {
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--muted);stroke-width:2"/>`;
    if (t) s += `<text x="${(x1 + x2) / 2 + 6}" y="${(y1 + y2) / 2 - 6}" font-size="12" style="fill:var(--muted)">${t}</text>`;
  });
  boxes.forEach(([x, y, bw, title, lines]) => {
    const bh = 34 + lines.length * 18;
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="8" style="fill:var(--surface);stroke:var(--accent);stroke-width:2"/>`;
    s += `<rect x="${x}" y="${y}" width="${bw}" height="28" rx="8" style="fill:var(--accent-soft)"/>`;
    s += `<text x="${x + bw / 2}" y="${y + 19}" text-anchor="middle" font-size="14" font-weight="700">${title}</text>`;
    lines.forEach((l, i) => { s += `<text x="${x + 10}" y="${y + 46 + i * 18}" font-size="12" font-family="monospace">${l.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</text>`; });
  });
  return s + '</svg>';
}

    s += `<text x="${x}" y="86" text-anchor="middle" font-size="13" style="fill:var(--muted)">${a}</text>`;
  });
  s += `<text x="${x0 + end * unit}" y="86" text-anchor="middle" font-size="13" style="fill:var(--muted)">${end}</text></svg>`;
  return s;
}

};
const M = KIT.mods;
const $ = s => document.querySelector(s);
const stage = $('#stage');
const LANGS = { java:'Java', py:'Python', c:'C', cs:'C#', sql:'SQL', txt:'Output' };
const HL = { java:'java', py:'python', c:'c', cs:'csharp', sql:'sql' };
const TIER = { C:'CORE', A:'ADVANCED' };
const DEG = { bsc:'B.Sc/BCA focus', btech:'B.E./B.Tech focus' };

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(s){
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function md(s){
  if (!s) return '';
  if (Array.isArray(s)) s = s.join('\n');
  const blocks = String(s).trim().split(/\n\s*\n/);
  return '<div class="md">' + blocks.map(b => {
    const lines = b.split('\n');
    if (lines.every(l => /^\s*- /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*- /,'')) + '</li>').join('') + '</ul>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('') + '</div>';
}
function table(cols, rows){
  return '<div class="tw"><table><thead><tr>' + cols.map(c => '<th>' + inline(c) + '</th>').join('') +
    '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function hl(code, lang){
  if (window.hljs && HL[lang]) { try { return hljs.highlight(code, { language: HL[lang] }).value; } catch(e){} }
  return esc(code);
}
function codeBlock(code){
  const keys = Object.keys(code);
  const sel = keys.includes(S.lang) ? S.lang : keys[0];
  return '<div class="code" data-code>' +
    (keys.length > 1 || keys[0] !== 'txt' ? '<div class="tabs" role="tablist">' + keys.map(k =>
      `<button role="tab" data-act="lang" data-l="${k}" aria-selected="${k===sel}">${LANGS[k]||k}</button>`).join('') + '</div>' : '') +
    keys.map(k => `<pre data-l="${k}"${k===sel?'':' hidden'}><code>${hl(code[k].replace(/^\n/,'').replace(/\s+$/,''), k)}</code></pre>`).join('') +
    '</div>';
}
function extras(s){
  let h = '';
  if (s.sample) h += s.sample.map(t => '<div class="sub-h">Sample data: ' + esc(t[0]) + '</div>' + table(t[1], t[2])).join('');
  if (s.table) h += table(s.table[0], s.table[1]);
  if (s.html) h += '<div class="diagram">' + s.html + '</div>';
  if (s.steps) h += '<div class="sub-h">Approach</div>' + md(s.steps);
  if (s.pseudo) h += '<div class="sub-h">Pseudo code</div><pre class="plain">' + esc(s.pseudo.trim()) + '</pre>';
  if (s.code) h += codeBlock(s.code);
  if (s.dry) h += '<div class="sub-h">Dry run</div>' + table(s.dry[0], s.dry[1]);
  if (s.out) h += '<div class="sub-h">Output</div>' + table(s.out[0], s.out[1]);
  if (s.edge) h += '<div class="sub-h">Edge cases</div>' + md(s.edge);
  if (s.cx) h += '<div class="chips">' + [].concat(s.cx).map(c => '<span class="cx">' + esc(c) + '</span>').join('') + '</div>';
  return h;
}

/* ---------- slide lists ---------- */
const pass = s => !s.tier || S.f === 'all' || s.tier === S.f;
function list(m){
  const mod = M[m];
  return [{ t:'intro' }].concat(mod.slides.filter(pass), [{ t:'cheat' }, { t:'quiz' }, { t:'end' }]);
}
function counts(mod){
  const c = mod.qs.filter(q => q.tier === 'C').length, a = mod.qs.length - c;
  const vis = mod.qs.filter(pass);
  const conf = vis.filter(q => S.mast[q.id] === 'c').length;
  const rev = vis.filter(q => S.mast[q.id] === 'r').length;
  return { c, a, vis: vis.length, conf, rev };
}

/* ---------- renderers ---------- */
function rHome(){
  const all = M.flatMap(m => m.qs);
  const c = all.filter(q => q.tier === 'C').length;
  const conf = all.filter(q => S.mast[q.id] === 'c').length;
  const last = store.get('last', null);
  let h = `<section class="hero">
    <div class="eyebrow">T.I.M.E. Placement Training</div>
    <h1>Technical Interview <em>Preparation Kit</em></h1>
    <p class="byline">Trainer: <b>Dineshkumar Thangavel</b> · For B.Sc / BCA and B.E. / B.Tech final-year students and freshers</p>
    <p class="lead">Every question an interviewer can ask in a technical (TR) round, with a model answer you can say aloud, the follow-up that usually comes next, and the mistake to avoid.</p>
    <div class="stat"><span><b>${M.length}</b> modules</span><span><b>${c}</b> Core questions</span><span><b>${all.length - c}</b> Advanced questions</span><span><b>${conf}</b> marked confident</span></div>
  </section>
  <div class="search"><input id="q" type="search" placeholder="Search questions: deadlock, HashMap, normalisation, JOIN…" aria-label="Search questions" value="${esc(S.q)}">
  ${last && M[last.m] ? `<button class="pbtn" data-act="go" data-m="${last.m}" data-i="${last.i}">Continue: ${esc(M[last.m].title)}</button>` : `<button class="pbtn" data-act="go" data-m="0" data-i="0">Start</button>`}</div>
  <ul class="results" id="results"></ul>
  <div class="legend"><span class="tier C">CORE</span> mass-recruiting service roles <span class="tier A">ADVANCED</span> higher-package and product roles <span>· Keys: <span class="kbd">←</span> <span class="kbd">→</span> slides, <span class="kbd">Space</span> reveal next part, <span class="kbd">F</span> full screen</span></div>
  <div class="tiles">`;
  M.forEach((m, i) => {
    const k = counts(m);
    const pct = k.vis ? Math.round(k.conf / k.vis * 100) : 0;
    h += `<button class="tile" data-act="go" data-m="${i}" data-i="0">
      <span class="no">${String(i).padStart(2,'0')}</span><span class="tt">${esc(m.title)}</span>
      <span class="ct">${k.c} Core · ${k.a} Advanced${k.conf ? ' · ' + k.conf + ' confident' : ''}</span>
      <span class="pg" aria-label="${pct}% confident"><i style="width:${pct}%"></i></span></button>`;
  });
  return h + '</div>';
}
function rResults(){
  const el = $('#results'); if (!el) return;
  const q = S.q.trim().toLowerCase();
  if (q.length < 2) { el.innerHTML = ''; return; }
  const hits = [];
  M.forEach((m, mi) => m.qs.forEach(s => {
    if (!pass(s)) return;
    const hay = (s.q + ' ' + s.sub + ' ' + (s.a || '')).toLowerCase();
    if (hay.includes(q)) hits.push([mi, s]);
  }));
  el.innerHTML = hits.slice(0, 40).map(([mi, s]) =>
    `<li><button data-act="find" data-m="${mi}" data-id="${s.id}"><span class="tier ${s.tier}">${TIER[s.tier]}</span><span>${inline(s.q)}</span><small>${esc(M[mi].title)}</small></button></li>`).join('') +
    (hits.length ? (hits.length > 40 ? `<li class="note">Showing 40 of ${hits.length} matches. Add another word to narrow it down.</li>` : '') : '<li class="note">No questions match. Try a shorter word, or switch the tier filter to All.</li>');
}
function rIntro(mod){
  const k = counts(mod);
  return `<div class="intro-top"><div class="mcode">${String(mod.idx).padStart(2,'0')}</div>
    <div class="sheet" style="gap:8px"><div class="eyebrow">Module ${mod.idx} · ${esc(mod.time)} to prepare</div><h1 class="slide-h">${esc(mod.title)}</h1></div></div>
    <p class="lead">${inline(mod.objective)}</p>
    <div class="stat"><span><b>${k.c}</b> Core</span><span><b>${k.a}</b> Advanced</span><span><b>${k.conf}</b> confident</span><span><b>${k.rev}</b> to revise</span></div>
    ${S.f !== 'all' && k.vis === 0 ? `<p class="note">This module has no ${S.f === 'C' ? 'Core' : 'Advanced'} questions. Switch the filter to All to see them.</p>` : ''}
    <div class="grid2">
      <div class="panel"><h3>What interviewers check</h3><ul>${mod.checks.map(c => '<li>' + inline(c) + '</li>').join('')}</ul></div>
      <div class="panel"><h3>Top 5 must-know</h3><ol>${mod.top5.map(c => '<li>' + inline(c) + '</li>').join('')}</ol></div>
    </div>
    <button class="pbtn" data-act="next">Start module →</button>`;
}
function part(cls, key, label, body, open){
  return `<section class="part ${cls}"><button class="ph" data-act="tog" data-k="${key}" aria-expanded="${open}">
    <span class="k">${label}</span><span class="hint">${open ? 'Hide' : 'Show'}</span></button>
    <div class="pb"${open ? '' : ' hidden'}>${body}</div></section>`;
}
function rQ(s){
  const o = S.tr;
  const mk = S.mast[s.id];
  let h = `<div class="chips"><span class="tier ${s.tier}">${TIER[s.tier]}</span>${s.deg ? `<span class="deg">${DEG[s.deg]}</span>` : ''}<span class="subt">${esc(s.sub)}</span></div>
    <h2 class="qtext"><span class="qmark">Q.</span><span>${inline(s.q)}</span></h2><div class="parts">`;
  h += part('an', 'a', s.code || s.steps ? 'Model answer + code' : 'Model answer', md(s.a) + extras(s), o);
  if (s.f) h += part('fu', 'f', 'Likely follow-up', `<p class="fq">${inline(s.f[0])}</p>${md(s.f[1])}`, o);
  if (s.m) h += part('mi', 'm', 'Common mistake', md(s.m), o);
  h += `</div><div class="mast"><span class="lbl">How do you feel about this one?</span>
    <button class="mbtn c" data-act="mast" data-v="c" aria-pressed="${mk==='c'}">Confident</button>
    <button class="mbtn r" data-act="mast" data-v="r" aria-pressed="${mk==='r'}">Revise</button></div>`;
  return h;
}
function rC(s){
  return `<div class="chips">${s.tier ? `<span class="tier ${s.tier}">${TIER[s.tier]}</span>` : ''}<span class="subt">${esc(s.sub)}</span></div>
    <h2 class="slide-h">${inline(s.h)}</h2>${md(s.body)}${extras(s)}`;
}
function rT(s){
  return `<div class="chips">${s.tier ? `<span class="tier ${s.tier}">${TIER[s.tier]}</span>` : ''}<span class="subt">${esc(s.sub)}</span></div>
    <h2 class="slide-h">${inline(s.h)}</h2>${table(s.cols, s.rows)}${s.note ? md(s.note) : ''}${extras(s)}`;
}
function rF(s){
  const shown = S.tr ? s.steps.length : 1;
  return `<div class="chips">${s.tier ? `<span class="tier ${s.tier}">${TIER[s.tier]}</span>` : ''}<span class="subt">${esc(s.sub)}</span></div>
    <h2 class="slide-h">${inline(s.h)}</h2>
    <ol class="steps">${s.steps.map((st, i) => `<li${i < shown ? '' : ' hidden'}><div><b>${inline(st[0])}</b><span>${inline(st[1])}</span></div></li>`).join('')}</ol>
    ${shown < s.steps.length ? '<button class="pbtn" data-act="step">Next step</button>' : ''}
    ${s.note ? md(s.note) : ''}${extras(s)}`;
}
function rCheat(mod){
  return `<div class="eyebrow">${esc(mod.title)} · Cheat sheet</div><h2 class="slide-h">One-screen revision</h2>
    <dl class="cheat" style="margin:0">${mod.cheat.map(([k, v]) => `<div><dt>${inline(k)}</dt><dd>${inline(v)}</dd></div>`).join('')}</dl>`;
}
function rQuiz(mod){
  return `<div class="eyebrow">${esc(mod.title)} · Self-check</div><h2 class="slide-h">Rapid fire: answer aloud, then check</h2>
    <ol class="quiz">${mod.quiz.map(([q, a]) => `<li><span><b>${inline(q)}</b></span>${S.tr ? `<span class="qa">${inline(a)}</span>` :
      `<button data-act="qa" data-a="${esc(a)}">Show answer</button>`}</li>`).join('')}</ol>`;
}
function rEnd(mod){
  const k = counts(mod);
  const rev = mod.qs.filter(q => pass(q) && S.mast[q.id] === 'r');
  const prev = mod.idx > 0 ? M[mod.idx - 1] : null, next = M[mod.idx + 1];
  return `<div class="eyebrow">Module ${mod.idx} complete</div><h2 class="slide-h">${esc(mod.title)}: done</h2>
    <div class="stat"><span><b>${k.conf}</b> of ${k.vis} confident</span><span><b>${k.rev}</b> to revise</span><span><b>${k.vis - k.conf - k.rev}</b> not marked</span></div>
    ${rev.length ? `<div class="panel"><h3>Revise these next</h3><ul class="results">${rev.map(s =>
      `<li><button data-act="find" data-m="${mod.idx}" data-id="${s.id}"><span class="tier ${s.tier}">${TIER[s.tier]}</span><span>${inline(s.q)}</span></button></li>`).join('')}</ul></div>` :
      '<p class="note">Mark questions as Confident or Revise while you study. Anything marked Revise is listed here.</p>'}
    <div class="end-actions">
      ${prev ? `<button class="gbtn" data-act="go" data-m="${prev.idx}" data-i="0">← ${esc(prev.title)}</button>` : ''}
      ${next ? `<button class="pbtn" data-act="go" data-m="${next.idx}" data-i="0">Next: ${esc(next.title)} →</button>` : ''}
      <button class="gbtn" data-act="home">Home</button></div>`;
}

/* ---------- render + navigation ---------- */
let cur = null;
function render(){
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.f));
  $('#trainerBtn').setAttribute('aria-pressed', S.tr);
  let h, crumb, no, pct;
  if (S.m < 0) {
    h = rHome(); crumb = '<span>Home</span>'; no = 'Home'; pct = 0; cur = null;
    try { history.replaceState(null, '', '#home'); } catch(e){}
  } else {
    const mod = M[S.m], L = list(S.m);
    S.i = Math.max(0, Math.min(S.i, L.length - 1));
    const s = cur = L[S.i];
    h = s.t === 'intro' ? rIntro(mod) : s.t === 'q' ? rQ(s) : s.t === 'c' ? rC(s) : s.t === 't' ? rT(s) : s.t === 'f' ? rF(s) :
        s.t === 'cheat' ? rCheat(mod) : s.t === 'quiz' ? rQuiz(mod) : rEnd(mod);
    const sub = s.sub || ({ intro:'Overview', cheat:'Cheat sheet', quiz:'Self-check', end:'Module complete' })[s.t];
    crumb = `<button data-act="home">Home</button><i>›</i>${esc(mod.title)}<i>›</i>${esc(sub)}`;
    no = `M${mod.idx} · ${S.i + 1} / ${L.length}`; pct = (S.i + 1) / L.length * 100;
    store.set('last', { m: S.m, i: S.i });
    try { history.replaceState(null, '', '#' + mod.id + '.' + S.i); } catch(e){}
  }
  stage.innerHTML = '<div class="sheet fade">' + h + '</div>';
  stage.scrollTop = 0;
  $('#crumb').innerHTML = crumb; $('#slideNo').textContent = no; $('#progBar').style.width = pct + '%';
  $('#prevBtn').disabled = S.m < 0;
  $('#nextBtn').textContent = S.m < 0 ? 'Start →' : 'Next →';
  if (S.m < 0) { const q = $('#q'); q.addEventListener('input', () => { S.q = q.value; rResults(); }); rResults(); }
}
function go(m, i){ S.m = m; S.i = i; render(); stage.focus({ preventScroll: true }); }
function next(){
  if (S.m < 0) return go(0, 0);
  if (S.i < list(S.m).length - 1) return go(S.m, S.i + 1);
  if (S.m < M.length - 1) return go(S.m + 1, 0);
  go(-1, 0);
}
function prev(){
  if (S.m < 0) return;
  if (S.i > 0) return go(S.m, S.i - 1);
  if (S.m > 0) return go(S.m - 1, list(S.m - 1).length - 1);
  go(-1, 0);
}
function revealNext(){
  if (!cur) return false;
  const b = [...stage.querySelectorAll('.ph[aria-expanded="false"]')][0];
  if (b) { toggle(b); return true; }
  const st = stage.querySelector('[data-act="step"]');
  if (st) { step(); return true; }
  return false;
}
function toggle(b){
  const open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open);
  b.querySelector('.hint').textContent = open ? 'Hide' : 'Show';
  b.nextElementSibling.hidden = !open;
}
function step(){
  const hid = stage.querySelector('.steps li[hidden]');
  if (hid) hid.hidden = false;
  if (!stage.querySelector('.steps li[hidden]')) { const b = stage.querySelector('[data-act="step"]'); if (b) b.remove(); }
}

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'go') go(+b.dataset.m, +b.dataset.i);
  else if (a === 'home') go(-1, 0);
  else if (a === 'next') next();
  else if (a === 'tog') toggle(b);
  else if (a === 'step') step();
  else if (a === 'qa') { const s = document.createElement('span'); s.className = 'qa'; s.innerHTML = inline(b.dataset.a); b.replaceWith(s); }
  else if (a === 'lang') {
    S.lang = b.dataset.l; store.set('lang', S.lang);
    stage.querySelectorAll('[data-code]').forEach(cb => {
      const has = cb.querySelector(`pre[data-l="${S.lang}"]`); if (!has) return;
      cb.querySelectorAll('.tabs button').forEach(t => t.setAttribute('aria-selected', t.dataset.l === S.lang));
      cb.querySelectorAll('pre').forEach(p => p.hidden = p.dataset.l !== S.lang);
    });
  }
  else if (a === 'mast') {
    const v = b.dataset.v;
    if (S.mast[cur.id] === v) delete S.mast[cur.id]; else S.mast[cur.id] = v;
    store.set('mast', S.mast);
    stage.querySelectorAll('.mbtn').forEach(x => x.setAttribute('aria-pressed', S.mast[cur.id] === x.dataset.v));
  }
  else if (a === 'find') {
    const mi = +b.dataset.m, L = list(mi);
    const idx = L.findIndex(s => s.id === b.dataset.id);
    go(mi, idx < 0 ? 0 : idx);
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('.top [data-act="home"], .crumb [data-act="home"]'); if (b) go(-1, 0);
});
$('#homeBtn').onclick = () => go(-1, 0);
$('#prevBtn').onclick = prev;
$('#nextBtn').onclick = next;
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  const keep = cur; S.f = b.dataset.f; store.set('f', S.f);
  if (S.m >= 0) { const L = list(S.m); const at = L.indexOf(keep); if (at >= 0) S.i = at; }
  render();
});
$('#trainerBtn').onclick = () => { S.tr = !S.tr; store.set('tr', S.tr); render(); };

/* full screen: hidden where the browser or frame doesn't allow it */
const fsBtn = $('#fsBtn');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFs(){
  try {
    const d = document, r = d.documentElement;
    const p = fsEl() ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)
                     : (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
    if (p && p.catch) p.catch(() => {});
  } catch(e){}
}
const FS_ICON = {
  enter: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  exit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
};
function fsSync(){
  const on = !!fsEl(), label = on ? 'Exit full screen' : 'Full screen';
  fsBtn.setAttribute('aria-pressed', on);
  fsBtn.setAttribute('aria-label', label);
  fsBtn.title = label + ' (F)';
  fsBtn.innerHTML = on ? FS_ICON.exit : FS_ICON.enter;
}
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;
fsBtn.onclick = toggleFs;
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, fsSync));
fsSync();
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === ' ' && !e.target.matches('button')) { e.preventDefault(); if (!revealNext()) next(); }
  else if (e.key === 'Home' || e.key === 'h') { go(-1, 0); }
  else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
});

/* deep link: #<moduleId>.<slide> */
(function(){
  const h = (location.hash || '').slice(1);
  const mm = h.match(/^([a-z0-9_-]+)\.(\d+)$/i);
  if (mm) { const mi = M.findIndex(m => m.id === mm[1]); if (mi >= 0) { S.m = mi; S.i = +mm[2]; } }
})();
render();
})();
</script>
