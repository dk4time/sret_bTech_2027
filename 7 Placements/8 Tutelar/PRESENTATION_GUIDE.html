# hotseat | Hot seat | Call a student up. They open the file at the given lines and explain it in about 60 seconds. Then reveal the expected explanation.

### Open backend/src/app.js lines 22-44. Explain the middleware order.
> answer | Expected explanation
Order matters because Express runs middleware top to bottom. Helmet adds security headers first. CORS allows only FRONTEND_ORIGIN. Then come compression, the JSON body parser (1 MB limit), mongo-sanitize to strip `$` keys, and Morgan logging. Then Swagger at /api-docs and all routes under /api. `notFound` comes after the routes, so it only catches unmatched URLs. `errorHandler` is last, because Express recognises error middleware by its 4 arguments and passes errors forward to it.

### Open backend/src/middlewares/asyncHandler.js lines 6-10. What does it do?
> answer | Expected explanation
A higher-order function. It takes an async controller and returns a normal Express handler. `Promise.resolve(fn(...)).catch(next)` sends any thrown error or rejected promise to `next(err)`, so it reaches the central error handler. That's why no controller has try/catch.

### Open backend/src/middlewares/errorHandler.js lines 12-27.
> answer | Expected explanation
Four arguments make it error middleware. If the error is our own ApiError, keep its status code and message. Anything else is a real bug, so it becomes a 500 with 'Internal server error'. Every error is logged with Winston, with route, user id and stack. In production the stack is never sent to the client; in development it's in `details` to help debugging.

### Open backend/src/utils/ApiError.js lines 9-42.
> answer | Expected explanation
A custom error class extending Error, with `statusCode`, `details` and an `isApiError` flag. Static helpers like `ApiError.notFound()` keep services readable. Services throw these without knowing anything about HTTP responses.

### Open backend/src/middlewares/auth.js lines 12-38.
> answer | Expected explanation
Reads `Authorization: Bearer <token>`; missing or wrong scheme → 401. Verifies the JWT signature and expiry; failure → 401. Rejects refresh tokens used as access tokens by checking `type`. Loads the user from the DB, so a deleted user is rejected right away instead of working until the token expires. Puts a small `req.user` object on the request.

### Open backend/src/services/authService.js lines 47-84 (login).
> answer | Expected explanation
Find the user with hidden fields → unknown email gets the same 401 as a wrong password → locked gets 423 with minutes left → bcrypt compare → on failure count attempts and lock at the limit → on success reset counters and issue tokens.
> gotcha | Gap to mention
The attempt counter is read-then-write, not an atomic `$inc`, so simultaneous attempts can undercount.

### Open backend/src/services/authService.js lines 94-120 (refresh).
> answer | Expected explanation
Verify the refresh JWT with the refresh secret, check `type === 'refresh'`, load the stored hash, compare with `crypto.timingSafeEqual` so timing can't leak information. No match means an old or stolen token, so wipe the stored hash and force a new login. A match issues a new pair, which overwrites the hash, so the old refresh token is dead.

### Open backend/src/middlewares/rateLimiter.js lines 19-34.
> answer | Expected explanation
express-rate-limit, 5 attempts per 15 minutes per IP, answering 429 through our `fail()` format instead of the library's plain text. Disabled under NODE_ENV=test so integration tests that send bursts don't get blocked.
> gotcha | Gap to mention
The counter is in memory, so it resets on restart and isn't shared across server instances. Redis would fix that.

### Open backend/src/routes/ticketRoutes.js lines 153-160. Read the chain aloud.
> answer | Expected explanation
validator → validate → loadTicket → permit → controller. Each step can stop the request: 400, then 404, then 403. The controller only runs when everything passed. No business logic is in the route file.

### Open backend/src/middlewares/permit.js lines 15-84.
> answer | Expected explanation
A middleware factory: `permit('comment')` returns a middleware. A switch picks the rule from ticketPermissions. On failure it calls `next(ApiError.forbidden(...))`, so the response is 403. An unknown action name becomes a 500, so a typo can't silently allow access. It needs `loadTicket` to run first so `req.ticket` exists.

### Open backend/src/utils/ticketPermissions.js lines 63-83 (canChangeStatus).
> answer | Expected explanation
Admin always yes. Agent only if `isAssignedAgent`. The special case: anyone who can view a Closed ticket may move it to Reopened, so a requester can reopen their own closed ticket. Everyone else gets false, so it's deny by default.

### Open backend/src/utils/ticketStateMachine.js lines 75-97 (assertTransition).
> answer | Expected explanation
Reject unknown status names with 400. Look up the adjacency list `TRANSITIONS[from]`; if `to` isn't in it, 400 'Illegal status transition', with the allowed targets in `details`. Then check `ROLE_RESTRICTED_TRANSITIONS`, keyed like 'Resolved->Closed'; a wrong role gets 403. The graph is data, not if-statements, so adding a status means adding one line.

### Open backend/src/services/ticketService.js lines 82-105 (assignTicket).
> answer | Expected explanation
Check the target user exists and is an Agent, else 400. Set `assignedTo`. If the ticket is Open or Reopened, also move it to Assigned, still through the state machine. Save, write an activity entry, notify the agent.
> gotcha | Gap to mention
An Agent can call this on a ticket already assigned to another agent and take it over, because the permission check only verifies "assigning to yourself".

### Open backend/src/services/notificationService.js lines 13-37.
> answer | Expected explanation
Two steps. First save the Notification to MongoDB, which always happens and is the source of truth. Then push it live over Socket.io to the room `user:<id>`, which every socket joins on connect. If Socket.io isn't available, log a warning but don't fail, because the data is already saved.

### Open backend/src/sockets/index.js lines 17-41.
> answer | Expected explanation
Socket.io middleware runs once per connection attempt. Take the token from `handshake.auth`, verify it, make sure it's an access token, load the user, and store userId, role and name on `socket.data` for later handlers. Any failure calls `next(new Error(...))`, which refuses the connection.

### Open backend/src/sockets/chatSocket.js lines 39-65 (chat:send).
> answer | Expected explanation
Load the ticket and re-check `canChatOnTicket`, so permission is checked on every message, not just on join. Reject empty messages, then call `chatService.sendMessage`, which saves first and then broadcasts. The `ack` callback tells the client whether it worked, like an HTTP response for sockets.
> gotcha | Gap to mention
No maximum length here. `chatValidators.js` has a 2000-character rule, but nothing uses it.

### Open backend/src/middlewares/upload.js lines 9-38.
> answer | Expected explanation
Multer with memory storage, a 5 MB limit from config, and an allow-list of JPEG, PNG, GIF, WebP and PDF. `fileFilter` rejects other types with a 400 ApiError. `handleUploadErrors` turns Multer's own errors, like LIMIT_FILE_SIZE, into our 400 format instead of a raw 500.
> gotcha | Gap to mention
The MIME type comes from the client, so a renamed .exe claiming image/png passes. Checking the file's magic bytes would fix it.

### Open backend/src/models/Ticket.js lines 16-43.
> answer | Expected explanation
Attachments are an embedded sub-schema with their own `_id`, used in the download URL. Status uses the same STATUSES list as the state machine, so there's one source of truth. `priorityWeight` is a numeric copy of priority kept in sync by a `pre('save')` hook, so sorting by priority means severity, not alphabet.
> gotcha | Gap to mention
Hooks don't run on `updateOne`, so an update that skips `save()` would let the weight drift.

### Open frontend/src/services/api.js lines 44-69 (refresh interceptor).
> answer | Expected explanation
On a 401 that isn't from login or refresh and isn't already a retry, call /auth/refresh once, save the new tokens, and replay the original request. `refreshInFlight` makes many simultaneous 401s share one refresh call instead of five, which rotation would break. If refresh fails, clear the session and tell AuthContext, which logs the user out. A separate Axios instance without interceptors does the refresh call, so it can't loop forever.

### Open frontend/src/components/ChatBox.jsx lines 37-68.
> answer | Expected explanation
On mount: load history over REST, join the socket room and wait for the server's ack, then subscribe to `chat:message`. After each await it checks `cancelled`, so if the user left meanwhile, state isn't set on an unmounted component. Cleanup sets `cancelled`, unsubscribes, and leaves the room. The `[ticketId]` dependency makes switching tickets a clean leave and join.

### Open frontend/src/context/AuthContext.jsx lines 44-66.
> answer | Expected explanation
On app start, register the session-expired handler with the Axios module, so api.js never imports React. If a token is stored, open the socket, then set `initializing` false so ProtectedRoute can decide. `login` saves tokens, sets the user, and connects the socket. Everything is wrapped in useCallback and useMemo so the context value is stable.

# fsd | Generic FSD drill | General full-stack questions any interviewer can ask, not tied to the project. Pair students up as interviewer and candidate, pick Random inside this section, start the 2-minute timer, then reveal the weak answer, the strong answer and the follow-up.

## How to run a mock round

### How do we run a 15-minute mock interview with these cards?
> answer | Format
1. Pair students. One is the interviewer, one the candidate. Swap after each round.
2. The interviewer filters to this section and presses **Random** (or R in presenter mode). Pick 5 cards from at least 3 different groups.
3. Start the 2-minute timer (T). The candidate answers out loud with no notes.
4. The interviewer reveals the weak answer, the strong answer, then asks the follow-up exactly as written.
5. Score each answer with the rubric below. Tick "Covered in class" when the pair has done the card.
> answer | Scoring rubric
| Score | What it sounds like |
|---|---|
| 0 | Silence, or a guess presented as fact |
| 1 | Correct definition only, like the weak answer |
| 2 | Definition plus why it matters or when to use it |
| 3 | Score 2 plus a concrete example, ideally from TicketDesk, and handles the follow-up |
> note | Tip for candidates
Use the pattern **definition → why → example from my project**. If you don't know, say so and say what you would check. Never bluff; the follow-up always exposes it.

## A. JavaScript

### What's the difference between var, let and const?
> weak
"var is old, let and const are new."
> strong
"`var` is function-scoped and hoisted with the value `undefined`, so you can read it before the line that declares it. `let` and `const` are block-scoped and sit in the temporal dead zone until their line runs, so early access throws a ReferenceError. `const` stops reassignment, not mutation: a `const` array can still be pushed to. I default to `const`, use `let` when I must reassign, and never use `var`."
> gotcha | Follow-up they'll ask
What does this print, and why? `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i))`. (3 3 3, because one shared `i`. With `let` it prints 0 1 2, because each iteration gets a new binding.)

### What is a closure? Give a real use.
> weak
"A function inside a function."
> strong
"A closure is a function that remembers the variables of the scope it was created in, even after that outer function has returned. Real uses: private state, like a counter factory where `count` can't be touched from outside; and event handlers or callbacks that need values from when they were set up. React hooks rely on closures too, which is why a stale closure in `useEffect` can read an old state value."
> gotcha | Follow-up they'll ask
What is a stale closure in React and how do you fix it? (The effect captured an old value. Add it to the dependency array, or use the functional updater `setCount(c => c + 1)`, or a ref.)

### Explain the event loop. What does this print?
> show | Code
```
console.log('A');
setTimeout(() => console.log('B'), 0);
Promise.resolve().then(() => console.log('C'));
console.log('D');
```
> weak
"A B C D, because that's the order of the lines."
> strong
"A D C B. Synchronous code runs first on the call stack, so A and D. When the stack is empty, the event loop drains the **microtask** queue completely, which holds promise callbacks, so C. Only then does it take one **macrotask**, like a timer callback, so B. `setTimeout(fn, 0)` means 'at least 0 ms', not 'now'."
> gotcha | Follow-up they'll ask
Where does `await` fit in? (Everything after an `await` runs as a microtask once the awaited promise settles.)

### == vs ===?
> weak
"=== is more strict."
> strong
"`===` compares value and type with no conversion. `==` converts types first, which gives surprises like `0 == ''` and `null == undefined` both being true. I always use `===`. The one place some teams allow `==` is `x == null`, which checks for both null and undefined in one go."
> gotcha | Follow-up they'll ask
What is `NaN === NaN`? (false. Use `Number.isNaN(x)`.)

### Promises vs async/await. And Promise.all vs Promise.allSettled?
> weak
"async/await is newer and better."
> strong
"async/await is syntax on top of promises: an async function always returns a promise, and `await` pauses that function, not the thread. It reads like synchronous code and errors are caught with try/catch. `Promise.all` runs tasks in parallel and fails fast if any one rejects. `Promise.allSettled` waits for all and gives each result's status. In TicketDesk's ticket page I used `allSettled` to load ticket, comments and activity together, so one failing request doesn't blank the whole page."
> gotcha | Follow-up they'll ask
What's wrong with `for (const id of ids) await fetchOne(id)`? (It runs one at a time. If the calls are independent, use `Promise.all(ids.map(fetchOne))`.)

### How does `this` work, and how are arrow functions different?
> weak
"`this` means the current object."
> strong
"`this` is decided by how a normal function is called: `obj.fn()` makes it `obj`, a plain call makes it `undefined` in strict mode, `new` makes it the new object, and `call`, `apply`, `bind` set it explicitly. Arrow functions don't have their own `this`; they use the `this` of the surrounding code. That's why arrows are handy for callbacks inside methods, and why you shouldn't use an arrow as an object method."
> gotcha | Follow-up they'll ask
What does `bind` return? (A new function with `this` fixed permanently.)

### Shallow copy vs deep copy?
> weak
"Deep copy copies more."
> strong
"A shallow copy, like `{...obj}` or `Object.assign`, copies only the top level; nested objects are still shared, so changing `copy.address.city` changes the original too. A deep copy duplicates everything. Today I'd use `structuredClone(obj)`. `JSON.parse(JSON.stringify(obj))` works for plain data but drops functions, `undefined` and turns Dates into strings. This matters in React because state must be updated immutably."
> gotcha | Follow-up they'll ask
How do you update a nested field in React state without mutating? (Spread each level: `setUser(u => ({ ...u, address: { ...u.address, city: 'Chennai' } }))`.)

### Debounce vs throttle?
> weak
"Both make things faster."
> strong
"Both limit how often a function runs. Debounce waits until calls **stop** for a set time, then runs once, which suits a search box: call the API 300 ms after the user stops typing. Throttle runs at most once per interval while calls keep coming, which suits scroll or resize handlers. Debouncing search is how you avoid hitting `/api/tickets?search=` on every keystroke."
> gotcha | Follow-up they'll ask
Write a debounce. (`function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }`)

## B. React

### What is the virtual DOM, and why do lists need keys?
> weak
"The virtual DOM is faster than the real DOM."
> strong
"On each render React builds a lightweight tree of elements, compares it with the previous one (reconciliation), and applies only the differences to the real DOM. Keys tell React which list item is which between renders. With a stable key like `ticket._id`, React can move, add or remove items correctly. With the array index as key, inserting at the top shifts every index, so React may reuse the wrong component and its state, such as an input's text."
> gotcha | Follow-up they'll ask
When is using the index as key acceptable? (When the list is static: never reordered, filtered or inserted into.)

### Explain useEffect: the dependency array and cleanup.
> weak
"useEffect is like componentDidMount."
> strong
"useEffect runs side effects after render: fetching data, subscriptions, timers. No array means it runs after every render; `[]` means once after mount; `[id]` means whenever `id` changes. The function you return is the cleanup, which runs before the next effect and on unmount. In TicketDesk's chat box the effect joins the socket room for `ticketId` and the cleanup leaves it, so switching tickets is a clean leave and join with no leaked listeners."
> gotcha | Follow-up they'll ask
Why does an effect run twice in development? (React StrictMode mounts, unmounts and remounts to expose missing cleanup. It doesn't happen in production.)

### useMemo vs useCallback vs React.memo?
> weak
"They all improve performance."
> strong
"`useMemo` caches a computed **value** between renders until its dependencies change, like a filtered list. `useCallback` caches a **function** reference. `React.memo` wraps a component so it skips re-rendering when its props are shallowly equal. They work together: `React.memo` on a child is useless if the parent passes a new inline function every render, so you wrap that function in `useCallback`. I only add them when there's a measured problem, because they have their own cost."
> gotcha | Follow-up they'll ask
Why do context values often use useMemo? (So consumers don't all re-render each time the provider renders with a new object. TicketDesk's AuthContext does this.)

### Props vs state. When do you reach for Context or Redux?
> weak
"Props are passed, state is inside."
> strong
"Props are inputs from the parent and read-only. State is data a component owns and changes, and changing it causes a re-render. When siblings need the same data, I lift state to the nearest common parent. When many distant components need it, prop-drilling gets painful, so I use Context, like TicketDesk's `AuthContext` and `TicketContext`. Redux or Zustand make sense when global state is large, changes often, and needs dev tools or middleware."
> gotcha | Follow-up they'll ask
What's the downside of one big Context? (Every consumer re-renders when any part of the value changes. Split contexts by concern.)

### Controlled vs uncontrolled components?
> weak
"Controlled is better."
> strong
"A controlled input gets its `value` from React state and updates it in `onChange`, so React is the single source of truth. That makes validation, formatting and resetting easy. An uncontrolled input keeps its own value in the DOM and you read it with a ref when needed. File inputs are always uncontrolled, which is why an attachment uploader reads `event.target.files`."
> gotcha | Follow-up they'll ask
Name a form library and why you'd use it. (React Hook Form: uses uncontrolled inputs under the hood to avoid re-rendering on every keystroke.)

### I call setCount(count + 1) three times in one click. What happens?
> weak
"It goes up by 3."
> strong
"It goes up by 1. State updates are batched and applied on the next render, and all three calls read the same `count` from this render's closure. To build on the previous value, use the functional updater: `setCount(c => c + 1)` three times gives +3. Also, `console.log(count)` right after `setCount` shows the old value for the same reason."
> gotcha | Follow-up they'll ask
Does React batch updates inside setTimeout or promises? (Yes, since React 18 batching is automatic everywhere.)

### What are the rules of hooks, and what is a custom hook?
> weak
"Hooks start with use."
> strong
"Only call hooks at the top level, not inside conditions, loops or nested functions, and only from components or other hooks. React tracks hooks by call order, so a conditional hook shifts the order and mixes up state. A custom hook is just a function starting with `use` that calls other hooks to share logic, like `useAuth()` which wraps `useContext(AuthContext)` and throws if used outside the provider."
> gotcha | Follow-up they'll ask
Do two components using the same custom hook share state? (No. Each call has its own state. To share, put the state in context.)

### A list of 5,000 rows is slow. How do you speed it up?
> weak
"Use useMemo."
> strong
"First measure with React DevTools Profiler to see what re-renders. Then: paginate on the server so you don't fetch 5,000 rows, which is what TicketDesk's `page` and `limit` do; virtualise the list with react-window so only visible rows are in the DOM; use stable keys; wrap row components in `React.memo` and keep their props stable; and debounce filter input."
> gotcha | Follow-up they'll ask
What is code splitting? (Loading parts of the bundle on demand with `React.lazy` and `Suspense`, for example per route.)

### Client-side rendering vs server-side rendering?
> weak
"SSR is faster."
> strong
"With CSR, like a Vite React app, the server sends an almost empty HTML page and JavaScript builds the UI in the browser. It's simple to host but slower to first paint and weaker for SEO. With SSR, like Next.js, the server renders HTML per request so content shows sooner and crawlers see it, then React hydrates it to make it interactive. Static generation pre-renders at build time. An internal tool like TicketDesk is fine as CSR since it's behind a login and SEO doesn't matter."
> gotcha | Follow-up they'll ask
What is hydration? (React attaching event handlers and state to server-rendered HTML instead of re-creating it.)

## C. Node.js and Express

### Node is single-threaded. How does it handle thousands of requests?
> weak
"It is very fast."
> strong
"Your JavaScript runs on one thread, but I/O like database calls, files and network is non-blocking. Node hands that work to the OS or libuv's thread pool and keeps serving other requests; when the I/O finishes, its callback is queued on the event loop. So it's great for I/O-heavy APIs. The weakness is CPU-heavy work: a long loop blocks every request. For that you use worker threads, a separate service, or a job queue."
> gotcha | Follow-up they'll ask
How do you use all CPU cores? (Run several Node processes with the cluster module, PM2, or multiple containers behind a load balancer.)

### What is middleware in Express, and why does order matter?
> weak
"Code that runs in the middle."
> strong
"Middleware is a function `(req, res, next)` in the request pipeline. It can read or change `req`, end the response, or call `next()` to pass control on. They run in the order they're registered. So `helmet`, CORS and `express.json()` go first, auth before permission checks, routes after that, and the error handler with four arguments `(err, req, res, next)` goes last. In TicketDesk a route chain is: authenticate → load ticket → permit → validate → controller."
> gotcha | Follow-up they'll ask
What happens if middleware neither calls next() nor sends a response? (The request hangs until the client times out.)

### How do you handle errors in async Express routes?
> weak
"Put try/catch in every route."
> strong
"In Express 4, a rejected promise in an async handler isn't caught automatically, so the request hangs or crashes the process. I wrap controllers in an `asyncHandler` that catches the rejection and calls `next(err)`, then one global error middleware logs it and sends a consistent JSON error. Known errors are thrown as an `ApiError` with a status code; unknown ones become a generic 500 with the stack hidden in production. Express 5 forwards async errors natively."
> gotcha | Follow-up they'll ask
What's the difference between operational errors and programmer errors? (Operational: expected failures like bad input or a DB timeout; handle them. Programmer: bugs; log, fix, and often restart.)

### CommonJS vs ES modules?
> weak
"import is newer than require."
> strong
"CommonJS uses `require` and `module.exports`, loads synchronously, and was Node's original system. ES modules use `import`/`export`, are the JavaScript standard, are statically analysable so bundlers can tree-shake unused code, and support top-level `await`. In Node you opt in with `"type": "module"` or `.mjs`. Our React frontend uses ESM through Vite."
> gotcha | Follow-up they'll ask
What is a circular dependency and how do you break it? (A imports B which imports A, so one sees a half-initialised module. Break it with a small shared module, like TicketDesk's `sockets/io.js` registry.)

### What are streams and when would you use them?
> weak
"For video."
> strong
"Streams process data in chunks instead of loading it all into memory. Readable, writable, duplex and transform streams can be piped together, and backpressure stops a fast producer from flooding a slow consumer. I'd use them to serve or upload large files, export a big CSV from a database cursor, or proxy a response. Reading a 2 GB file with `readFile` could crash the process; `createReadStream().pipe(res)` uses a small constant amount of memory."
> gotcha | Follow-up they'll ask
What does `process.nextTick` do compared with `setImmediate`? (nextTick runs before any other queued work, right after the current operation. setImmediate runs on the next loop iteration, after I/O.)

### How do you manage configuration and secrets in a Node app?
> weak
"Put them in the code."
> strong
"Read them from environment variables, load a `.env` file only in development, and commit only `.env.example` with every variable documented. Validate the config at startup and fail fast if something required is missing. In production, secrets come from the platform: Docker or Kubernetes secrets, AWS Secrets Manager, and so on. Never log secrets, and rotate them if they leak into git."
> gotcha | Follow-up they'll ask
A secret was pushed to GitHub and then deleted in the next commit. Is it safe? (No. It's still in history. Rotate it immediately.)

## D. Databases (MongoDB and SQL)

### SQL vs NoSQL: how do you choose?
> weak
"NoSQL is faster and more modern."
> strong
"SQL databases have a fixed schema, strong relations with JOINs, and mature multi-row transactions, which suits banking, orders and anything heavily relational. Document databases like MongoDB store flexible JSON-like documents, so data read together can be stored together, which suits evolving schemas and nested data. Both can scale. I choose by data shape and consistency needs. TicketDesk uses MongoDB, but its data is fairly relational, so I can also show the same schema as SQL tables."
> gotcha | Follow-up they'll ask
What is the CAP theorem? (In a network partition a distributed system must choose consistency or availability.)

### In MongoDB, when do you embed and when do you reference?
> weak
"Always embed, it's faster."
> strong
"Embed when the child data is owned by the parent, is read together with it, and stays bounded, like a ticket's attachments array. Reference when the data is shared, grows without limit, or is queried on its own, like comments, users and chat messages. A document is capped at 16 MB, so an unbounded embedded array, such as every chat message ever, is a time bomb."
> gotcha | Follow-up they'll ask
populate vs $lookup? (populate is Mongoose and runs extra queries from Node. $lookup is a server-side join inside an aggregation pipeline.)

### What is an index? What's a compound index and how do you check it's used?
> weak
"Indexes make queries faster."
> strong
"An index is a sorted structure, usually a B-tree, that lets the database find rows without scanning the whole collection. It speeds up reads but costs disk space and slows writes. A compound index covers several fields in order, and helps queries that use a left prefix of it, so `(status, assignedTo)` helps 'status = Open' and 'status = Open and assignedTo = me', but not 'assignedTo = me' alone. I check with `.explain('executionStats')`: I want IXSCAN, not COLLSCAN, and documents examined close to documents returned."
> gotcha | Follow-up they'll ask
What is the ESR rule? (Order compound-index fields as Equality, then Sort, then Range.)

### What is the aggregation pipeline? Give an example.
> weak
"It's for complex queries."
> strong
"It's a series of stages that transform documents, like `$match` to filter, `$group` to count or sum, `$sort`, `$project`, and `$lookup` to join. Put `$match` early so later stages handle fewer documents and indexes can be used. A dashboard count of tickets by status is `[{ $group: { _id: '$status', count: { $sum: 1 } } }]`, which is what a summary endpoint like TicketDesk's `/api/dashboard/summary` does."
> gotcha | Follow-up they'll ask
Write the SQL version. (`SELECT status, COUNT(*) FROM tickets GROUP BY status;`)

### What does ACID mean? Does MongoDB support transactions?
> weak
"ACID means the database is reliable."
> strong
"Atomicity: all of a transaction happens or none of it. Consistency: it moves the database from one valid state to another. Isolation: concurrent transactions don't see each other's half-done work. Durability: once committed, it survives a crash. Single-document writes in MongoDB are always atomic, and since 4.0 it supports multi-document transactions on a replica set. Example: changing a ticket's status and writing its activity log should be one transaction so you never get one without the other."
> gotcha | Follow-up they'll ask
What is a race condition and how do you prevent one in a DB update? (Two requests read-then-write the same row. Use an atomic update like `findOneAndUpdate` with a condition, a transaction, or optimistic locking with a version field.)

### Explain normalization, and the JOIN types.
> weak
"Normalization means no duplicate data."
> strong
"Normalization splits data into tables so each fact is stored once, which avoids update anomalies. 1NF: atomic values, no repeating groups. 2NF: no column depends on only part of a composite key. 3NF: no column depends on another non-key column. JOINs: INNER returns only matching rows; LEFT returns all left rows with NULLs where nothing matches, like all tickets including unassigned ones; RIGHT is the mirror; FULL OUTER returns everything from both."
> gotcha | Follow-up they'll ask
When would you denormalize? (For read-heavy reporting where JOINs are too slow, accepting extra work to keep copies in sync.)

### What is the N+1 query problem?
> weak
"Too many queries."
> strong
"You fetch a list with 1 query, then run 1 more query per item, like loading 50 tickets and then each ticket's creator separately: 51 round trips. Fix it by fetching related data in one go: a JOIN in SQL, `$lookup`, or Mongoose `populate`, which batches the lookups into a single `$in` query per field."
> gotcha | Follow-up they'll ask
How would you spot it? (Turn on query logging or use an APM tool and look for repeated similar queries per request.)

## E. REST and HTTP

### POST vs PUT vs PATCH. What does idempotent mean?
> weak
"POST creates, PUT updates."
> strong
"Idempotent means doing the same request many times leaves the server in the same state as doing it once. GET, PUT and DELETE are idempotent; POST is not, because two POSTs create two records. PUT replaces the whole resource; PATCH changes part of it, like TicketDesk's `PATCH /tickets/:id/status`. To make ticket creation safe to retry, TicketDesk requires an `x-request-id` header so a retried POST doesn't create a duplicate."
> gotcha | Follow-up they'll ask
Is PATCH idempotent? (Not guaranteed. "Set status to Resolved" is; "increment count by 1" isn't.)

### 401 vs 403? And 400 vs 422, 404, 409, 429, 500?
> weak
"Both mean not allowed."
> strong
"401 Unauthorized really means unauthenticated: no token or a bad one, so log in. 403 Forbidden means we know who you are, but you're not allowed, like a Requester trying to delete a ticket. 400 is a malformed or invalid request; some APIs use 422 for well-formed data that fails validation. 404 not found, 409 conflict such as a duplicate email, 429 too many requests, and 500 is the server's fault."
> gotcha | Follow-up they'll ask
Should a missing ticket the user isn't allowed to see return 403 or 404? (Often 404, so you don't leak that it exists.)

### What happens when you type a URL into the browser and press Enter?
> weak
"The browser loads the website."
> strong
"The browser checks its cache, then DNS resolves the domain to an IP. It opens a TCP connection and does a TLS handshake for HTTPS. It sends an HTTP GET; the request may pass a CDN or load balancer before reaching the server, which returns HTML. The browser parses HTML into the DOM and CSS into the CSSOM, runs JavaScript, builds the render tree, then does layout and paint. Extra requests fetch images, scripts and API data."
> gotcha | Follow-up they'll ask
Why put `<script>` with `defer`? (So downloading the script doesn't block HTML parsing; it runs after parsing in order.)

### What is CORS and why do I see CORS errors?
> weak
"It's a security error. Use a CORS plugin."
> strong
"Browsers enforce the same-origin policy: a page on one origin (scheme, host, port) can't read responses from another origin unless that server allows it with `Access-Control-Allow-Origin` headers. For non-simple requests, like JSON with an Authorization header, the browser first sends an OPTIONS preflight. The fix is on the server, not the client: TicketDesk allows only the origin in `FRONTEND_ORIGIN`. CORS protects users in browsers; it doesn't stop Postman or curl."
> gotcha | Follow-up they'll ask
Why is `Access-Control-Allow-Origin: *` with credentials not allowed? (A wildcard plus cookies would let any site make logged-in requests. You must name the origin.)

### Offset pagination vs cursor pagination?
> weak
"Use page and limit."
> strong
"Offset pagination, `skip((page - 1) * limit).limit(limit)`, is simple and lets you jump to page 7, which is what TicketDesk does. But skip gets slower on deep pages because the database still walks past skipped rows, and new inserts can shift items between pages. Cursor pagination says 'give me 20 after this id or timestamp', using an index, so it stays fast and stable. It suits infinite scroll and feeds."
> gotcha | Follow-up they'll ask
What should the response include besides the items? (Total count or `hasNext`, the current page and limit, or the next cursor.)

### REST vs GraphQL?
> weak
"GraphQL is the new REST."
> strong
"REST exposes resources at many URLs and uses HTTP verbs, status codes and caching naturally. GraphQL has one endpoint where the client asks for exactly the fields it needs, which avoids over-fetching and under-fetching, especially for mobile apps showing data from many sources. The cost is more server complexity, harder HTTP caching, and the need to guard against expensive nested queries. For a CRUD app like TicketDesk, REST is simpler."
> gotcha | Follow-up they'll ask
How do you version a REST API? (A URL prefix like `/api/v1`, or a header. Never break existing clients silently.)

## F. Authentication and security

### Sessions vs JWT?
> weak
"JWT is more secure."
> strong
"With sessions, the server stores session data and the browser holds a session id cookie, so logout and revoking are easy but the server keeps state. A JWT is a signed token holding claims like user id and role; the server just verifies the signature, so it's stateless and works across services. The catch: you can't easily revoke a JWT before it expires. That's why TicketDesk uses a short 15-minute access token plus a refresh token that's stored as a hash and rotated on each use."
> gotcha | Follow-up they'll ask
Is a JWT encrypted? (No. It's base64url-encoded and signed. Anyone can read the payload, so never put secrets in it.)

### Where should the frontend store the token?
> weak
"localStorage."
> strong
"localStorage is easy but any script on the page can read it, so one XSS bug leaks the token. An httpOnly, Secure, SameSite cookie can't be read by JavaScript, which removes that risk, but cookies are sent automatically, so you must handle CSRF with SameSite and, if needed, a CSRF token. A common setup: access token in memory, refresh token in an httpOnly cookie. TicketDesk stores tokens in localStorage, and I'd call that out as a trade-off to improve."
> gotcha | Follow-up they'll ask
What does SameSite=Strict vs Lax do? (Strict never sends the cookie on cross-site requests; Lax sends it on top-level GET navigations only.)

### How should passwords be stored?
> weak
"Encrypted in the database."
> strong
"Never stored, and never encrypted, because encryption can be reversed. Store a slow, salted hash with bcrypt, scrypt or Argon2. The salt is random per user so identical passwords get different hashes and rainbow tables don't work. 'Slow' is the point: a cost factor makes brute-forcing expensive. On login you hash the attempt and compare. Add rate limiting and account lockout, as TicketDesk does, and return the same message for wrong email and wrong password."
> gotcha | Follow-up they'll ask
Why not SHA-256 for passwords? (It's designed to be fast, so attackers can try billions of guesses per second on a GPU.)

### Explain XSS, CSRF and injection, and how you prevent each.
> weak
"Validate input."
> strong
"XSS: an attacker gets their script to run in your page, like a comment containing `<script>`. Prevent it by escaping output; React escapes by default, so avoid `dangerouslySetInnerHTML`, and add a Content-Security-Policy. CSRF: another site makes the user's browser send an authenticated request using their cookies. Prevent it with SameSite cookies, CSRF tokens, or Bearer tokens in headers. Injection: user input becomes part of a query, like SQL injection or Mongo's `{ $gt: '' }` in a login field. Prevent it with parameterised queries, schema validation, and stripping `$` operators."
> gotcha | Follow-up they'll ask
What does helmet do? (Sets security headers like CSP, X-Content-Type-Options, frame protections and HSTS.)

### What is OAuth 2.0? Is it authentication?
> weak
"It's login with Google."
> strong
"OAuth 2.0 is an authorization framework: it lets an app get limited access to a user's data at another service without seeing their password. The user approves on the provider, the app gets a short code, and its server swaps it for an access token. It's not authentication on its own; OpenID Connect adds an ID token on top to say who the user is, and that's what 'Sign in with Google' uses. For browser and mobile apps, use the authorization code flow with PKCE."
> gotcha | Follow-up they'll ask
Authentication vs authorization? (Authentication: who are you. Authorization: what are you allowed to do. TicketDesk's `authenticate` and `permit` middlewares are exactly these two.)

## G. HTML, CSS and the browser

### Flexbox vs Grid?
> weak
"Grid is newer."
> strong
"Flexbox is one-dimensional: it lays items out in a row or a column, great for nav bars, button groups and centring. Grid is two-dimensional: rows and columns together, great for page layouts and card galleries. They combine well: Grid for the page, Flexbox inside each card. Centring anything: `display: flex; justify-content: center; align-items: center`, or `display: grid; place-items: center`."
> gotcha | Follow-up they'll ask
What does `flex: 1` mean? (`flex-grow: 1; flex-shrink: 1; flex-basis: 0%`: share free space equally.)

### Explain the box model and box-sizing.
> weak
"Margin, border, padding, content."
> strong
"Every element is a box: content, then padding, then border, then margin. With the default `box-sizing: content-box`, `width` sets only the content, so padding and border make the element wider than you set. With `border-box`, `width` includes padding and border, which is far easier to reason about, so most projects apply `*, *::before, *::after { box-sizing: border-box; }`. Vertical margins between blocks can collapse into the larger one."
> gotcha | Follow-up they'll ask
Position relative vs absolute vs fixed vs sticky? (Absolute is placed relative to the nearest positioned ancestor; fixed to the viewport; sticky acts relative until a scroll threshold, then sticks.)

### Why does semantic HTML and accessibility matter?
> weak
"For SEO."
> strong
"Semantic tags like `header`, `nav`, `main`, `button` and `label` tell the browser, screen readers and search engines what each part is. A `div` with an onClick isn't focusable by keyboard and isn't announced as a button; a real `<button>` gets all that for free. Basics: alt text on images, labels tied to inputs, enough colour contrast, visible focus states, and everything usable with the keyboard alone."
> gotcha | Follow-up they'll ask
When do you use ARIA? (Only when no native element fits. The first rule of ARIA is don't use ARIA if HTML can do it.)

### localStorage vs sessionStorage vs cookies?
> weak
"They all store data."
> strong
"localStorage persists until cleared and is shared across tabs of the same origin. sessionStorage lasts for one tab and is cleared when it closes. Both hold about 5 MB, are synchronous, are readable by any script on the page, and are never sent to the server automatically. Cookies are small, about 4 KB, are sent with every matching request, and can be made httpOnly, Secure and SameSite, which is why they're used for sessions."
> gotcha | Follow-up they'll ask
What is IndexedDB for? (Larger, structured, async client-side storage, such as offline data.)

### What are event bubbling and event delegation?
> weak
"Events go up."
> strong
"Most events fire on the target element, then bubble up through its ancestors. Delegation uses that: put one listener on a parent and check `event.target` to see which child was clicked. It saves memory with many items and works for items added later. `event.stopPropagation()` stops bubbling; `event.preventDefault()` stops the browser's default action, like a form submit reloading the page."
> gotcha | Follow-up they'll ask
What is the capturing phase? (The event travels down from window to the target before bubbling up. Listen there with `{ capture: true }`.)

## H. Git, testing and DevOps

### git merge vs git rebase?
> weak
"Rebase is cleaner."
> strong
"Merge joins two branches with a merge commit and keeps the true history. Rebase replays your commits on top of another branch, giving a straight line but new commit hashes. Rule: rebase your own local feature branch to tidy it up before a PR; never rebase a branch others have already pulled, because you rewrite history under them. Many teams squash-merge PRs into main."
> gotcha | Follow-up they'll ask
How do you resolve a merge conflict? (Open the files, choose between the `<<<<<<<` / `>>>>>>>` sections, remove the markers, run the tests, `git add`, then continue the merge or rebase.)

### Unit vs integration vs end-to-end tests?
> weak
"Unit tests test units."
> strong
"Unit tests check one function in isolation and are fast and many, like TicketDesk's state-machine tests that check every legal and illegal transition. Integration tests check pieces working together, like Supertest calling the real Express app against an in-memory MongoDB. End-to-end tests drive the real UI in a browser with Playwright or Cypress; they're slow, so you keep few of them. That's the testing pyramid."
> gotcha | Follow-up they'll ask
What is mocking and when is it a bad idea? (Replacing a real dependency with a fake. Overusing it means tests pass while the real integration is broken.)

### What problem does Docker solve? Image vs container?
> weak
"Docker is a virtual machine."
> strong
"Docker packages the app with its runtime and dependencies so it runs the same on my laptop, CI and the server, which ends 'works on my machine'. An image is the read-only template built from a Dockerfile; a container is a running instance of it. Unlike a VM, containers share the host kernel, so they start in seconds and are light. docker-compose starts several containers together, like TicketDesk's mongo, backend and frontend."
> gotcha | Follow-up they'll ask
Why copy package.json and run npm install before copying the source? (Layer caching: the install layer is reused until dependencies change.)

### What is CI/CD?
> weak
"Automatic deployment."
> strong
"Continuous Integration: every push or PR runs an automated pipeline that installs, lints, tests and builds, so broken code is caught before merge. Continuous Delivery keeps main always deployable; Continuous Deployment goes further and releases every passing change automatically. With GitHub Actions, TicketDesk's pipeline would be: `npm ci`, `npm test`, build the Docker images, push to a registry, then deploy."
> gotcha | Follow-up they'll ask
How do you roll back a bad release? (Redeploy the previous image tag. Blue-green or canary releases reduce the blast radius.)

## I. System design basics

### Design a URL shortener.
> weak
"Store the long URL and give a short one."
> strong
"API: `POST /shorten` returns a code; `GET /:code` returns a 301 or 302 redirect. Generate the code by base62-encoding a unique counter or id, which avoids collisions, or by hashing with a collision check. Store code → long URL with an index on code. Reads vastly outnumber writes, so put a Redis cache in front of the database and a CDN at the edge. Add expiry, rate limiting on create, and click analytics written asynchronously through a queue."
> gotcha | Follow-up they'll ask
301 vs 302? (301 is permanent and browsers cache it, so you lose click tracking. 302 is temporary, so every click reaches you.)

### How and where would you add caching?
> weak
"Use Redis."
> strong
"Cache data that's read often and changes rarely, as close to the user as makes sense: browser and CDN for static files, then an in-memory store like Redis for hot API data, such as a dashboard summary. Cache-aside is the usual pattern: read the cache, on a miss read the DB and fill the cache with a TTL. The hard part is invalidation: delete or update the cache key when the data changes, or accept short staleness via a TTL."
> gotcha | Follow-up they'll ask
What is a cache stampede? (Many requests miss at once and all hit the DB. Fix with locking, request coalescing, or staggered TTLs.)

### Your Socket.io chat runs on one server. How do you scale it to three?
> weak
"Add more servers."
> strong
"Two problems appear. First, a user in room `ticket:42` on server A won't get messages emitted on server B, so add the Socket.io Redis adapter, which broadcasts events across all instances through Redis pub/sub. Second, Socket.io's handshake may need several requests, so the load balancer needs sticky sessions or clients forced onto WebSocket only. The REST persistence stays the same, which is why TicketDesk saves chat messages to MongoDB rather than relying on the socket alone."
> gotcha | Follow-up they'll ask
WebSocket vs polling vs Server-Sent Events? (WebSocket: two-way, persistent. SSE: server-to-client only over HTTP, simple for notifications. Polling: simplest, wasteful.)

### Vertical vs horizontal scaling? Monolith vs microservices?
> weak
"Microservices are better."
> strong
"Vertical scaling means a bigger machine: easy, but it has a ceiling and a single point of failure. Horizontal scaling means more machines behind a load balancer, which needs the app to be stateless, keeping sessions and files in shared stores. A monolith is one deployable app: simple to build, test and deploy, and right for most new products like TicketDesk. Microservices split by business domain so teams deploy and scale independently, at the cost of network calls, distributed data and much more ops work."
> gotcha | Follow-up they'll ask
What would stop TicketDesk scaling horizontally today? (Uploads are on local disk and sockets are in-memory. Move files to S3 and add the Redis adapter.)

## J. Behavioural and HR

### Tell me about yourself.
> weak
Reading out the resume from school onwards, or "I am a hard-working person."
> strong
Present, past, future in 60-90 seconds:
"I'm a final-year B.Tech student focused on full-stack development with the MERN stack. Most recently I built features in TicketDesk, a support-ticket system with role-based access, a ticket workflow, live chat and file uploads, where I implemented [your TODOs]. Before that I [one relevant project, internship or achievement]. I'm looking for a role where I can work on real production systems and grow as a backend-leaning full-stack engineer, which is why this role interests me."
> gotcha | Follow-up they'll ask
Whatever you named last. End on something you can defend for five minutes.

### Tell me about the hardest bug you fixed.
> weak
"I had a bug, I searched Google and fixed it."
> strong
Use STAR: Situation, Task, Action, Result. Example below; only tell it if you really fixed this bug, otherwise use your own.
"Situation: after changing a ticket's status, the header showed 'Assigned to undefined'. Task: find why only that screen broke. Action: I checked the network tab and saw the API returned `assignedTo` as a bare id, not a user object; I traced it to the service returning the unpopulated document. Result: I returned the populated ticket and added a test so it can't regress. What I learned: always check the actual response before blaming the UI."
> gotcha | Follow-up they'll ask
How would you stop that class of bug happening again? (Tests on response shape, a shared type or schema for the API contract.)

### Tell me about a disagreement with a teammate.
> weak
"I never have conflicts." Or blaming the teammate.
> strong
STAR again, and show you listened and used evidence, not rank:
"We disagreed on whether to store chat only in sockets or persist it. I listened to their reason, which was speed, explained mine, which was history surviving a refresh, and we agreed to try both quickly. Persisting via REST and pushing via socket solved both. We kept working well together and I learned to argue with data, not opinions."
> gotcha | Follow-up they'll ask
What if you'd been wrong? (Say so: "Then I'd have gone with their approach and said so openly.")

### What is your biggest weakness? Why should we hire you?
> weak
"I'm a perfectionist." / "Because I need a job."
> strong
Weakness: a real, non-fatal one plus what you're doing about it.
"I used to jump straight into coding without writing down the requirements, which cost me rework. Now I list acceptance criteria and edge cases first, like I did for TicketDesk's workflow transitions."
Why hire you: tie three things to the job description.
"You need someone who can work across React and Node, learns fast, and writes code others can read. I've shown all three in TicketDesk: I can walk you through code I wrote, the tests I ran, and the trade-offs I'd change."
> gotcha | Follow-up they'll ask
Where do you see yourself in five years? (Growing depth in the role: owning features end to end, then mentoring. Don't say "doing an MBA" or "running my own company".)

### The interviewer asks "Do you have any questions for me?"
> weak
"No, thank you."
> strong
Always ask one or two. Good ones:
- "What does a new engineer's first three months look like on this team?"
- "What does your code review and deployment process look like?"
- "What's the biggest technical challenge the team is working on right now?"
- "How do you measure success for someone in this role?"
Avoid salary and leave questions in a technical round.
> gotcha | Follow-up they'll ask
None. But listen to the answer and respond to it; that's part of the interview too.

## Python

### List vs tuple vs set vs dict?
> weak
"List uses square brackets, tuple uses round brackets."
> strong
"A list is ordered and mutable, good for a sequence you change. A tuple is ordered and immutable, so it's hashable and can be a dict key, like `(account_id, date)`. A set holds unique items with O(1) average membership checks, good for 'have I seen this card number?'. A dict maps keys to values with O(1) average lookup, and keeps insertion order since Python 3.7. In JavaScript terms: list ≈ array, dict ≈ object or Map, set ≈ Set."
> gotcha | Follow-up they'll ask
Why can't a list be a dict key? (It's mutable, so its hash could change after insertion.)

### Write a function: flag accounts with more than 3 transactions inside any 60-second window.
> show | Input
`txns` is a list of `(account_id, unix_timestamp)` tuples, not sorted.
> weak
Two nested loops comparing every transaction with every other one, O(n²), and no mention of sorting.
> strong
Sort by time, then keep a sliding window per account with a deque.
```
from collections import defaultdict, deque

def flag_bursts(txns, limit=3, window=60):
    recent = defaultdict(deque)
    flagged = set()
    for account, ts in sorted(txns, key=lambda t: t[1]):
        q = recent[account]
        q.append(ts)
        while ts - q[0] > window:
            q.popleft()
        if len(q) > limit:
            flagged.add(account)
    return flagged
```
"Sorting is O(n log n); each timestamp enters and leaves its deque once, so the scan is O(n). This is the same idea as the login rate limiter in my project: count events per key inside a time window."
> gotcha | Follow-up they'll ask
How would you do this for a live stream instead of a list? (Keep the window per account in Redis with a sorted set or a counter with expiry, and check on each new transaction.)

### What's wrong with this function?
> show | Code
```
def add_txn(txn, batch=[]):
    batch.append(txn)
    return batch
```
> weak
"Nothing, it appends and returns."
> strong
"The default list is created once, when the function is defined, not on each call. So every call without a `batch` argument shares the same list, and transactions leak between calls. The fix is `batch=None`, then `if batch is None: batch = []` inside the function."
> gotcha | Follow-up they'll ask
`is` vs `==`? (`is` checks it's the same object; `==` checks equal value. Use `is` only for `None`, `True`, `False`.)

### What are decorators and generators?
> weak
"Decorators use @. Generators use yield."
> strong
"A decorator is a function that takes a function and returns a wrapped version, so you can add behaviour like timing, logging, retries or an auth check without changing the original. `@app.get('/x')` in FastAPI or Flask is a decorator. It's the same idea as Express middleware. A generator uses `yield` to produce values one at a time, lazily, so you can process a huge file or a database cursor row by row without loading it all into memory, like Node streams."
> gotcha | Follow-up they'll ask
What are `*args` and `**kwargs`? (Extra positional arguments as a tuple and extra keyword arguments as a dict. Decorators use them to pass through any arguments.)

### Python is slow and has a GIL. How do you handle concurrency?
> weak
"Python can't do concurrency."
> strong
"The GIL lets only one thread run Python bytecode at a time. For I/O-bound work, like calling APIs or databases, threads or `asyncio` still help, because the GIL is released while waiting. That's the same model as Node's event loop. For CPU-bound work, like scoring a big batch of transactions, use `multiprocessing` to use several cores, or libraries like NumPy and pandas that do the heavy work in C."
> gotcha | Follow-up they'll ask
When would you pick Python over Node for a service? (Data and ML work: pandas, scikit-learn and model serving. Node for I/O-heavy APIs and real-time features.)

### Write a small REST endpoint in Python that accepts a transaction.
> weak

### Write a function that validates a card number with the Luhn check.
> show | Rule
From the rightmost digit, double every second digit; if doubling gives more than 9, subtract 9. Add everything up. The number is valid if the total is divisible by 10.
> weak
Checking only that the string has 16 digits.
> strong
```
def luhn_valid(number: str) -> bool:
    digits = [int(d) for d in number if d.isdigit()]
    total = 0
    for i, d in enumerate(reversed(digits)):
        if i % 2 == 1:
            d *= 2
            if d > 9:
                d -= 9
        total += d
    return len(digits) > 1 and total % 10 == 0

luhn_valid("7992 7398 713")   # True
```
"Luhn catches typos, like one wrong digit or two swapped neighbours. It is not a fraud check: a valid Luhn number can still be stolen or fake. Real validation also checks length and the card network's prefix."
> gotcha | Follow-up they'll ask
What's the time complexity? (O(n) in the number of digits, O(n) extra space for the list; you can do it in O(1) space by iterating the string backwards.)

### Given a list of amounts, find two that add up to a target.
> weak
Two nested loops, O(n²), without saying it's slow.
> strong
```
def two_sum(amounts, target):
    seen = {}
    for i, a in enumerate(amounts):
        if target - a in seen:
            return seen[target - a], i
        seen[a] = i
    return None
```
"One pass with a dict of amount → index: O(n) time, O(n) space. For each amount I ask 'have I already seen the amount that completes it?'. Dict lookups are O(1) on average."
> gotcha | Follow-up they'll ask
Amounts are floats like 0.1 and 0.2. Problem? (Floating-point error: `0.1 + 0.2 != 0.3`. Use integer paise or `Decimal`.)

### Explain classes in Python: __init__, self, inheritance, classmethod vs staticmethod.
> weak
"Classes are blueprints for objects."
> strong
"`__init__` sets up a new object's attributes; `self` is the object itself, passed explicitly as the first parameter, like `this` in JavaScript but never implicit. A subclass reuses and overrides behaviour and calls the parent with `super().__init__(...)`. `@classmethod` gets the class as `cls`, which suits alternative constructors like `Txn.from_dict(d)`. `@staticmethod` gets neither and is just a function grouped with the class. Dunder methods like `__repr__`, `__eq__` and `__len__` hook objects into built-in behaviour."
> gotcha | Follow-up they'll ask
What is `@dataclass`? (A decorator that writes `__init__`, `__repr__` and `__eq__` for you from type-annotated fields. Good for simple records like a transaction.)

### How does Python talk to Oracle or SQL Server safely?
> weak
`cursor.execute(f"SELECT * FROM txns WHERE account_id = '{acc}'")`
> strong
Use the driver with bind parameters, never f-strings:
```
import oracledb
conn = oracledb.connect(user=USER, password=PWD, dsn="dbhost/ORCLPDB1")
with conn.cursor() as cur:
    cur.execute("SELECT id, amount FROM txns WHERE account_id = :acc", acc=acc)
    rows = cur.fetchall()

import pyodbc
conn = pyodbc.connect(CONN_STR)
cur = conn.cursor()
cur.execute("SELECT id, amount FROM txns WHERE account_id = ?", acc)
```
