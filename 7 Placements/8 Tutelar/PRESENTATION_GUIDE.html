# pitch | 2-minute pitch | One student stands up and gives the pitch while the timer runs (press T in presenter mode). Then reveal the model script and compare.

### Give the 2-minute pitch as a backend-focused student.
> answer | Model script
"TicketDesk is an internal support ticket system. Think of a company where employees report IT problems: 'my laptop won't boot', 'I need VPN access'. Usually these go into email and get lost. TicketDesk gives every problem a ticket, an owner, and a clear status.
There are three roles. A Requester raises tickets and can only see their own. An Agent works on tickets and can only pick tickets up for themselves. An Admin can assign anyone, close tickets, and delete them.
The stack is MongoDB, Express, React and Node. Socket.io handles live chat and notifications. Every request goes through layers: route, then middleware for auth and permissions, then the controller, the service, and the Mongoose model.
We started from a starter codebase with logic removed. My part was mainly the backend. **[I finished the ticket workflow state machine, the permission rules for agents and requesters, the search, sort and pagination for the ticket list, and the dashboard aggregation.]**
The hard part was making sure the workflow can't be broken. A ticket has to go Open, Assigned, In Progress, Resolved, Closed, and it can be Reopened. You can't jump from Open straight to Closed. And only an Admin can close. So I kept it in two separate checks. The permission check answers 'is this person allowed to touch this ticket?' and returns 403. The state machine answers 'is this move legal?' and returns 400. Both are tested with Jest, including a table-driven test of every role and every transition.
I think this maps well to payments. A payment also moves through fixed states, like pending, authorized, captured, refunded, and you must never allow an illegal jump."
> proof | Files to have open
`backend/src/utils/ticketStateMachine.js`, `backend/src/utils/ticketPermissions.js`, `backend/src/middlewares/permit.js`, `backend/tests/unit/ticketStateMachine.test.js`

### Give the 2-minute pitch as a frontend-focused student.
> answer | Model script
"TicketDesk is an internal help-desk app. Employees raise IT tickets, support agents work on them, and admins manage the whole queue. There are three roles: Requester, Agent, Admin. Each sees a different version of the same screens.
It's a MERN app. The frontend is React 18 with Vite, React Router, and Axios, plus Socket.io client for live chat and live notifications.
My part was mainly the frontend. **[I built the ticket list data flow: the TicketContext that holds filters and pagination, the debounced search box, the Previous/Next pagination, the live chat input, the file upload with a progress percentage, and the notification bell dropdown.]**
One thing I care about is that components never call Axios directly. Every API call lives in a services folder, and one Axios instance adds the token automatically. When the short-lived access token expires, an Axios interceptor quietly gets a new one with the refresh token and retries the request. The user doesn't get kicked out.
The hard thing I solved was stale data. On the ticket detail page, if you click from one ticket to another quickly, the old request can finish late and overwrite the new ticket's data. **[I fixed this with an AbortController in the effect cleanup, so a stale request never updates the screen.]** Chat has the same problem, and there I used a cancelled flag and always leave the Socket.io room when the component unmounts.
On the ticket list, filters live in a React Context, so the filter bar, the list, and the pagination share state without passing props through every level. Changing a filter resets the page to 1 and refetches."
> proof | Files to have open
`frontend/src/context/TicketContext.jsx`, `frontend/src/services/api.js:44-69`, `frontend/src/pages/TicketDetail.jsx:34-80`, `frontend/src/components/ChatBox.jsx:37-68`

### Give the 2-minute pitch as a full stack student.
> answer | Model script
"TicketDesk is an internal support ticket system. Requesters raise tickets, Agents resolve them, and Admins manage everything. Every ticket moves through a fixed workflow, and every action is recorded in an activity log that users can see.
It's MERN: React and Vite on the front, Node and Express on the back, MongoDB with Mongoose, plus Socket.io for live chat and notifications. There's Swagger documentation at /api-docs, a Postman collection, and Jest tests.
We started from a starter codebase with about 30 pieces removed. **[I completed both sides: on the backend the permission rules, the workflow transitions, and the chat-to-notification bridge; on the frontend the chat input, the upload flow, and the ticket list data fetching.]**
The hardest piece was live chat, because it touches everything. When a user opens a ticket, the page loads the chat history over REST and then joins a Socket.io room for that ticket. The server checks the JWT during the socket handshake. It also checks the same permission rules as the REST API before letting anyone join a room, so a requester can't listen to someone else's ticket. Every message is saved to MongoDB first and then pushed to the room. So if you refresh, nothing is lost.
**[Then I added the offline case: if the other person isn't in the room, the server creates a notification for them instead. That notification also goes out live to their personal socket room, so the bell updates without polling.]**
If I did it again, I'd add database transactions around status changes, because right now the ticket update and the audit log are two separate writes."
> proof | Files to have open
`backend/src/sockets/index.js:17-41`, `backend/src/sockets/chatSocket.js:15-65`, `backend/src/services/chatService.js:16-73`, `backend/src/services/notificationService.js:13-37`

### What are the four pitch rules?
> answer | Rules
1. Say "we started from a starter codebase" once, early. Then talk about your work with confidence.
2. Name one hard thing, not five.
3. End with a hook the interviewer will want to ask about, such as transactions, payment states, or security.
4. Never say "fully secure", "production-ready" or "scalable". The weaknesses section shows why an interviewer can break those claims.

# traces | Request traces | A student traces the flow out loud, then draws it on the board. Reveal the steps, then the diagram.

### Before any route runs, what global middleware does every request pass through, and in what order?
> answer | Order
```
helmet → cors → compression → express.json → mongoSanitize → morgan logger
       → /api-docs (Swagger)  or  /api routes → notFound → errorHandler
```
> proof | Proof
`backend/src/app.js:22-44`

### Trace LOGIN from the React form to the database and back. Name every file, middleware and status code.
> answer | Step by step
1. `frontend/src/pages/Login.jsx:18-30`: `handleSubmit` calls `login(email, password)` from `useAuth()`.
2. `frontend/src/context/AuthContext.jsx:60-66`: `login` calls the service.
3. `frontend/src/services/authService.js:3-6`: `api.post('/auth/login', ...)`.
4. `frontend/src/services/api.js:19-25`: the interceptor adds Bearer only if a token exists. Login is excluded from the auto-refresh retry (`api.js:49`).
5. `POST /api/auth/login` → `routes/index.js:13` → `routes/authRoutes.js:44`: `authRateLimiter → loginValidator → validate → authController.login`. The rate limiter returns 429 after 5 tries per 15 min. The validator returns 400 with field errors.
6. `controllers/authController.js:6-10` calls the service and replies with `success(...)`.
7. `services/authService.js:47-84`: `findOne` with `+passwordHash` (hidden by default, `User.js:17`). Unknown user → 401 with the same message as a wrong password. Locked → 423. `bcrypt.compare`; wrong → increment attempts, lock on the 5th, 401. Success → reset counters, `issueTokenPair` (`:29-37`): 15-min access JWT + 7-day refresh JWT (`utils/jwt.js:13-27`). Only a SHA-256 hash of the refresh token is stored.
8. Response 200 `{ success, message, data: { accessToken, refreshToken, user } }` (`utils/response.js:7-13`).
9. `AuthContext.jsx:62-64` saves tokens to localStorage (`tokenStorage.js:23-29`), sets `user`, calls `connectSocket()`. `Login.jsx:24` navigates to `/tickets`.
> diagram | Whiteboard diagram
```
 Login.jsx ──login()──► AuthContext ──► authService.login ──► axios api
                                                                │
                                         POST /api/auth/login   ▼
 ┌─────────────────────────── Express ──────────────────────────────┐
 │ rateLimiter(429) → validator+validate(400) → authController     │

## C. Authentication and security

### Explain your login and token design.
> weak
"We use JWT and store it in local storage."
> strong
"Login returns two JWTs. The access token lasts 15 minutes, carries the user id and role, and is sent as a Bearer header. The refresh token lasts 7 days, is signed with a different secret, and only carries the user id and a random `jti`. The server stores only a SHA-256 hash of the refresh token. Every refresh rotates it, so the old one stops working. If an old token is replayed, the server wipes the stored hash and the user must log in again."

### Why hash the refresh token with SHA-256 and not bcrypt?
> weak
"SHA-256 is faster."
> strong
"bcrypt only uses the first 72 bytes of its input. Two JWTs with the same header and claims can share their first 72 bytes, so bcrypt would treat them as the same token and rotation would break. bcrypt is slow on purpose to protect weak human passwords. A refresh token is already long and random, so a fast hash is enough. Passwords still use bcrypt."
> proof

### How do you stop brute-force login attacks?
> weak
"We have a rate limiter."
> strong
"There are two separate defences. An IP-based rate limiter on `/auth/login` allows 5 tries per 15 minutes per IP and returns 429. And there's an account lockout: 5 wrong passwords on the same account lock it for 15 minutes and return 423, whichever IPs the attempts came from. The rate limiter stops one IP attacking many accounts. The lockout stops many IPs attacking one account. That's the same idea fraud teams use against credential stuffing."

# sql | SQL redesign | The job asks for Oracle / MS SQL Server. These cards turn TicketDesk's real Mongoose schemas into tables and queries.

## Design

### How would you map TicketDesk's 7 Mongoose models to relational tables?
> answer | Mapping
| Mongoose (source) | Relational design | Why |
|---|---|---|
| User (`models/User.js`) | `users` table | Same fields. role becomes a CHECK constraint. |
| Category (`models/Category.js`) | `categories` table | Same. |
| Ticket (`models/Ticket.js`) | `tickets` table | category, createdBy, assignedTo become foreign keys. |
| Ticket.attachments[] (embedded, `Ticket.js:4-14`) | separate `ticket_attachments` table | SQL has no arrays of objects. One row per attachment. |
| Ticket.priorityWeight + pre-save hook (`Ticket.js:21-43`) | computed column | The DB keeps it in sync, so no hook. |
| Comment, ChatMessage, ActivityLog, Notification | one table each | Already separate collections with refs. |
| ActivityLog.metadata (Mixed, `ActivityLog.js:24`) | JSON text column | Shape differs per action. |
| ObjectId | BIGINT identity | Or UNIQUEIDENTIFIER / RAW(16) for UUIDs. |
| enums (status, priority, role, type, action) | CHECK (col IN (...)) | Or a small lookup table. |

### Write the CREATE TABLE statements in SQL Server.
> answer | SQL Server DDL
```sql
CREATE TABLE users (
    user_id               BIGINT IDENTITY(1,1) PRIMARY KEY,
    name                  NVARCHAR(100)  NOT NULL,
    email                 NVARCHAR(255)  NOT NULL,
    password_hash         NVARCHAR(100)  NOT NULL,          -- bcrypt hash, never the password
    role                  NVARCHAR(20)   NOT NULL DEFAULT 'Requester'
                          CHECK (role IN ('Admin','Agent','Requester')),
    refresh_token_hash    CHAR(64)       NULL,              -- SHA-256 hex
    failed_login_attempts INT            NOT NULL DEFAULT 0,
    lock_until            DATETIME2      NULL,
    created_at            DATETIME2      NOT NULL DEFAULT SYSUTCDATETIME(),
    updated_at            DATETIME2      NOT NULL DEFAULT SYSUTCDATETIME(),
    CONSTRAINT uq_users_email UNIQUE (email)  -- default collation is case-insensitive
);

CREATE TABLE categories (
    category_id      INT IDENTITY(1,1) PRIMARY KEY,
    name             NVARCHAR(100) NOT NULL UNIQUE,
    default_priority NVARCHAR(10)  NOT NULL DEFAULT 'Medium'
                     CHECK (default_priority IN ('Low','Medium','High'))
);

CREATE TABLE tickets (
    ticket_id       BIGINT IDENTITY(1,1) PRIMARY KEY,
    title           NVARCHAR(200)  NOT NULL,
    description     NVARCHAR(MAX)  NOT NULL,
    status          NVARCHAR(20)   NOT NULL DEFAULT 'Open'
                    CHECK (status IN ('Open','Assigned','InProgress','Resolved','Closed','Reopened')),
    priority        NVARCHAR(10)   NOT NULL DEFAULT 'Medium'
                    CHECK (priority IN ('Low','Medium','High')),
    priority_weight AS (CASE priority WHEN 'Low' THEN 1 WHEN 'Medium' THEN 2 WHEN 'High' THEN 3 END) PERSISTED,
    category_id     INT            NOT NULL REFERENCES categories(category_id),
    created_by      BIGINT         NOT NULL REFERENCES users(user_id),
    assigned_to     BIGINT         NULL     REFERENCES users(user_id),
    request_id      NVARCHAR(64)   NULL,
    created_at      DATETIME2      NOT NULL DEFAULT SYSUTCDATETIME(),
    updated_at      DATETIME2      NOT NULL DEFAULT SYSUTCDATETIME()
);
CREATE INDEX ix_tickets_status_assigned ON tickets (status, assigned_to);
CREATE INDEX ix_tickets_created_by     ON tickets (created_by);

CREATE TABLE ticket_attachments (
    attachment_id BIGINT IDENTITY(1,1) PRIMARY KEY,
    ticket_id     BIGINT        NOT NULL REFERENCES tickets(ticket_id) ON DELETE CASCADE,
    filename      NVARCHAR(255) NOT NULL,
    mime_type     NVARCHAR(100) NOT NULL,
    size_bytes    INT           NOT NULL CHECK (size_bytes > 0),
    uploaded_by   BIGINT        NOT NULL REFERENCES users(user_id),
    uploaded_at   DATETIME2     NOT NULL DEFAULT SYSUTCDATETIME()
);

CREATE TABLE comments (
    comment_id BIGINT IDENTITY(1,1) PRIMARY KEY,
    ticket_id  BIGINT        NOT NULL REFERENCES tickets(ticket_id) ON DELETE CASCADE,
    author_id  BIGINT        NOT NULL REFERENCES users(user_id),
    message    NVARCHAR(MAX) NOT NULL,
    created_at DATETIME2     NOT NULL DEFAULT SYSUTCDATETIME()
);
CREATE INDEX ix_comments_ticket ON comments (ticket_id, created_at);

CREATE TABLE chat_messages (
    chat_message_id BIGINT IDENTITY(1,1) PRIMARY KEY,
    ticket_id       BIGINT         NOT NULL REFERENCES tickets(ticket_id) ON DELETE CASCADE,
    sender_id       BIGINT         NOT NULL REFERENCES users(user_id),
    message         NVARCHAR(2000) NOT NULL,
    created_at      DATETIME2      NOT NULL DEFAULT SYSUTCDATETIME()
);
CREATE INDEX ix_chat_ticket ON chat_messages (ticket_id, created_at);

CREATE TABLE activity_logs (
    activity_id  BIGINT IDENTITY(1,1) PRIMARY KEY,
    ticket_id    BIGINT        NOT NULL REFERENCES tickets(ticket_id) ON DELETE CASCADE,
    action       NVARCHAR(30)  NOT NULL
                 CHECK (action IN ('ticket_created','status_changed','assigned',
                                   'commented','attachment_added','chat_message_sent')),
    performed_by BIGINT        NOT NULL REFERENCES users(user_id),
    metadata     NVARCHAR(MAX) NULL CHECK (metadata IS NULL OR ISJSON(metadata) = 1),
    performed_at DATETIME2     NOT NULL DEFAULT SYSUTCDATETIME()
);
CREATE INDEX ix_activity_ticket ON activity_logs (ticket_id, performed_at);

CREATE TABLE notifications (
    notification_id BIGINT IDENTITY(1,1) PRIMARY KEY,
    recipient_id    BIGINT        NOT NULL REFERENCES users(user_id),
    type            NVARCHAR(30)  NOT NULL
                    CHECK (type IN ('ticket_assigned','status_changed','new_comment','new_chat_message')),
    ticket_id       BIGINT        NOT NULL REFERENCES tickets(ticket_id) ON DELETE CASCADE,
    message         NVARCHAR(500) NOT NULL,
    is_read         BIT           NOT NULL DEFAULT 0,
    created_at      DATETIME2     NOT NULL DEFAULT SYSUTCDATETIME()
);
CREATE INDEX ix_notif_recipient ON notifications (recipient_id, is_read, created_at DESC);
```
> note | Talking points
- `ON DELETE CASCADE` from tickets to child tables fixes a real Mongo bug: deleting a ticket there leaves comments, chat, activity and notifications as orphans (`ticketService.js:138-144`).
- Foreign keys to `users` have no cascade on purpose. SQL Server refuses "multiple cascade paths", and deleting a user shouldn't wipe audit history.
- `assigned_to` is nullable, so ticket list queries need a LEFT JOIN for the agent name.

### Write the users and tickets tables again in Oracle. What changes?
> answer | Oracle DDL
```sql
CREATE TABLE users (
    user_id               NUMBER(19) GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    name                  VARCHAR2(100 CHAR)  NOT NULL,
    email                 VARCHAR2(255 CHAR)  NOT NULL,
    password_hash         VARCHAR2(100 CHAR)  NOT NULL,
    role                  VARCHAR2(20 CHAR)   DEFAULT 'Requester' NOT NULL
                          CHECK (role IN ('Admin','Agent','Requester')),
    refresh_token_hash    CHAR(64)            NULL,
    failed_login_attempts NUMBER(10)          DEFAULT 0 NOT NULL,
    lock_until            TIMESTAMP           NULL,
    created_at            TIMESTAMP           DEFAULT SYSTIMESTAMP NOT NULL,
    updated_at            TIMESTAMP           DEFAULT SYSTIMESTAMP NOT NULL
);
-- Oracle comparisons are case-sensitive, so make email unique case-insensitively:
CREATE UNIQUE INDEX uq_users_email ON users (LOWER(email));

CREATE TABLE tickets (
    ticket_id       NUMBER(19) GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    title           VARCHAR2(200 CHAR) NOT NULL,
    description     CLOB               NOT NULL,
    status          VARCHAR2(20 CHAR)  DEFAULT 'Open' NOT NULL
                    CHECK (status IN ('Open','Assigned','InProgress','Resolved','Closed','Reopened')),
    priority        VARCHAR2(10 CHAR)  DEFAULT 'Medium' NOT NULL
                    CHECK (priority IN ('Low','Medium','High')),
    priority_weight NUMBER(1) GENERATED ALWAYS AS
                    (CASE priority WHEN 'Low' THEN 1 WHEN 'Medium' THEN 2 WHEN 'High' THEN 3 END) VIRTUAL,
    category_id     NUMBER(10) NOT NULL REFERENCES categories(category_id),
    created_by      NUMBER(19) NOT NULL REFERENCES users(user_id),
    assigned_to     NUMBER(19)          REFERENCES users(user_id),
    request_id      VARCHAR2(64 CHAR),
    created_at      TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
    updated_at      TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL
);
CREATE INDEX ix_tickets_status_assigned ON tickets (status, assigned_to);
```

### Name as many Oracle vs SQL Server syntax differences as you can.
> answer | Cheat sheet
| Topic | SQL Server | Oracle |
|---|---|---|
| Auto-increment | `IDENTITY(1,1)` | `GENERATED AS IDENTITY` (12c+), or a SEQUENCE |
| Text | `NVARCHAR(n)`, `NVARCHAR(MAX)` | `VARCHAR2(n CHAR)`, `CLOB` |
| Boolean | `BIT` | `NUMBER(1)` + CHECK (BOOLEAN only in 23ai) |
| Date-time | `DATETIME2`, `SYSUTCDATETIME()`, `GETDATE()` | `TIMESTAMP`, `SYSTIMESTAMP`, `SYSDATE` |
| Computed column | `col AS (expr) PERSISTED` | `col GENERATED ALWAYS AS (expr) VIRTUAL` |
| First N rows | `TOP 10` or `OFFSET … FETCH` (needs ORDER BY) | `FETCH FIRST 10 ROWS ONLY` or `OFFSET … FETCH`; old code uses `ROWNUM` |
| String concat | `+` or `CONCAT()` | `\|\|` or `CONCAT()` (2 args only) |
| Null replace | `ISNULL(a, b)` / `COALESCE` | `NVL(a, b)` / `COALESCE` |
| Length | `LEN()` | `LENGTH()` |
| Empty string | `''` is a value | `''` is NULL |
| Case sensitivity | Depends on collation (default insensitive) | Sensitive; use `UPPER()` / `LOWER()` |
| Date difference | `DATEDIFF(MINUTE, a, b)` | `b - a` (DATE gives days; TIMESTAMP gives INTERVAL) |
| JSON | `ISJSON`, `JSON_VALUE` | `IS JSON`, `JSON_VALUE` |
| Table alias | `FROM tickets AS t` or `FROM tickets t` | `FROM tickets t` only |
| Batch separator | `GO` (client command) | `/` in SQL*Plus |
| Transactions | `BEGIN TRANSACTION … COMMIT` | starts automatically; end with `COMMIT` / `ROLLBACK` |

## Queries

### Query 1. Write the ticket list page: Open tickets with category, requester and agent names, page 2 of 10.
> answer | SQL Server
```sql
SELECT t.ticket_id, t.title, t.status, t.priority,
       c.name   AS category,
       req.name AS created_by,
       ag.name  AS assigned_to,      -- NULL when unassigned
       t.created_at
FROM tickets t
JOIN categories c   ON c.category_id = t.category_id
JOIN users req      ON req.user_id   = t.created_by
LEFT JOIN users ag  ON ag.user_id    = t.assigned_to
WHERE t.status = 'Open'
ORDER BY t.created_at DESC
OFFSET 10 ROWS FETCH NEXT 10 ROWS ONLY;     -- skip = (page-1)*limit
```
> gotcha | Why LEFT JOIN? / Oracle
An INNER JOIN on `assigned_to` would silently drop every unassigned ticket. This is what `listTickets` + `populate` does (`ticketService.js:45-67`). Oracle: identical (OFFSET/FETCH works from 12c).

### Query 2. Dashboard: how many tickets are in each status?
> answer | SQL
```sql
SELECT status, COUNT(*) AS ticket_count
FROM tickets
GROUP BY status
ORDER BY ticket_count DESC;
```
> gotcha | Link to the code
Same as the `$group` in `dashboardService.js:29-36`. Identical in Oracle.

### Query 3. One requester's tickets counted by priority, in severity order (High first), not alphabetical.
> answer | SQL Server
```sql
SELECT priority, COUNT(*) AS ticket_count
FROM tickets
WHERE created_by = @requesterId
GROUP BY priority, priority_weight
ORDER BY priority_weight DESC;
```
> gotcha | Oracle
Use a bind variable `:requesterId` instead of `@requesterId`.

### Query 4. Agent workload: every agent with their number of active tickets, including agents with zero.
> answer | SQL
```sql
SELECT u.user_id, u.name, COUNT(t.ticket_id) AS active_tickets
FROM users u
LEFT JOIN tickets t
       ON t.assigned_to = u.user_id
      AND t.status IN ('Assigned','InProgress','Reopened')   -- filter in ON, not WHERE
WHERE u.role = 'Agent'
GROUP BY u.user_id, u.name
ORDER BY active_tickets DESC;
```
> gotcha | Two traps
Moving the status filter into WHERE turns the LEFT JOIN back into an INNER JOIN, and zero-ticket agents disappear. And use `COUNT(t.ticket_id)`, not `COUNT(*)`, or a zero-ticket agent shows 1. Identical in Oracle.

### Query 5. Open tickets that nobody has commented on yet.
> answer | SQL
```sql
SELECT t.ticket_id, t.title, t.created_at
FROM tickets t
WHERE t.status NOT IN ('Resolved','Closed')
  AND NOT EXISTS (SELECT 1 FROM comments c WHERE c.ticket_id = t.ticket_id)
ORDER BY t.created_at;
```
> gotcha | Why NOT EXISTS over NOT IN?
If the subquery returns any NULL, NOT IN matches nothing. NOT EXISTS is NULL-safe. Identical in Oracle.

### Query 6. Agents carrying more tickets than the average agent.
> answer | SQL Server
```sql
SELECT u.name, COUNT(*) AS assigned_count
FROM tickets t
JOIN users u ON u.user_id = t.assigned_to
GROUP BY u.name
HAVING COUNT(*) > (
    SELECT AVG(CAST(cnt AS DECIMAL(10,2)))
    FROM (SELECT COUNT(*) AS cnt
          FROM tickets
          WHERE assigned_to IS NOT NULL
          GROUP BY assigned_to) per_agent
);
```
> gotcha | Gotchas
SQL Server: AVG of an INT is an INT and truncates, hence the CAST. Oracle: drop the CAST (its AVG returns a decimal), and never write `AS per_agent` for a table alias.

### Query 7. The notification bell: a user's latest 10, unread first. Then: users with more than 5 unread.
> answer | SQL Server
```sql
SELECT TOP 10 n.notification_id, n.message, n.is_read, n.created_at, t.title
FROM notifications n
JOIN tickets t ON t.ticket_id = n.ticket_id
WHERE n.recipient_id = @userId
ORDER BY n.is_read ASC, n.created_at DESC;

SELECT recipient_id, COUNT(*) AS unread
FROM notifications
WHERE is_read = 0
GROUP BY recipient_id
HAVING COUNT(*) > 5;
```
> gotcha | Oracle / link to code
Oracle: drop `TOP 10`, add `FETCH FIRST 10 ROWS ONLY` at the end, use `:userId`. Mirrors `notificationService.listForUser` (`:39-58`).

### Query 8. Average hours to resolve a ticket, per category, using the activity log.
> answer | SQL Server
```sql
SELECT c.name AS category,
       COUNT(*) AS resolved_count,
       AVG(DATEDIFF(MINUTE, t.created_at, a.performed_at) / 60.0) AS avg_hours_to_resolve
FROM activity_logs a
JOIN tickets t    ON t.ticket_id   = a.ticket_id
JOIN categories c ON c.category_id = t.category_id
WHERE a.action = 'status_changed'
  AND JSON_VALUE(a.metadata, '$.to') = 'Resolved'
GROUP BY c.name
ORDER BY avg_hours_to_resolve DESC;
```
> gotcha | Oracle / fintech link
Oracle: replace the DATEDIFF line with `AVG((CAST(a.performed_at AS DATE) - CAST(t.created_at AS DATE)) * 24)`. DATE minus DATE gives days. `JSON_VALUE` works the same. The Mongo code writes `{ from, to }` into metadata on every status change (`ticketService.js:114-117`). This is an SLA query, the same shape as "average time from payment initiated to settled".

### Bonus. Show the latest comment on each ticket.
> answer | SQL (window function)
```sql
SELECT ticket_id, author_id, message, created_at
FROM (
    SELECT c.*, ROW_NUMBER() OVER (PARTITION BY ticket_id ORDER BY created_at DESC) AS rn
    FROM comments c
) x
WHERE rn = 1;
```
> gotcha | Oracle
Identical (`c.*` must be qualified, as it is here).

## Transactions

### The Node code changes a status in three separate writes. Write it as one SQL transaction.
> answer | SQL Server
```sql
BEGIN TRANSACTION;
    UPDATE tickets SET status = 'Resolved', updated_at = SYSUTCDATETIME()
    WHERE ticket_id = @id AND status = 'InProgress';          -- guard: only from the legal state
    IF @@ROWCOUNT = 0 BEGIN ROLLBACK; THROW 50000, 'Illegal transition', 1; END
    INSERT INTO activity_logs (ticket_id, action, performed_by, metadata)
    VALUES (@id, 'status_changed', @userId, N'{"from":"InProgress","to":"Resolved"}');
    INSERT INTO notifications (recipient_id, type, ticket_id, message)
    SELECT created_by, 'status_changed', ticket_id, N'Ticket moved to Resolved'
    FROM tickets WHERE ticket_id = @id;
COMMIT;
```
> gotcha | Oracle / talking point
Oracle has no BEGIN TRANSACTION: a transaction starts automatically; end it with COMMIT or ROLLBACK. Use `SQL%ROWCOUNT` in PL/SQL and `RAISE_APPLICATION_ERROR(-20001, 'Illegal transition')`.
Say: "The `WHERE status = 'InProgress'` guard does in one atomic statement what my Node code does in two steps (read, check the state machine, then save). Two people clicking at the same moment can't both win." Proof of the gap: `ticketService.js:107-136`.

# docker | Docker | The Docker files already exist in the repo. Students explain the real files line by line.

### Before explaining Docker in an interview, what must you admit about this project?
> answer | Answer
The repo already contains `backend/Dockerfile`, `frontend/Dockerfile` and `docker-compose.yml`. They came with the starter codebase; students did not write them. The good news is that you can explain real files.
"Docker was set up in the starter project, not by me. But I've gone through it line by line, and I can run the whole stack with one command. Let me walk you through it."

### Explain the backend Dockerfile line by line.
> show | backend/Dockerfile
```dockerfile
# --- deps stage: install production dependencies only ---
FROM node:18-alpine AS deps
WORKDIR /app
COPY package*.json ./
RUN npm ci --omit=dev

# --- runtime stage ---
FROM node:18-alpine AS runtime
WORKDIR /app
ENV NODE_ENV=production

COPY --from=deps /app/node_modules ./node_modules
COPY . .

RUN mkdir -p uploads logs && \
    addgroup -S ticketdesk && adduser -S ticketdesk -G ticketdesk && \
    chown -R ticketdesk:ticketdesk /app

USER ticketdesk

EXPOSE 5000

CMD ["node", "server.js"]
```
> answer | Spoken explanation
- `FROM node:18-alpine AS deps`: start from a small Linux image with Node 18. Alpine keeps it small. Naming the stage makes it a multi-stage build.
- `WORKDIR /app`: every command after this runs inside /app.
- `COPY package*.json ./` then `RUN npm ci --omit=dev`: copy only the package files and install. Docker caches each step, so if only code changes, this slow install is reused. `npm ci` installs exactly the lock file; `--omit=dev` skips Jest and nodemon.
- `FROM node:18-alpine AS runtime`: a fresh, clean image for the final container.
- `ENV NODE_ENV=production`: switches to `config/prod.js`, hides stack traces from clients, and writes HTTP logs to a file (`config/index.js:9`, `errorHandler.js:24`, `httpLogger.js:13-19`).
- `COPY --from=deps …` then `COPY . .`: take the installed packages from stage one, then copy the source.
- `RUN mkdir … adduser …`: create the folders the app writes to and a non-root user that owns them. If someone breaks into the app, they're not root.
- `USER ticketdesk`: run as that user.
- `EXPOSE 5000`: documents the port. REST and Socket.io share it, because Socket.io attaches to the same HTTP server (`server.js:11-12`).
- `CMD ["node", "server.js"]`: node directly, not `npm start`, so stop signals reach Node and the graceful shutdown in server.js runs.

### Explain the frontend Dockerfile. Why are the API URLs build ARGs?
> show | frontend/Dockerfile
```dockerfile
# --- build stage ---
FROM node:18-alpine AS build
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
ARG VITE_API_BASE_URL=http://localhost:5000/api
ARG VITE_SOCKET_URL=http://localhost:5000
ENV VITE_API_BASE_URL=$VITE_API_BASE_URL
ENV VITE_SOCKET_URL=$VITE_SOCKET_URL
RUN npm run build

# --- runtime stage: serve the static build ---
FROM node:18-alpine AS runtime
WORKDIR /app
RUN npm install -g serve@14
COPY --from=build /app/dist ./dist
EXPOSE 4173
CMD ["serve", "-s", "dist", "-l", "4173"]
```
> answer | Spoken explanation
- The first stage installs everything, including dev dependencies, because Vite is a build tool, and runs `npm run build`, which turns React into plain HTML, JS and CSS in dist/.
- Vite bakes `VITE_*` variables into the JavaScript at build time, so the URL must be known when the image is built, not when it starts. The browser runs on the user's machine, so the URL is localhost:5000, not the Docker service name.
- The second stage has only the built files plus `serve`, a tiny static server. `-s` is single-page app mode: unknown paths return index.html, so React Router can handle /tickets/123 on refresh.

### Explain docker-compose.yml. Why does the backend use "mongo" as the hostname?
> show | docker-compose.yml (shortened)
```yaml
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s

  backend:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ticketdesk
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4173}
    ports:
      - '5000:5000'
    volumes:
      - uploads-data:/app/uploads
      - backend-logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    depends_on:
      - backend
    ports:
      - '4173:4173'

volumes:
  mongo-data:
  uploads-data:
  backend-logs:
```
> answer | Spoken explanation
- Compose runs three containers on one private network: database, API, frontend.
- mongo: the official MongoDB 7 image. The named volume `mongo-data` keeps data when the container is deleted. The healthcheck pings the database every 10 seconds.
- backend: `depends_on … service_healthy` means the API starts only once Mongo actually answers. That matters because `connectDB` exits the process if it can't connect (`config/db.js:11-15`).
- `MONGO_URI: mongodb://mongo:27017`: inside the Docker network the hostname is the service name, not localhost.
- `${JWT_SECRET:-change-me-in-prod}`: take the value from the shell or a .env file, otherwise the default. Never rely on the default for real.
- Two more named volumes keep uploads and logs across restarts.
- Run it: `docker-compose up --build`, then `docker-compose exec backend npm run seed`. App on localhost:4173, API on localhost:5000, Swagger at localhost:5000/api-docs.

### What would you improve in this Docker setup? Name at least three things.
> answer | Improvements
1. No `.dockerignore` exists, so `COPY . .` copies the local `.env`, `node_modules`, `logs/` and uploaded files into the image. The local node_modules even overwrites the clean one from the deps stage.
