> gotcha | Follow-up they'll ask
Why use `with`? (It's a context manager: it closes the cursor even if an exception is raised, like `finally`.)

### Shallow vs deep copy in Python, and what does `b = a` do?
> weak
"`b = a` copies the list."
> strong
"`b = a` copies nothing: both names point to the same list, so changing `b` changes `a`. `a.copy()`, `list(a)` or `a[:]` make a shallow copy: a new outer list, but nested objects are shared. `copy.deepcopy(a)` copies everything recursively. Ints, strings and tuples are immutable, so sharing them is harmless."
> gotcha | Follow-up they'll ask
What prints? `a = [[0]] * 3; a[0][0] = 1; print(a)` (`[[1], [1], [1]]`: three references to one inner list. Use `[[0] for _ in range(3)]`.)

## Node.js for this role

### How does a Node API connect to SQL Server or Oracle safely?
> weak
"Build the SQL string with the user input and run it."
> strong
"Use the official driver: `mssql` for SQL Server and `oracledb` for Oracle. Create one connection pool at startup and reuse it, because opening a connection per request is slow. Always use bind parameters, never string concatenation, which prevents SQL injection."
```
// SQL Server (mssql)
const result = await pool.request()
  .input('id', sql.Int, ticketId)
  .query('SELECT * FROM tickets WHERE id = @id');

// Oracle (oracledb)
const result = await conn.execute(
  'SELECT * FROM tickets WHERE id = :id', { id: ticketId });
```
"In TicketDesk the Mongoose model plays that role; with SQL I'd keep the same layering and put these calls in a repository or service layer."
> gotcha | Follow-up they'll ask
What happens if you forget to release a pooled connection? (The pool runs out and every request hangs. Release it in `finally`.)

### A Node API call to the database is slow and blocks other users. What do you check?
> weak
"Add more RAM."
> strong
"First, is it really blocking or just slow? Node doesn't block on a DB call that is awaited. If everything stalls, something CPU-heavy or synchronous is on the event loop, like `fs.readFileSync`, a huge `JSON.parse`, or a tight loop. If it's just slow, I time the query, check the execution plan for a missing index, check the pool isn't exhausted, and add pagination so I'm not fetching thousands of rows. I'd log response times with Morgan, as TicketDesk does, to find which endpoint is slow."
> gotcha | Follow-up they'll ask
How do you run a CPU-heavy job without blocking? (A worker thread, a separate service, or a job queue like BullMQ.)

### Why is 0.1 + 0.2 a problem for a payments backend, and how do you store money?
> weak
"Round it with toFixed(2)."
> strong
"JavaScript and Python numbers are binary floating point, so `0.1 + 0.2` is `0.30000000000000004`. Add up millions of transactions and the cents drift. Store money as an integer in the smallest unit, like paise (₹10.50 is `1050`), or as `DECIMAL(18,2)` / `NUMBER(18,2)` in SQL Server or Oracle. In code use integers, `BigInt`, a decimal library like decimal.js, or Python's `Decimal`. Format to rupees only when displaying."
> gotcha | Follow-up they'll ask
Which currency value should be stored with the amount? (The ISO code, like `INR` or `USD`. An amount without a currency is meaningless.)

### Your Node service calls an external fraud-scoring API. What can go wrong and how do you handle it?
> weak
"await axios.post(url, data)."
> strong
"It can be slow, down, or return errors. Set a timeout, like `axios.post(url, body, { timeout: 2000 })`, so one slow dependency doesn't tie up my requests. Retry only safe or idempotent calls, with exponential backoff and a limit. Add a circuit breaker (for example `opossum`) so after repeated failures I stop calling for a while and use a fallback, such as sending the transaction to manual review instead of auto-approving. Log every failure with a request id."
> gotcha | Follow-up they'll ask
Fail open or fail closed when the fraud service is down? (A business decision: fail closed blocks real customers; fail open lets fraud through. Often: approve small amounts, hold large ones for review.)

### dependencies vs devDependencies, package-lock.json, npm install vs npm ci?
> weak
"They're all for installing packages."
> strong
"`dependencies` are needed at runtime, like express and mongoose. `devDependencies` are only for development and tests, like jest and nodemon, and are skipped with `npm ci --omit=dev` in production images. `package-lock.json` records the exact version of every package in the tree, so everyone installs the same thing; commit it. `npm install` may update the lock file; `npm ci` installs exactly from the lock, fails if it doesn't match, and is what CI and Docker should use."
> gotcha | Follow-up they'll ask
What does `^4.18.0` mean? (Any 4.x.x version from 4.18.0 up, but not 5.0.0. `~` allows patch updates only.)

### How do you handle a crash and shut a Node server down cleanly?
> weak
"Wrap everything in try/catch."
> strong
"Expected errors go through the central error handler. For the unexpected, listen for `unhandledRejection` and `uncaughtException`, log them, and exit: the process may be in a broken state, and PM2, systemd or Docker restarts it. On deploy, the platform sends `SIGTERM`; I'd stop accepting new requests with `server.close()`, let in-flight ones finish, close the DB pool, then exit."
```
process.on('SIGTERM', () => {
  server.close(async () => {
    await pool.close();
    process.exit(0);
  });
});
```
> gotcha | Follow-up they'll ask
Why not keep running after an uncaughtException? (State such as open transactions or half-written data may be corrupt. Crash fast and restart clean.)

### What should and shouldn't go into application logs in a payments system?
> weak
"Log everything for debugging."
> strong
"Log enough to debug and audit: timestamp, level, request id, route, user or client id, status and duration, and the error with stack trace on the server side. Never log passwords, tokens, API keys, full card numbers, CVV or OTPs; mask what's needed, like the last four card digits. Use structured JSON logs so they can be searched, as TicketDesk does with Winston, and keep operational logs separate from the business audit trail."
> gotcha | Follow-up they'll ask
What is a correlation or request id for? (One id passed through every service and log line for a request, so you can trace it end to end.)

## Oracle Database

### Oracle basics: how is Oracle SQL different from what you've seen?
> weak
"It's the same as MySQL."
> strong
"Mostly standard SQL, with some Oracle habits: `VARCHAR2` instead of `VARCHAR`; `NUMBER` for numerics; `SYSDATE` / `SYSTIMESTAMP` for the current time; `NVL(x, 0)` for null replacement (`COALESCE` also works); `||` for string concatenation; `SELECT 1 FROM DUAL` when you need a dummy table. A gotcha: Oracle treats an empty string as NULL. Auto-increment ids use a sequence, or `GENERATED AS IDENTITY` since 12c."
> gotcha | Follow-up they'll ask
Page 2 of 10 rows in Oracle? (12c and later: `ORDER BY created_at DESC OFFSET 10 ROWS FETCH NEXT 10 ROWS ONLY`. Older code uses `ROWNUM` in a nested subquery.)

### What is PL/SQL? Write a simple stored procedure.
> weak
"It's Oracle's SQL."
> strong
"PL/SQL is Oracle's procedural extension: variables, IF, loops and exception handling, around SQL, running inside the database. It's used for stored procedures, functions, triggers and packages, often for business rules close to the data."
```
CREATE OR REPLACE PROCEDURE close_ticket (p_ticket_id IN NUMBER, p_user_id IN NUMBER) AS
BEGIN
  UPDATE tickets SET status = 'Closed', updated_at = SYSTIMESTAMP
   WHERE id = p_ticket_id AND status = 'Resolved';
  IF SQL%ROWCOUNT = 0 THEN
    RAISE_APPLICATION_ERROR(-20001, 'Ticket is not Resolved');
  END IF;
  INSERT INTO activity_logs (ticket_id, action, performed_by, created_at)
  VALUES (p_ticket_id, 'status_changed', p_user_id, SYSTIMESTAMP);
  COMMIT;
END;
```
"This mirrors my state-machine rule that only a Resolved ticket can be Closed, and the audit log write, but inside the database."
> gotcha | Follow-up they'll ask
Procedure vs function? (A function returns a value and can be used inside a SELECT; a procedure is called for its side effects and can have OUT parameters.)

### What is a trigger? Would you use one for an audit log?
> weak
"A trigger runs automatically, so yes, always."
> strong
"A trigger is PL/SQL (or T-SQL) that runs automatically on INSERT, UPDATE or DELETE of a table. It's reliable for an audit trail, because every change is captured even if someone updates the table directly, which matters in payments. The downside is hidden logic: developers don't see it in the application code and it can slow writes. In TicketDesk the audit log is written in the service layer; for a fraud system I'd consider a trigger or the database's built-in auditing for tables that must never be changed silently."
> gotcha | Follow-up they'll ask
`:OLD` and `:NEW`? (In an Oracle row trigger they hold the row values before and after the change.)

### How do you get the id of a row you just inserted, in Oracle and SQL Server?
> weak
"SELECT MAX(id) after the insert." (Breaks when two users insert at the same time.)
> strong
Oracle:
```
INSERT INTO transactions (account_id, amount) VALUES (:acc, :amt)
RETURNING id INTO :new_id;
```
SQL Server:
```
INSERT INTO transactions (account_id, amount)
OUTPUT INSERTED.id
VALUES (@acc, @amt);
```
"`SCOPE_IDENTITY()` also works in SQL Server. Never `MAX(id)`: under concurrency it can return someone else's row."
> gotcha | Follow-up they'll ask
Sequence vs identity column in Oracle? (A sequence is a separate object you call with `seq.NEXTVAL` and can share; identity, since 12c, is tied to one column and filled automatically.)

### Write an upsert with MERGE: update an account's daily stats, or insert them if missing.
> weak
"SELECT first, then INSERT or UPDATE in the app." (Two users can both see 'missing' and both insert.)
> strong
SQL Server:
```
MERGE INTO account_stats AS t
USING (SELECT @acc AS account_id, @amt AS amount) AS s
  ON t.account_id = s.account_id
WHEN MATCHED THEN
  UPDATE SET t.txn_count = t.txn_count + 1, t.total = t.total + s.amount
WHEN NOT MATCHED THEN
  INSERT (account_id, txn_count, total) VALUES (s.account_id, 1, s.amount);
```
Oracle: the same shape, with `USING (SELECT :acc AS account_id, :amt AS amount FROM dual) s`, the ON condition in brackets, and no `AS` before table aliases.
"One statement, so there's no gap between the check and the write. Add a unique key on `account_id` too."
> gotcha | Follow-up they'll ask
Why does SQL Server need the final semicolon? (MERGE must be terminated with `;`, or it's a syntax error.)

### Which Oracle data types would you use for a transactions table?
> weak
"VARCHAR for everything."
> strong
"`NUMBER(18,2)` for amounts, never `FLOAT`. `NUMBER` or an identity for ids. `VARCHAR2(n)` for text like a merchant name; `CHAR(3)` for fixed-length codes like `INR`. `TIMESTAMP WITH TIME ZONE` for when it happened, since `DATE` only goes to seconds and has no time zone. `CLOB` for large text like a JSON payload. A `CHECK (amount > 0)` and `NOT NULL` where it matters. SQL Server equivalents: `DECIMAL(18,2)`, `NVARCHAR`, `DATETIME2` or `DATETIMEOFFSET`, `NVARCHAR(MAX)`."
> gotcha | Follow-up they'll ask
Oracle has no BOOLEAN column type (before 23c). What do you use? (`NUMBER(1)` or `CHAR(1)` with a CHECK constraint, like `CHECK (is_flagged IN (0, 1))`.)

### View vs materialized view?
> weak
"A view is a saved query."
> strong
"A view stores only the query; each time you select from it, the query runs, so data is always current. It's good for hiding complexity or exposing only some columns for security. A materialized view stores the result physically and is refreshed on a schedule or on commit, so reads are fast but data can be slightly stale. It suits heavy reports, like daily fraud totals per merchant. SQL Server's closest equivalent is an indexed view."
> gotcha | Follow-up they'll ask
Can you INSERT into a view? (Into a simple one-table view, often yes. Views with joins or aggregates usually not, unless you use an INSTEAD OF trigger.)

### The transactions table has 2 billion rows and queries are slow. What would you suggest?
> weak
"Buy a bigger server."
> strong
"First, check the execution plans and add or fix indexes for the real query patterns. Then partition the table, usually by date range, like one partition per month: queries for 'last 7 days' only scan recent partitions (partition pruning), and old partitions can be archived or dropped quickly. Keep hot recent data separate from cold history, precompute reports with materialized views or summary tables, and always paginate. Both Oracle and SQL Server support table partitioning."
> gotcha | Follow-up they'll ask
Partitioning vs sharding? (Partitioning splits a table inside one database; sharding splits data across several database servers.)

## MS SQL Server

### WHERE vs HAVING, and DELETE vs TRUNCATE vs DROP?
> weak
"HAVING is used with GROUP BY." / "They all delete."
> strong
"`WHERE` filters rows before grouping; `HAVING` filters groups after `GROUP BY`, so it can use `COUNT(*)` or `SUM`. `DELETE` removes chosen rows, can have a WHERE, fires triggers, and is fully logged so it can be rolled back. `TRUNCATE` removes all rows quickly, resets the identity, and can't have a WHERE. `DROP` removes the table itself, structure and all."
> gotcha | Follow-up they'll ask
Order a SELECT is logically processed in? (FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY. That's why you can't use a SELECT alias in WHERE.)

### Write it: accounts with more than 3 transactions in the last 10 minutes.
> show | Table
`transactions(id, account_id, amount, created_at)`
> weak
`SELECT * FROM transactions WHERE COUNT(*) > 3` (aggregate in WHERE is an error).
> strong
SQL Server:
```
SELECT account_id, COUNT(*) AS txn_count, SUM(amount) AS total
FROM transactions
WHERE created_at >= DATEADD(MINUTE, -10, SYSDATETIME())
GROUP BY account_id
HAVING COUNT(*) > 3;
```
Oracle: change the WHERE to `created_at >= SYSTIMESTAMP - INTERVAL '10' MINUTE`.
"An index on `(created_at, account_id)` or `(account_id, created_at)` keeps this fast on a big table."
> gotcha | Follow-up they'll ask
Find transactions less than 30 seconds after the same account's previous one. (`LAG(created_at) OVER (PARTITION BY account_id ORDER BY created_at)` in a CTE, then `DATEDIFF(SECOND, prev_at, created_at) < 30`.)

### Second-highest transaction amount, and the top transaction per account.
> weak
`SELECT MAX(amount) FROM transactions WHERE amount < (SELECT MAX(amount) FROM transactions)` (works for second highest, but can't extend to "top N per group").
> strong
Window functions work in both SQL Server and Oracle:
```
WITH ranked AS (
  SELECT account_id, id, amount,
         ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY amount DESC) AS rn
  FROM transactions
)
SELECT account_id, id, amount FROM ranked WHERE rn = 1;
```
"For the overall second highest, use `DENSE_RANK() OVER (ORDER BY amount DESC)` and keep rank 2, so ties don't break it."
> gotcha | Follow-up they'll ask
ROW_NUMBER vs RANK vs DENSE_RANK? (Ties: ROW_NUMBER gives 1,2,3; RANK gives 1,1,3; DENSE_RANK gives 1,1,2.)

### Find and remove duplicate rows.
> weak
"Use DISTINCT." (That hides duplicates in a result; it doesn't remove them.)
> strong
Find them:
```
SELECT account_id, amount, created_at, COUNT(*) AS copies
FROM transactions
GROUP BY account_id, amount, created_at
HAVING COUNT(*) > 1;
```
Remove all but one (SQL Server lets you delete through a CTE):
```
WITH d AS (
  SELECT ROW_NUMBER() OVER (PARTITION BY account_id, amount, created_at ORDER BY id) AS rn
  FROM transactions
)
DELETE FROM d WHERE rn > 1;
```
"Then add a unique constraint or an idempotency key so it can't happen again. TicketDesk's `x-request-id` header exists to stop duplicate ticket creation on retries, and a payment system needs the same idea."
> gotcha | Follow-up they'll ask
How does Oracle do the delete? (`DELETE FROM transactions WHERE ROWID NOT IN (SELECT MIN(ROWID) FROM transactions GROUP BY account_id, amount, created_at)`.)

### Clustered vs non-clustered index?
> weak
"Clustered is faster."
> strong
"A clustered index is the table itself, stored in that key's order, so there's only one per table; in SQL Server the primary key is clustered by default. A non-clustered index is a separate structure with the key and a pointer back to the row; you can have many. A covering index includes every column a query needs (with `INCLUDE`), so SQL Server never touches the table. Indexes speed up reads but slow inserts and updates, which matters on a high-volume transactions table."
> gotcha | Follow-up they'll ask
How do you find why a query is slow? (Look at the actual execution plan: table or index scans, key lookups, missing-index hints. In Oracle, `EXPLAIN PLAN FOR ...`.)

### Transactions, isolation levels and deadlocks in SQL Server.
> weak
"A transaction groups queries."
> strong
"`BEGIN TRAN ... COMMIT`, with `ROLLBACK` in a `TRY...CATCH` on error, makes several writes all-or-nothing, like debiting one account and crediting another. Isolation levels trade correctness for concurrency: READ UNCOMMITTED allows dirty reads; READ COMMITTED is the default; REPEATABLE READ and SERIALIZABLE lock more; SNAPSHOT reads a consistent version without blocking writers. A deadlock is two transactions each waiting for a lock the other holds; SQL Server kills one as the victim, so the app should retry it, and you reduce deadlocks by touching tables in the same order and keeping transactions short."
> gotcha | Follow-up they'll ask
Write the TicketDesk status change as one transaction. (See the Transactions card in the SQL redesign section.)

### Primary key vs unique key vs foreign key. Which constraints would you add to a transactions table?
> weak
"Primary key is the id."
> strong
"A primary key uniquely identifies each row, can't be NULL, and there's one per table. A unique key also enforces uniqueness, there can be several, and SQL Server allows one NULL in it. A foreign key makes a column point to a real row in another table, so you can't have a transaction for an account that doesn't exist. For transactions: PK on `id`, FK `account_id` → `accounts.id`, UNIQUE on `idempotency_key`, `CHECK (amount > 0)`, `NOT NULL` on amount, currency and created time, and a `DEFAULT SYSDATETIME()` for the timestamp."
> gotcha | Follow-up they'll ask
What happens when you delete an account that has transactions? (The FK blocks it by default. `ON DELETE CASCADE` would delete the transactions too, which you'd never want for financial records. Use a soft delete instead.)

### Write a T-SQL stored procedure with parameters. Why use stored procedures?
> weak
"Stored procedures are faster."
> strong
```
CREATE PROCEDURE dbo.usp_GetAccountTxns
  @AccountId INT,
  @Days INT = 7
AS
BEGIN
  SET NOCOUNT ON;
  SELECT id, amount, created_at
  FROM dbo.transactions
  WHERE account_id = @AccountId
    AND created_at >= DATEADD(DAY, -@Days, SYSDATETIME())
  ORDER BY created_at DESC;
END;

EXEC dbo.usp_GetAccountTxns @AccountId = 42, @Days = 30;
```
"Benefits: parameters prevent injection, the plan is cached and reused, permissions can be granted on the procedure instead of the tables, and logic shared by several apps lives in one place. The cost: business logic split between app and database is harder to test and version, so I'd keep core rules in the service layer unless the team prefers procedures."
> gotcha | Follow-up they'll ask
What does SET NOCOUNT ON do? (Stops the "n rows affected" messages, which saves network traffic and avoids confusing some drivers.)

### List customers who have never made a transaction. Give two ways.
> weak
`SELECT * FROM customers WHERE id NOT IN (SELECT customer_id FROM transactions)` (breaks if any customer_id is NULL: it returns no rows.)
> strong
```
SELECT c.id, c.name
FROM customers c
LEFT JOIN transactions t ON t.customer_id = c.id
WHERE t.id IS NULL;

SELECT c.id, c.name
FROM customers c
WHERE NOT EXISTS (SELECT 1 FROM transactions t WHERE t.customer_id = c.id);
```
"Both work in SQL Server and Oracle. `NOT EXISTS` is usually my choice: it's clear and safe with NULLs. `NOT IN` returns nothing at all if the subquery contains a NULL."
> gotcha | Follow-up they'll ask
INNER JOIN vs LEFT JOIN in one line? (INNER keeps only matches; LEFT keeps every left row, with NULLs where there's no match.)

### Write a running balance per account.
> weak
A correlated subquery that re-sums all earlier rows for each row, with no thought for performance.
> strong
```
SELECT account_id, created_at, amount,
       SUM(amount) OVER (PARTITION BY account_id
                         ORDER BY created_at, id
                         ROWS UNBOUNDED PRECEDING) AS running_balance
FROM transactions
ORDER BY account_id, created_at, id;
```
"A window function does it in one pass and works in both databases. `id` in the ORDER BY breaks ties when two transactions share a timestamp. `ROWS` instead of the default `RANGE` avoids surprises with duplicate timestamps and is faster in SQL Server."
> gotcha | Follow-up they'll ask
Daily totals for the last 7 days? (`GROUP BY CAST(created_at AS DATE)` in SQL Server, `TRUNC(created_at)` in Oracle, with a WHERE on the last 7 days.)

### How does NULL behave? COUNT(*) vs COUNT(column), NULL = NULL, ISNULL vs COALESCE.
> weak
"NULL means zero."
> strong
"NULL means unknown, not zero or empty. `NULL = NULL` is unknown, not true, so you must write `IS NULL` / `IS NOT NULL`. `COUNT(*)` counts rows; `COUNT(col)` skips NULLs; `SUM` and `AVG` ignore NULLs too, so `AVG` of (100, NULL) is 100, not 50. `ISNULL(x, 0)` is SQL Server only and takes two arguments; Oracle's version is `NVL`. `COALESCE(a, b, c)` is standard, works in both, and returns the first non-NULL."
> gotcha | Follow-up they'll ask
Where do NULLs sort? (SQL Server puts them first in ascending order; Oracle puts them last. Oracle supports `NULLS FIRST` / `NULLS LAST`.)

### CTE vs subquery vs temp table vs table variable?
> weak
"They're all the same."
> strong
"A subquery is a query inside another. A CTE (`WITH name AS (...)`) is a named subquery for one statement: it's more readable, can be referenced several times, and can be recursive, for example for an org chart. A temp table (`#t`) is a real table in tempdb for the session: it can be indexed, has statistics, and suits big intermediate results reused by several statements. A table variable (`@t`) is scoped to the batch, good for small sets. Oracle uses global temporary tables instead."
> gotcha | Follow-up they'll ask
Does a CTE improve performance? (Not by itself. It's usually inlined like a subquery; it's for readability.)

## Docker for this role

### Which Docker commands do you use day to day?
> weak
"docker run."
> strong
"`docker compose up -d --build` to start the stack, `docker compose ps` to see what's running, `docker compose logs -f backend` to follow logs, `docker exec -it <container> sh` to get a shell inside, `docker compose down` to stop (add `-v` only if I really want to wipe volumes). For images: `docker build -t name:tag .`, `docker images`, `docker push`. For cleanup: `docker system prune`."
> gotcha | Follow-up they'll ask
CMD vs ENTRYPOINT? (ENTRYPOINT is the fixed executable; CMD is the default arguments, easy to override at `docker run`.)

### A container keeps restarting. How do you debug it?
> weak
"Rebuild it."
> strong
"`docker compose ps` to see the status and exit code, then `docker compose logs backend` for the error. Common causes: a missing environment variable, the database not ready yet (`depends_on` only waits for the container to start, not for Mongo or SQL Server to accept connections, so use a healthcheck), the wrong hostname (inside compose it's the service name, like `mongo`, not `localhost`), or a port already in use on the host."
> gotcha | Follow-up they'll ask
How do you run SQL Server in Docker for local development? (`mcr.microsoft.com/mssql/server` image with `ACCEPT_EULA=Y`, `MSSQL_SA_PASSWORD`, port 1433, and a named volume for data.)

### What does "ports: 8080:5050" mean, and how do containers talk to each other?
> weak
"It opens the port."
> strong
"It's `host:container`: port 8080 on my machine forwards to port 5050 inside the container. Containers in the same compose project share a network and reach each other by service name, so the backend connects to `mongodb://mongo:27017`, not `localhost`, which inside a container means the container itself. You only need to publish ports that something outside Docker must reach, like the frontend and API; the database can stay internal."
> gotcha | Follow-up they'll ask
Why might it be bad to publish the database port? (Anyone who can reach the host can try to connect to it. Keep it on the internal network.)

### Named volume vs bind mount?
> weak
"Both store data."
> strong
"A named volume is storage Docker manages, like `mongo-data:/data/db`. It survives `docker compose down` and container rebuilds, which is right for databases. A bind mount maps a host folder into the container, like `./uploads:/app/uploads`, which is handy for development hot reload or when the host needs to see the files. Without either, data written inside a container is lost when the container is removed."
> gotcha | Follow-up they'll ask
How do you back up a database running in Docker? (Use the database's dump tool, like `mongodump`, `sqlcmd BACKUP DATABASE` or Oracle Data Pump, from inside the container, then copy the file out. Don't just copy volume files while it's running.)

### How do you pass configuration and secrets into a container?
> weak
"Copy the .env file into the image."
> strong
"Never bake secrets into the image: anyone who pulls it can read every layer. Pass config at run time with `environment:` or `env_file:` in compose, or `-e` with `docker run`. In production use the platform's secret store, like Docker secrets, Kubernetes Secrets or a cloud secret manager. Add `.env` to `.dockerignore` so `COPY . .` can't sneak it in, which is one of the gaps in TicketDesk's Docker setup."
> gotcha | Follow-up they'll ask
ARG vs ENV in a Dockerfile? (ARG exists only at build time; ENV is set in the image and visible at run time.)

## REST APIs and backend

### Design a REST API for submitting a payment transaction for a fraud check.
> weak
"POST /checkFraud with the data."
> strong
"`POST /api/v1/transactions` with amount, currency, account and merchant. It's authenticated with an API key or OAuth client token, because it's server to server. It needs an `Idempotency-Key` header so a retry never creates two transactions. Validate input and return 400 or 422 with field errors. Return 201 with the transaction id and a decision like approve, review or decline. `GET /api/v1/transactions/:id` returns the status. Every decision is written to an audit log. If scoring is slow, return 202 Accepted and notify the client later with a webhook."
> gotcha | Follow-up they'll ask
What does a webhook need to be safe? (An HMAC signature header the receiver verifies, a timestamp to stop replays, and retries with backoff.)

### How do you secure a backend API?
> weak
"Use JWT."
> strong
"Layers: HTTPS everywhere; authentication (JWT for users, API keys or OAuth client credentials for services); authorisation checked on the server for every request, like TicketDesk's `permit` middleware; input validation on every write; parameterised queries; rate limiting and lockout on login; security headers with helmet; CORS limited to known origins; secrets in environment variables; and logs that never contain passwords, tokens or full card numbers."
> gotcha | Follow-up they'll ask
What is PCI DSS in one line? (The card-industry security standard: if you store, process or transmit card data you must protect it, for example by never storing the CVV and masking card numbers.)

### How do services authenticate to each other?
> weak
"Send the username and password."
> strong
"Options, from simplest: an API key in a header, stored hashed on the server and rotatable; OAuth 2.0 client credentials, where the service gets a short-lived access token from an auth server; or mutual TLS, where both sides present certificates. For a payments partner calling a fraud API, I'd expect OAuth client credentials or mTLS plus an HMAC signature on the request body so it can't be tampered with. Whatever the method, use HTTPS and give each client its own credentials so one can be revoked."
> gotcha | Follow-up they'll ask
What is HMAC? (A hash of the message made with a shared secret. The receiver recomputes it; if it matches, the message is genuine and unchanged.)

### How would you rate-limit API clients, and what should the response look like?
> weak
"Block them."
> strong
"Limit per API key or client, not just per IP, because many clients sit behind one IP. Use a fixed or sliding window or a token bucket, stored in Redis so all server instances share the counts. When the limit is hit, return 429 Too Many Requests with a `Retry-After` header and the standard error body. TicketDesk does this on login with express-rate-limit, 5 attempts per 15 minutes per IP."
> gotcha | Follow-up they'll ask
Why Redis instead of in-memory counters? (In-memory counts are per process; with three instances a client gets three times the limit.)

### When would you process requests asynchronously with a queue?
> weak
"When it's slow."
> strong
"When the work is slow, can be retried, or doesn't need to finish before replying: sending emails or notifications, generating reports, retraining scores, or calling a slow third party. The API saves the request, publishes a message to a queue like RabbitMQ, Kafka or SQS, and returns 202 Accepted with an id. Workers consume messages, and failed ones go to a dead-letter queue. The real-time fraud decision itself usually stays synchronous because the payment is waiting for it."
> gotcha | Follow-up they'll ask
Kafka vs RabbitMQ in one line? (Kafka is a durable, replayable event log for high-volume streams; RabbitMQ is a message broker focused on routing tasks to workers.)

### How do you document and test your APIs?
> weak
"I test in the browser."
> strong
"Documentation: OpenAPI/Swagger, generated from annotations, so it stays next to the code. TicketDesk serves it at `/api-docs`. Manual and exploratory testing: a Postman collection with environment variables and a login script that saves the token automatically. Automated: Jest unit tests for pure logic like the state machine, and Supertest integration tests that call the real Express app against an in-memory database, run on every push in CI."
> gotcha | Follow-up they'll ask
What is contract testing? (Checking that the provider's API still matches what consumers expect, so a change doesn't silently break them.)

## Frontend

### How does your React frontend talk to the backend, and how do you handle errors and loading?
> weak
"I call fetch in the component."
> strong
"All API calls live in a services layer, like TicketDesk's `ticketService.js`, using one Axios instance that adds the Bearer token and handles a 401 by refreshing or logging out. Components call the service inside `useEffect`, keep `loading`, `error` and `data` in state, show a spinner and a friendly message, and use a `cancelled` flag in the cleanup so a slow response doesn't update an unmounted page. Forms validate on the client for user experience, but the server validates again because the client can't be trusted."
> gotcha | Follow-up they'll ask
fetch vs Axios? (fetch is built in but doesn't reject on 4xx/5xx and needs manual JSON. Axios rejects on error status, has interceptors and parses JSON automatically.)

### Without React, how would you build a simple form that posts to an API?
> weak
"I only know React."
> strong
"Plain HTML and JavaScript: a `<form>` with labelled inputs and `required` attributes, a submit listener that calls `event.preventDefault()`, reads the values with `new FormData(form)`, disables the button, sends `fetch('/api/x', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })`, checks `response.ok`, and shows the result or error in the page. React just automates the state and re-rendering parts of this."
> gotcha | Follow-up they'll ask
How do you make it work on mobile? (Viewport meta tag, flexible layout with Flexbox or Grid, media queries, and input types like `email` and `number`.)

### Build a transactions table with filters, sorting and pagination. Where does each part run?
> weak
"Fetch all rows and filter them in React."
> strong
"Filtering, sorting and pagination run on the server, because there could be millions of rows. The UI keeps filter, sort and page in state, ideally mirrored in the URL query string so a page can be shared or refreshed, and refetches when they change. That's how TicketDesk's TicketList works with `TicketContext`. Debounce the search box, show loading and empty states, and keep the previous page visible while the next one loads."
> gotcha | Follow-up they'll ask
Why put filters in the URL? (Refresh, back button and shared links all keep the same view.)

### How do you show amounts and dates correctly for Indian users?
> weak
"`'₹' + amount`."
> strong
"Use the built-in `Intl` APIs: `new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(125000.5)` gives `₹1,25,000.50` with the Indian lakh grouping. Dates with `Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' })`. Store and send times in UTC, ISO 8601 format, and convert to the user's time zone only in the UI. If amounts are stored in paise, divide by 100 only at display time."
> gotcha | Follow-up they'll ask
Why not format on the server? (The server doesn't know the user's locale and time zone; the browser does.)

### You hide the "Delete" button from non-admins in React. Is that enough?
> weak
"Yes, they can't click it."
> strong
"No. Hiding a button is only user experience. Anyone can call the API directly with Postman or the browser console, so the server must check permissions on every request. In TicketDesk the frontend hides actions using `utils/permissions.js`, but `permit.js` on the backend is what actually enforces the permission matrix and returns 403."
> gotcha | Follow-up they'll ask
What's a protected route? (A wrapper that redirects to login if the user isn't authenticated. Again UX only; the API still checks the token.)

### How does a dashboard update in real time without the user refreshing?
> weak
"Refresh the page every few seconds."
> strong
"Polling works but wastes requests. Better: the server pushes updates over a WebSocket, like Socket.io, or Server-Sent Events. In TicketDesk the notification bell subscribes to a `notification:new` event on the shared socket connection, so the unread count updates the moment a ticket is assigned. On reconnect, the client refetches once over REST to catch anything missed while it was offline."
> gotcha | Follow-up they'll ask
Which would you choose for a one-way feed of fraud alerts? (SSE is enough and simpler; WebSocket if the client also sends messages.)

## Git and GitHub

### Walk me through your daily Git workflow on a team.
> weak
"git add, git commit, git push to main."
> strong
"Pull the latest main, create a feature branch like `feature/ticket-assign`, commit small focused changes with clear messages, push the branch, open a pull request on GitHub, let CI run the tests, address review comments, then merge, often as a squash merge, and delete the branch. I never push directly to main, and protected branches enforce that."
> gotcha | Follow-up they'll ask
What goes in `.gitignore`? (`node_modules`, `.env`, logs, build output, uploads. TicketDesk ignores `uploads/` and `logs/`.)

### You committed the wrong thing. How do you undo it?
> weak
"Delete the folder and clone again."
> strong
"It depends whether it's pushed. Not pushed: `git reset --soft HEAD~1` undoes the commit but keeps the changes staged; `git commit --amend` fixes the last commit. Already pushed to a shared branch: `git revert <hash>` makes a new commit that undoes it without rewriting history. `git stash` parks uncommitted work so I can switch branches. If I committed a secret, I rotate the secret immediately, because it stays in history."
> gotcha | Follow-up they'll ask
`git fetch` vs `git pull`? (fetch downloads remote changes without touching your branch; pull is fetch plus merge or rebase.)

### Git Flow vs trunk-based development? How do you ship a hotfix?
> weak
"We all work on main."
> strong
"Git Flow has long-lived `develop` and `main` branches plus feature, release and hotfix branches. It's structured but heavy and slow. Trunk-based development has everyone merging small, short-lived branches into main daily, with CI and feature flags keeping main releasable; most modern teams use this. Hotfix: branch from what's in production (main or the release tag), fix, test, PR, deploy, then make sure the fix is merged back into any other active branch, with `git cherry-pick` if needed."
> gotcha | Follow-up they'll ask
What does `git cherry-pick <hash>` do? (Copies one specific commit onto the current branch as a new commit.)

### What do you check when reviewing a pull request?
> weak
"That it works."
> strong
"Does it do what the ticket asks, and are edge cases and errors handled? Are there tests, and do they pass in CI? Is it secure: input validated, permissions checked, no secrets or sensitive data logged? Is it readable and consistent with the codebase? Any performance issues like N+1 queries or missing indexes? I keep comments specific and kind, separate must-fix from nice-to-have, and prefer small PRs because they're reviewed properly."
> gotcha | Follow-up they'll ask
What makes a good commit message? (A short imperative summary like "Add lockout after 5 failed logins", then a body explaining why if it's not obvious.)

### Write a GitHub Actions workflow that runs the backend tests on every push.
> weak
"GitHub does it automatically."
> strong
`.github/workflows/ci.yml`:
```
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
```
"TicketDesk's tests use an in-memory MongoDB, so they need no database service. For SQL Server tests I'd add a `services:` container. Branch protection then blocks merging unless this check is green."
> gotcha | Follow-up they'll ask
Where do secrets go in GitHub Actions? (Repository or environment secrets, read as `${{ secrets.NAME }}`. Never in the YAML.)

## Code, deployment and servers

### Which Linux commands do you use on a server?
> weak
"ls and cd."
> strong
"Navigation and files: `ls -la`, `cd`, `cat`, `less`, `tail -f app.log` to follow logs, `grep -i error app.log`. Processes: `ps aux | grep node`, `top` or `htop`, `kill <pid>`. Network and ports: `curl localhost:5050/api/health`, `lsof -i :5050` or `ss -tulpn` to see what's on a port. Disk and memory: `df -h`, `du -sh *`, `free -m`. Access: `ssh user@host`, `scp` to copy files, `chmod` and `chown` for permissions, `sudo systemctl status nginx` for services."
> gotcha | Follow-up they'll ask
What does `chmod 755` mean? (Owner read/write/execute; group and others read/execute.)

### How would you deploy a Node app on a Linux server?
> weak
"Run node server.js."
> strong
"Install Node, clone the repo, `npm ci --omit=dev`, set environment variables, not a committed `.env`. Run it under a process manager like PM2 or systemd so it restarts on crash and on reboot. Put Nginx in front as a reverse proxy: it terminates HTTPS, serves the static React build, and forwards `/api` and the WebSocket upgrade for Socket.io to Node. Open only ports 80 and 443 in the firewall. Or run the same thing as Docker containers, which is how TicketDesk is set up."
> gotcha | Follow-up they'll ask
Why a reverse proxy instead of exposing Node on port 80? (TLS, static files, compression, load balancing across instances, and not running Node as root.)

### What are dev, staging and production environments?
> weak
"Different servers."
> strong
"Dev is my machine, with debug logs and test data. Staging mirrors production as closely as possible and is where we test a release before users see it. Production is real users and real data, with strict access, monitoring and backups. The same code runs in each; only configuration changes, through environment variables. TicketDesk has `config/dev.js` and `config/prod.js` for exactly this, for example trusting the proxy only in production."
> gotcha | Follow-up they'll ask
Why never test on production data? (Privacy laws and real money. Use masked or synthetic data.)

### Production is down at 2 a.m. What do you do?
> weak
"Restart the server."
> strong
"First confirm and tell the team. Check the health endpoint and monitoring. Read the latest error logs. In TicketDesk that's Winston's `error.log`. Ask what changed: a recent deploy is the most likely cause, so roll back to the last good version first and investigate after. Check the basics: is the process running, is the disk full, is the database reachable, did a certificate expire. Once it's stable, write a short post-mortem with the cause and a fix so it doesn't happen again."
> gotcha | Follow-up they'll ask
What would you monitor in a payments API? (Error rate, response time like p95 and p99, request volume, DB connection pool usage, and business signals like a sudden drop in approvals.)

### What is HTTPS and how does a server get a certificate?
> weak
"HTTPS is secure HTTP."
> strong
"HTTPS is HTTP over TLS. TLS encrypts traffic so no one in between can read or change it, and the certificate proves the server is really the domain it claims, because a trusted certificate authority signed it. On a Linux server you'd typically get a free certificate from Let's Encrypt with Certbot, configure Nginx with it, and let it auto-renew every 90 days. Redirect HTTP to HTTPS and add HSTS so browsers always use HTTPS."
> gotcha | Follow-up they'll ask
Is data encrypted in the database because the site uses HTTPS? (No. HTTPS protects data in transit. Encryption at rest is separate.)

### How do you schedule a job to run every night on a Linux server?
> weak
"Keep a setTimeout running."
> strong
"Use cron. `crontab -e` and add a line with five fields, minute hour day-of-month month day-of-week, then the command."
```
0 2 * * * /usr/bin/node /app/scripts/daily-report.js >> /var/log/daily-report.log 2>&1
```
"That runs at 2:00 every day and appends output and errors to a log. In a containerised setup you'd use a Kubernetes CronJob or a scheduler service instead, and make the job safe to run twice."
> gotcha | Follow-up they'll ask
What does `*/15 * * * *` mean? (Every 15 minutes.)

### How do you deploy without downtime?
> weak
"Deploy at night."
> strong
"Run at least two instances behind a load balancer and replace them one at a time (rolling update), checking each passes its health check before moving on. Or blue-green: bring up the new version beside the old one, test it, then switch traffic, with instant rollback by switching back. On a single server, `pm2 reload` restarts cluster workers one by one. Database changes must be backward compatible, like adding a column before code uses it, so old and new code can run together."
> gotcha | Follow-up they'll ask
What is a canary release? (Send a small share of traffic, like 5%, to the new version, watch the error rate, then roll out to everyone.)

### How do you protect the database against data loss?
> weak
"The cloud handles it."
> strong
"Automated regular backups: full backups plus transaction log backups (SQL Server) or archive logs (Oracle) for point-in-time recovery. Store copies in another location. Encrypt them. Most importantly, test restores regularly, because an untested backup isn't a backup. Use replication or Always On / Data Guard for high availability, and remember replication copies mistakes too, like an accidental DELETE, which is why point-in-time backups still matter."
> gotcha | Follow-up they'll ask
RPO vs RTO? (RPO: how much data you can afford to lose, measured in time. RTO: how long you can afford to be down.)

### The server's disk is full and the app is failing. What do you do?
> weak
"Restart it."
> strong
"Confirm with `df -h`, then find what's big with `du -sh /* | sort -h` and drill down. Usually it's logs, old Docker images, or temp files. Free space safely: compress or delete old rotated logs, `docker system prune` for unused images, clear temp files. Then fix the cause: set up log rotation with `logrotate` or Winston's daily rotate, cap Docker log sizes, and add a disk-usage alert at, say, 80%."
> gotcha | Follow-up they'll ask
You deleted a huge log file but the space didn't come back. Why? (A running process still has it open. Restart that process or truncate the file instead of deleting it.)

## Fraud and payments scenarios

### How would you detect a suspicious login?
> weak
"Check the password."
> strong
"Combine signals into a risk score: many failed attempts on one account or from one IP, a new device or browser, a location or IP far from usual, impossible travel (two countries within an hour), logins at an unusual time, or a known bad IP. Low risk: allow. Medium: step-up check like an OTP. High: block and alert. My project has the first layer, a rate limit per IP and account lockout after 5 failed passwords; the rest would build on that with the extra signals stored per login."
> gotcha | Careful
Say "my project has the first layer". Don't claim TicketDesk does fraud scoring.

### Two requests try to debit the same account at the same moment. How do you stop it going negative?
> weak
"Check the balance first, then update." (Both requests can read the same balance before either writes.)
> strong
"Make the check and the write one atomic step:"
```
UPDATE accounts
SET balance = balance - @amount
WHERE id = @id AND balance >= @amount;
```
"If 0 rows were affected, there wasn't enough money. Alternatives: lock the row inside a transaction with `SELECT ... FOR UPDATE` in Oracle or `WITH (UPDLOCK, ROWLOCK)` in SQL Server, or optimistic locking with a version column. Add an idempotency key so a retried request doesn't debit twice."
> gotcha | Follow-up they'll ask
Optimistic vs pessimistic locking? (Pessimistic locks the row up front; optimistic lets both proceed and rejects the write if the version changed. Optimistic suits low contention.)

### A genuine customer's payment was blocked as fraud. What does that tell you about the system?
> weak
"The system made a mistake, fix the bug."
> strong
"That's a false positive. Every fraud system trades off two errors: blocking genuine customers (false positives) and letting fraud through (false negatives). Lowering the threshold catches more fraud but blocks more real people. The fix is rarely one bug: look at which rule or score caused it, check whether a step-up like an OTP would have been better than a hard block, give the customer a fast way to get unblocked, and feed the case back as labelled data."
> gotcha | Follow-up they'll ask
Explain precision and recall. (Precision: of the transactions we flagged, how many were really fraud. Recall: of all real fraud, how much we caught. Fraud data is very imbalanced, so plain accuracy is misleading: 99.9% accuracy is easy if you never flag anything.)

### How do you protect sensitive customer data like card numbers and phone numbers?
> weak
"Encrypt the database."
> strong
"Collect only what's needed. Never store CVV. Tokenise or encrypt card numbers, and show only the last four digits. Encrypt in transit with TLS and at rest, for example with Transparent Data Encryption in SQL Server and Oracle, plus column-level encryption for the most sensitive fields. Hash what you only need to compare, like passwords with bcrypt. Restrict access by role, audit who reads sensitive data, mask it in logs and non-production databases, and keep secrets in a secret manager."
> gotcha | Follow-up they'll ask
Encryption vs hashing vs tokenisation? (Encryption is reversible with a key; hashing is one-way; tokenisation replaces the value with a random token and keeps the real value in a secure vault.)

### Design a simple rule engine that flags risky transactions.
> weak
"Write lots of if statements in the controller."
> strong
"Store rules as data, not code, so analysts can change them without a deploy: for example `amount > 50000`, `more than 5 transactions in 10 minutes`, or `card country differs from IP country`, each with a weight. On each transaction, the service loads the active rules (cached), evaluates them, adds up a score, and returns approve, review or decline by threshold. Velocity rules need fast counters, like Redis keys with expiry. Every decision is saved with which rules fired, for the audit trail and to tune rules later. An ML model can later add its score as one more input."
> gotcha | Follow-up they'll ask
Why record which rules fired? (To explain a decision to a customer or regulator, and to find rules causing too many false positives.)

### What is an audit trail and why does a payments company care?
> weak
"It's the logs."
> strong
"An audit trail is a permanent, time-ordered record of who did what, when, and what changed, like 'user 17 changed the decision on transaction 9001 from Decline to Approve at 14:02'. Payments companies need it for regulators, disputes, investigating fraud and catching insider misuse. It must be append-only and tamper-evident, never edited, and kept for a set retention period. TicketDesk's `ActivityLog` is the same idea at small scale, kept separate from Winston's technical logs."
> gotcha | Follow-up they'll ask
How do you make an audit table tamper-evident? (No UPDATE or DELETE permission for the app, write-once storage, or chain each row's hash with the previous row's.)

## Security

### Can an Agent take a ticket that's already assigned to another Agent?
> show | Look at
`backend/src/utils/ticketPermissions.js:50-54`
> answer | The problem
Yes, through the API. The check only verifies "assigning to yourself", not "is it already assigned".
> fix | One-line fix
For Agents, deny if `ticket.assignedTo` is set and isn't them.

### Does the login reveal which email addresses exist?
> show | Look at
`backend/src/services/authService.js:52-63`
> answer | The problem
Yes. Unknown emails always get 401, but a real, locked account gets 423. That contradicts the code's own comment about not leaking emails.
> fix | One-line fix
Return the same generic 401 for locked accounts and log the lock server-side.

### Ten wrong passwords arrive at the same instant. Is the lockout count correct?
> show | Look at
`backend/src/services/authService.js:67-76`
> answer | The problem
Not guaranteed. It reads the count, adds 1 in Node, then writes it. Parallel attempts can overwrite each other and undercount.
> fix | One-line fix
Use an atomic `$inc` with `findOneAndUpdate`.

### Where do the tokens live, and what can an XSS bug steal?
> show | Look at
`frontend/src/services/tokenStorage.js:23-29`
> answer | The problem
Both tokens, including the 7-day refresh token, sit in localStorage, readable by any injected script.
> fix | One-line fix
Put the refresh token in an `httpOnly; Secure; SameSite=Strict` cookie.

### What happens if a user searches for (a+)+$ ?
> show | Look at
`backend/src/utils/ticketQueryBuilder.js:28-43` (the TODO hint; `main` does the same)
> answer | The problem
The text goes straight into `$regex`: regex injection and possible ReDoS (very slow patterns). It also can't use an index.
> fix | One-line fix
Escape regex special characters, or use a MongoDB text index.

### What values can a client send for ?sort= ?
> show | Look at
`backend/src/validators/ticketValidators.js:30`
> answer | The problem
Any string. The validator only checks that it's a string, so any field name is passed to `.sort()`.
> fix | One-line fix
Whitelist `createdAt`, `priority`, `status`, with an optional `-`.

### Can a user upload a renamed .exe as an image?
> show | Look at
`backend/src/middlewares/upload.js:13-18`
> answer | The problem
Yes. The MIME type is trusted from the client. There is no content check and no virus scan.
> fix | One-line fix
Check magic bytes with the `file-type` package, and scan uploads.

### A ticket is reassigned from Agent A to Agent B while A has the chat open. What does A still receive?
> show | Look at
`backend/src/sockets/chatSocket.js:15-33`
> answer | The problem
A stays in the room and keeps receiving messages. Room access is only checked on join. (Sending is re-checked, so A can't send.)
> fix | One-line fix
On reassignment, remove the old agent's sockets from the room.

### How long can a chat message be?
> show | Look at
`backend/src/validators/chatValidators.js`, `backend/src/sockets/chatSocket.js:51-53`
> answer | The problem
There's no limit on the socket path. `sendChatMessageValidator` (2000 chars) exists but is never used.
> fix | One-line fix
Check `message.length <= 2000` in `chat:send`.

### A user leaves the app open for 20 minutes, the Wi-Fi drops, and comes back. Does live chat reconnect?
> show | Look at
`frontend/src/sockets/socketClient.js:17-21`
> answer | The problem
No. The socket keeps the token it was created with. After the 15-minute access token expires, reconnection is refused.
> fix | One-line fix
Use the function form: `auth: (cb) => cb({ token: getAccessToken() })`.

## Data and reliability

### The server crashes between saving the ticket and writing the activity log. What state is the data in?
> show | Look at
`backend/src/services/ticketService.js:107-136`
> answer | The problem
Inconsistent: the status changed but there's no audit entry or notification. There are no transactions anywhere.
> fix | One-line fix
`mongoose.startSession()` + `session.withTransaction()` (needs a replica set).

### An Admin deletes a ticket. What's left behind?
> show | Look at
`backend/src/services/ticketService.js:138-144`
> answer | The problem
Its comments, chat messages, activity log, notifications, and the files on disk.
> fix | One-line fix
Delete related documents and call `storage.delete()` for each attachment, inside a transaction.

### The browser retries "Create ticket" with the same x-request-id. What happens?
> show | Look at
`backend/src/middlewares/requireRequestId.js:3-9`
> answer | The problem
A duplicate ticket. The header is described as an idempotency key, but nothing enforces it.
> fix | One-line fix
Store requestId on the ticket with a unique index and return the existing ticket on a repeat.

### The state machine's comment says the rules "can never be bypassed". Is that true?
> show | Look at
`backend/src/utils/ticketStateMachine.js:9-11`, `backend/src/models/Ticket.js:38-43`
> answer | The problem
No. The model doesn't enforce the rules. Any code that sets `ticket.status` and calls save skips the state machine.
> fix | One-line fix
Add a `pre('save')` check that calls `assertTransition` when status is modified.

### Which API query actually uses the compound (status, assignedTo) index?
> show | Look at
`backend/src/models/Ticket.js:45-70`, `backend/src/services/ticketService.js:45-50`
> answer | The problem
None. The ticket list has no "assigned to me" filter, so the index serves a query nobody runs.
> fix | One-line fix
Add an `assignedTo=me` query parameter for Agents.

### A requester creates a ticket. Who gets notified?
> show | Look at
`backend/src/services/ticketService.js:10-34`
> answer | The problem
Nobody. Agents only find out by checking the list.
> fix | One-line fix
Notify all Agents (or a team room) on ticket creation.

### The server restarts. What happens to the login rate-limit counters? What about two server instances?
> show | Look at
`backend/src/middlewares/rateLimiter.js:22-34`
> answer | The problem
They reset on restart and aren't shared between instances, because the store is in memory.
> fix | One-line fix
Use a Redis store (`rate-limit-redis`).

### Page 5,000 of the ticket list is slow. Why?
> show | Look at
`backend/src/services/ticketService.js:52-56`
> answer | The problem
Offset pagination: `skip` makes the database walk past every earlier row.
> fix | One-line fix
Cursor pagination on `createdAt` + `_id`.

    rb.disabled = left <= 0;
    rb.textContent = left > 0 ? "Reveal " + (c.hidden[revealed[c.id] || 0].label.toLowerCase() || "next") + " (Space)" : "All revealed";
    document.getElementById("pRevealAll").disabled = left <= 0;
    document.getElementById("pPrev").disabled = pIndex === 0;
    document.getElementById("pNext").disabled = pIndex === pList.length - 1;
    document.querySelector(".p-body").scrollTop = freshIndex >= 0 ? document.querySelector(".p-body").scrollHeight : 0;
  }
  function pMove(d) { var n = pIndex + d; if (n < 0 || n >= pList.length) return; pIndex = n; renderPresenter(-1); }
  function pReveal() { var c = pList[pIndex]; var i = revealNext(c); if (i >= 0) renderPresenter(i); }
  function pRevealAll() { var c = pList[pIndex]; var from = revealed[c.id] || 0; revealed[c.id] = c.hidden.length; renderPresenter(from); }
  function pRandom() {
    var pool = pList.filter(function (c, i) { return i !== pIndex && !covered[c.id]; });
    if (!pool.length) pool = pList.filter(function (c, i) { return i !== pIndex; });
    if (!pool.length) return;
    pIndex = pList.indexOf(pool[Math.floor(Math.random() * pool.length)]);
    renderPresenter(-1);
  }

  var timerId = null, remaining = 120;
  var clock = document.getElementById("pClock");
  function fmt(s) { var m = Math.floor(Math.abs(s) / 60), r = Math.abs(s) % 60; return (s < 0 ? "-" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function stopTimer() { clearInterval(timerId); timerId = null; clock.hidden = true; clock.classList.remove("done"); document.getElementById("pTimer").textContent = "2:00 timer"; }
  function toggleTimer() {
    if (timerId) { stopTimer(); return; }
    remaining = 120; clock.textContent = fmt(remaining); clock.hidden = false;
    document.getElementById("pTimer").textContent = "Stop timer";
    timerId = setInterval(function () {
      remaining--; clock.textContent = fmt(remaining);
      clock.classList.toggle("done", remaining <= 0);
    }, 1000);
  }

  document.getElementById("present").addEventListener("click", function () { openPresenter(null); });
  document.getElementById("pClose").addEventListener("click", closePresenter);
  document.getElementById("pPrev").addEventListener("click", function () { pMove(-1); });
  document.getElementById("pNext").addEventListener("click", function () { pMove(1); });
  document.getElementById("pReveal").addEventListener("click", pReveal);
  document.getElementById("pRevealAll").addEventListener("click", pRevealAll);
  document.getElementById("pRandom").addEventListener("click", pRandom);
  document.getElementById("pTimer").addEventListener("click", toggleTimer);
  document.getElementById("pFull").addEventListener("click", function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (P.requestFullscreen) P.requestFullscreen().catch(function () {});
    } catch (e) {}
  });
  document.addEventListener("keydown", function (e) {
    if (P.hidden) return;
    if (e.target.tagName === "INPUT") return;
    var k = e.key;
    if (k === "Escape") { e.preventDefault(); closePresenter(); }
    else if (k === " " || k === "Enter") { e.preventDefault(); pReveal(); }
    else if (k === "ArrowRight") { e.preventDefault(); pMove(1); }
    else if (k === "ArrowLeft") { e.preventDefault(); pMove(-1); }
    else if (k === "a" || k === "A") { pRevealAll(); }
    else if (k === "r" || k === "R") { pRandom(); }
    else if (k === "t" || k === "T") { toggleTimer(); }
  });

  renderAll();
})();
</script>
